    arguments:
      $fixture: '@Authorization\Infrastructure\DataFixtures\AuthorizationFixtures'
      $manager: '@doctrine.orm.auth_entity_manager'
      $seedKey: 'authorization'
      $prerequisites: []
    tags:
      - { name: 'app.seed_fixture.auth' }


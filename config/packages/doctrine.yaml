doctrine:
  dbal:
    default_connection: auth
    connections:
      auth:
        url: "%env(resolve:AUTH_DATABASE_URL)%"
        profiling_collect_backtrace: "%kernel.debug%"
        use_savepoints: true
        # messenger_messages is owned by Symfony Messenger's doctrine transport
        # (the `failed` transport uses doctrine://auth), not by our mappings, so
        # its schema tracks the library version and drifts from any migration
        # that froze it. Exclude it from schema introspection: schema:validate
        # and migrations:diff ignore the framework table. Combined (AND) with the
        # tagged SchemaFilterListener that hides the migration-versions tables.
        schema_filter: ~^(?!messenger_messages)~
      main:
        url: "%env(resolve:MAIN_DATABASE_URL)%"
        profiling_collect_backtrace: "%kernel.debug%"
        use_savepoints: true
  orm:
    default_entity_manager: auth
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    enable_native_lazy_objects: true
    entity_managers:
      auth:
        connection: auth
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        identity_generation_preferences:
          Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        filters:
          tenant:
            class: Tenant\Infrastructure\Persistence\Doctrine\Filter\TenantFilter
            enabled: false
        mappings:
          OAuth:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/OAuth/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'OAuth\Infrastructure\Persistence\Doctrine\Record'
            alias: OAuth
          User:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'User\Infrastructure\Persistence\Doctrine\Record'
            alias: User
          Otp:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Otp/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Otp\Infrastructure\Persistence\Doctrine\Record'
            alias: Otp
          Authorization:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Authorization/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Authorization\Infrastructure\Persistence\Doctrine\Record'
            alias: Authorization
          Session:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Session/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Session\Infrastructure\Persistence\Doctrine\Record'
            alias: Session
          Tenant:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Tenant/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Tenant\Infrastructure\Persistence\Doctrine\Record'
            alias: Tenant
          TrustedDevice:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/TrustedDevice/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'TrustedDevice\Infrastructure\Persistence\Doctrine\Record'
            alias: TrustedDevice
          Audit:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Audit/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Audit\Infrastructure\Persistence\Doctrine\Record'
            alias: Audit
      main:
        connection: main
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        identity_generation_preferences:
          Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        mappings:
          Organization:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Organization/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Organization\Infrastructure\Persistence\Doctrine\Record'
            alias: Organization
          Facility:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Facility/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Facility\Infrastructure\Persistence\Doctrine\Record'
            alias: Facility
          Notification:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Notification/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Notification\Infrastructure\Persistence\Doctrine\Record'
            alias: Notification
          Onboarding:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Onboarding/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Onboarding\Infrastructure\Persistence\Doctrine\Record'
            alias: Onboarding
          Equipment:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Equipment/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Equipment\Infrastructure\Persistence\Doctrine\Record'
            alias: Equipment
          Inspection:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Inspection/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Inspection\Infrastructure\Persistence\Doctrine\Record'
            alias: Inspection
          Intervention:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Intervention/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Intervention\Infrastructure\Persistence\Doctrine\Record'
            alias: Intervention
          Billing:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Billing/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Billing\Infrastructure\Persistence\Doctrine\Record'
            alias: Billing
          Maintenance:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Maintenance/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Maintenance\Infrastructure\Persistence\Doctrine\Record'
            alias: Maintenance
          Automation:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Automation/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Automation\Infrastructure\Persistence\Doctrine\Record'
            alias: Automation
          Messaging:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Messaging/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Messaging\Infrastructure\Persistence\Doctrine\Record'
            alias: Messaging
          Import:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Import/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Import\Infrastructure\Persistence\Doctrine\Record'
            alias: Import
          Webhook:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Webhook/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Webhook\Infrastructure\Persistence\Doctrine\Record'
            alias: Webhook
          Approval:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Approval/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Approval\Infrastructure\Persistence\Doctrine\Record'
            alias: Approval
          Assistant:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Assistant/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Assistant\Infrastructure\Persistence\Doctrine\Record'
            alias: Assistant
          Calendar:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Calendar/Infrastructure/Persistence/Doctrine/Record'
            prefix: 'Calendar\Infrastructure\Persistence\Doctrine\Record'
            alias: Calendar
    controller_resolver:
      auto_mapping: false

when@test:
  doctrine:
    dbal:
      connections:
        auth:
          profiling_collect_backtrace: false
        main:
          profiling_collect_backtrace: false
    orm:
      auto_generate_proxy_classes: file_not_exists
      proxy_dir: "%kernel.cache_dir%/doctrine/orm/Proxies"

when@prod:
  doctrine:
    orm:
      auto_generate_proxy_classes: false
      proxy_dir: "%kernel.build_dir%/doctrine/orm/Proxies"
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system

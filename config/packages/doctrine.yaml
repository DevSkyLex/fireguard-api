doctrine:
  dbal:
    default_connection: auth
    connections:
      auth:
        url: "%env(resolve:AUTH_DATABASE_URL)%"
        profiling_collect_backtrace: "%kernel.debug%"
        use_savepoints: true
        # messenger_messages is owned by Symfony Messenger's doctrine transport
        # (the `failed` transport uses doctrine://auth), not by our mappings, so
        # its schema tracks the library version and drifts from any migration
        # that froze it. Exclude it from schema introspection: schema:validate
        # and migrations:diff ignore the framework table. Combined (AND) with the
        # tagged SchemaFilterListener that hides the migration-versions tables.
        schema_filter: ~^(?!(?:messenger_messages|http_idempotency_receipts))~
      main:
        url: "%env(resolve:MAIN_DATABASE_URL)%"
        profiling_collect_backtrace: "%kernel.debug%"
        use_savepoints: true
        schema_filter: ~^(?!(?:messenger_messages|http_idempotency_receipts))~
  orm:
    default_entity_manager: auth
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    enable_native_lazy_objects: true
    entity_managers:
      auth:
        connection: auth
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        identity_generation_preferences:
          Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        filters:
          tenant:
            class: Tenant\Infrastructure\Persistence\Doctrine\Filter\TenantFilter
            enabled: false
      main:
        connection: main
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        identity_generation_preferences:
          Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
    controller_resolver:
      auto_mapping: false

when@test:
  doctrine:
    dbal:
      connections:
        auth:
          profiling_collect_backtrace: false
        main:
          profiling_collect_backtrace: false
    orm:
      auto_generate_proxy_classes: file_not_exists
      proxy_dir: "%kernel.cache_dir%/doctrine/orm/Proxies"

when@prod:
  doctrine:
    orm:
      auto_generate_proxy_classes: false
      proxy_dir: "%kernel.build_dir%/doctrine/orm/Proxies"
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system

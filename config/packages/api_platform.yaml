api_platform:
  title: '%product.api_title%'
  description: '%product.api_description%'
  version: '%product.version%'
  # Module imports own their resource paths and exception-to-status contracts.
  # Programming exceptions stay unmapped; handlers expose explicit domain failures.
  defaults:
    stateless: true
    cache_headers:
      vary: ["Content-Type", "Authorization", "Origin"]
  swagger:
    api_keys:
      bearerAuth:
        name: 'Authorization'
        type: 'header'
  openapi:
    swagger_ui_extra_configuration:
      persistAuthorization: true

# Security schemes for OpenAPI (Swagger UI)
# This is handled by api_platform.yaml security definitions in resources

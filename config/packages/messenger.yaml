framework:
    messenger:
        failure_transport: failed
        buses:
            messenger.bus.default:
                middleware:
                    - Shared\Infrastructure\Messaging\IntegrationEventCompatibilityMiddleware

        transports:
            # PostgreSQL is the transactional outbox for main-owned events and
            # commands. Its inserts use the same connection as business writes.
            main_outbox:
                dsn: 'doctrine://main?queue_name=main_outbox&auto_setup=false'
                failure_transport: main_failed
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
                    max_delay: 600000
            main_failed: 'doctrine://main?queue_name=main_failed&auto_setup=false'
            # Auth-owned mutations enqueue on their own connection. Delivery
            # uses the shared envelope handler with separately owned receipts.
            auth_outbox:
                dsn: 'doctrine://auth?queue_name=auth_outbox&auto_setup=false'
                failure_transport: failed
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
                    max_delay: 600000
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
            sync: 'sync://'
            # Explicit "auth" connection name (not the "default" alias, which
            # is not a registered Doctrine connection name in this project —
            # see config/packages/doctrine.yaml's `default_connection: auth`).
            failed: 'doctrine://auth?queue_name=failed'

        routing:
            'Shared\Infrastructure\Messaging\Outbox\OutboxEvent': main_outbox

when@test:
    framework:
        messenger:
            transports:
                main_outbox: 'in-memory://'
                auth_outbox: 'in-memory://'
                async: 'in-memory://'

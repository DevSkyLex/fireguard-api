security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    # Custom user provider that loads users from the domain layer
    app_user_provider:
      id: Auth\Infrastructure\Security\User\SecurityUserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # API Documentation (no authentication required)
    api_docs:
      pattern: ^/api/docs
      security: false

    # Health check endpoint (no authentication required)
    api_health:
      pattern: ^/api/health$
      security: false

    # Public OAuth2 endpoints (no authentication required).
    # `oauth2/token` is anchored: without the `$`, this pattern also swallows
    # `/api/oauth2/token/revoke` and `/api/oauth2/token/introspect`, which must
    # stay authenticated — a firewall matches before access_control runs, so a
    # prefix match here silently voids their ROLE_USER rules below.
    oauth2_public:
      pattern: ^/api/(oauth2/token$|oauth2/logout|\.well-known|auth/login|auth/refresh|auth/logout|auth/mfa/verify|auth/mfa/resend|auth/password/reset|auth/register)
      security: false

    # Stripe webhook (public; Stripe signature is verified in the controller)
    billing_webhook:
      pattern: ^/api/billing/webhook$
      security: false

    # Protected API endpoints (Bearer token required)
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      custom_authenticators:
        - Auth\Infrastructure\Security\Authenticator\OAuth2Authenticator

    # Main firewall for web interface (if any)
    main:
      lazy: true
      provider: app_user_provider

  # Role hierarchy
  role_hierarchy:
    ROLE_ADMIN: [ROLE_USER, ROLE_VERIFIED]
    ROLE_SUPER_ADMIN: [ROLE_ADMIN]
    ROLE_VERIFIED: ROLE_USER

  # Access control rules
  # Note: Only the *first* access control that matches will be used
  access_control:
    # Public endpoints
    - { path: ^/api/health$, roles: PUBLIC_ACCESS }
    - { path: ^/api/oauth2/token$, roles: PUBLIC_ACCESS }
    - { path: ^/api/oauth2/logout$, roles: PUBLIC_ACCESS }
    - { path: ^/api/oauth2/authorize$, roles: ROLE_USER }
    - { path: ^/api/\.well-known, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/refresh$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/logout$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/mfa/verify$, roles: PUBLIC_ACCESS }
    # Resend carries its own pre-auth token in the body, exactly like mfa/verify:
    # the caller has no access token yet at this point in the login flow. Abuse is
    # bounded by the `limiter.mfa_resend` rate limiter enforced in MfaResendProcessor.
    - { path: ^/api/auth/mfa/resend$, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/password/reset, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    # Protected endpoints requiring authentication
    - { path: ^/api/oauth2/userinfo$, roles: ROLE_USER }
    - { path: ^/api/oauth2/token/revoke$, roles: ROLE_USER }
    - { path: ^/api/oauth2/token/introspect$, roles: ROLE_USER }

    # Public avatar streaming endpoint (GET only — POST remains protected)
    - { path: '^/api/users/.+/avatar(/\d+\.webp)?$', roles: PUBLIC_ACCESS, methods: [GET] }

    # Public organization logo streaming endpoint (GET only — upload stays protected)
    - { path: '^/api/organizations/.+/logo\.webp$', roles: PUBLIC_ACCESS, methods: [GET] }

    # Public invitation preview by token (GET only — lets an invitee see the
    # organization/inviter before signing in or creating an account)
    - { path: '^/api/organizations/invitations/[^/]+/preview$', roles: PUBLIC_ACCESS, methods: [GET] }

    # Public member iCal subscription feed (GET only — the URL-embedded token
    # secret is the credential; unknown/revoked tokens answer a uniform 404)
    - { path: '^/api/calendar/feed/[^/]+\.ics$', roles: PUBLIC_ACCESS, methods: [GET] }

    # Public email change confirmation (POST only — the emailed 256-bit token
    # is the credential, mirroring the registration email-verification pattern;
    # the link lands in the new mailbox where no session may exist. Abuse is
    # bounded by the per-IP `limiter.email_change_confirm` in the processor.)
    - { path: ^/api/me/email-change/confirm$, roles: PUBLIC_ACCESS, methods: [POST] }

    # Stripe webhook (public; signature is verified in the controller)
    - { path: ^/api/billing/webhook$, roles: PUBLIC_ACCESS, methods: [POST] }

    # Default: require authentication for all API endpoints
    - { path: ^/api, roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      # By default, password hashers are resource intensive and take time. This is
      # important to generate secure password hashes. In tests however, secure hashes
      # are not important, waste resources and increase test times. The following
      # reduces the work factor to the lowest possible values.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon

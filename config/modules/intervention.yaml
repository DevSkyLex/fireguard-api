services:
  _defaults:
    autowire: true
    autoconfigure: true

  Intervention\Presentation\:
    resource: '../../src/Intervention/Presentation'

  # PDF rendering (module-local adapter) — mirrors config/modules/compliance.yaml
  Intervention\Infrastructure\Pdf\DompdfInterventionReportRenderer: ~

  Intervention\Application\Port\Outbound\InterventionReportPdfRendererPort:
    alias: Intervention\Infrastructure\Pdf\DompdfInterventionReportRenderer

  Intervention\Application\:
    resource: '../../src/Intervention/Application'

  Intervention\Domain\Service\:
    resource: '../../src/Intervention/Domain/Service'

  Intervention\Infrastructure\:
    resource: '../../src/Intervention/Infrastructure'

  # Bind the rich-text comment sanitizer (Quill / PrimeNG editor output).
  Intervention\Presentation\Api\Processor\InterventionActivityProcessor:
    arguments:
      $commentSanitizer: '@html_sanitizer.sanitizer.intervention.comment'

  Intervention\Application\Port\Outbound\InterventionResourceGatewayPort:
    alias: Intervention\Infrastructure\Adapter\Resource\DoctrineInterventionResourceGatewayAdapter

  Intervention\Infrastructure\Persistence\Doctrine\Repository\InterventionAttachmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Reports active (not closed) interventions targeting a facility as their
  # site (for the facility archival guard) — mirrors
  # Inspection\Infrastructure\Adapter\Facility\FacilityInspectionDependencyAdapter.
  Intervention\Infrastructure\Adapter\Facility\FacilityInterventionDependencyAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Application\Port\Outbound\InterventionAttachmentRepositoryPort:
    alias: Intervention\Infrastructure\Persistence\Doctrine\Repository\InterventionAttachmentRepository

  # R11b: generalized intervention attachments (multipart, phase-based write)
  Intervention\Presentation\Api\Processor\Attachment\InterventionMediaProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Presentation\Api\Provider\Attachment\InterventionMediaProvider:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Application\Port\Outbound\InterventionEquipmentDraftProviderPort:
    alias: Equipment\Infrastructure\Adapter\Intervention\EquipmentInterventionResourceAdapter

  Intervention\Application\Port\Outbound\PublicationRepositoryPort:
    alias: Intervention\Infrastructure\Adapter\Publication\DoctrinePublicationAdapter

  Intervention\Application\Port\Outbound\PublicationQueuePort:
    alias: Intervention\Infrastructure\Adapter\Publication\MessengerPublicationQueueAdapter

  Intervention\Application\Port\Outbound\InterventionWorkflowGatewayPort:
    alias: Intervention\Infrastructure\Adapter\Workflow\DoctrineInterventionWorkflowGatewayAdapter

  # Cross-module inbound port: programmatic draft creation (maintenance
  # campaigns, automation rules) through the same workflow gateway as the API.
  Intervention\Application\Port\Inbound\InterventionDraftFactoryPort:
    alias: Intervention\Application\Service\InterventionDraftFactory

  Intervention\Application\Port\Outbound\InterventionIssueQueryPort:
    alias: Intervention\Infrastructure\Adapter\Workflow\DoctrineInterventionWorkflowGatewayAdapter

  Intervention\Application\Port\Outbound\InterventionActivityPort:
    alias: Intervention\Infrastructure\Adapter\Activity\DoctrineInterventionActivityAdapter

  Intervention\Application\Port\Outbound\InterventionLabelPort:
    alias: Intervention\Infrastructure\Adapter\Label\DoctrineInterventionLabelAdapter

  Intervention\Application\Port\Outbound\InterventionTemplatePort:
    alias: Intervention\Infrastructure\Adapter\Template\DoctrineInterventionTemplateAdapter

  Intervention\Application\Port\Outbound\InterventionRecurrencePort:
    alias: Intervention\Infrastructure\Adapter\Recurrence\DoctrineInterventionRecurrenceAdapter

  Intervention\Application\Port\Outbound\InterventionReminderPort:
    alias: Intervention\Infrastructure\Adapter\Reminder\DoctrineInterventionReminderAdapter

  Intervention\Application\Port\Outbound\InterventionStatisticsGatewayPort:
    alias: Intervention\Infrastructure\Adapter\Statistics\DoctrineInterventionStatisticsGatewayAdapter

  # Hosted by Facility (site names) and Organization (responsible member
  # names) respectively — the statistics endpoint's bySite/byResponsible
  # top-10 breakdowns. See config/modules/facility.yaml and organization.yaml
  # for the adapters themselves.
  Intervention\Application\Port\Outbound\InterventionSiteNamingPort:
    alias: Facility\Infrastructure\Adapter\Intervention\InterventionSiteNamingAdapter

  Intervention\Application\Port\Outbound\InterventionMemberNamingPort:
    alias: Organization\Infrastructure\Adapter\Intervention\OrganizationInterventionMemberDirectoryAdapter

  Intervention\Application\Service\InterventionChangeApplication:
    arguments:
      $appliers: !tagged_iterator intervention.change_applier

  Intervention\Application\Service\InterventionDraftPublisher:
    arguments:
      $publishers: !tagged_iterator intervention.draft_publisher

  Intervention\Infrastructure\Adapter\Resource\DoctrineInterventionResourceGatewayAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
      $owners: !tagged_iterator intervention.resource_owner

  Intervention\Infrastructure\Adapter\Publication\DoctrinePublicationAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Publication\MessengerPublicationQueueAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'

  Intervention\Infrastructure\Adapter\Workflow\DoctrineInterventionWorkflowGatewayAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Activity\DoctrineInterventionActivityAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Label\DoctrineInterventionLabelAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Template\DoctrineInterventionTemplateAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Recurrence\DoctrineInterventionRecurrenceAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Reminder\DoctrineInterventionReminderAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Statistics\DoctrineInterventionStatisticsGatewayAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Organization\InterventionStatisticsAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Organization\InterventionSearchAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module read model for the Calendar module (unified feed source)
  Intervention\Infrastructure\Adapter\Calendar\InterventionCalendarFeedAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Adapter\Messaging\InterventionMessagingSubjectResolverAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['messaging.subject_resolver']

  # Hosts the adapter for the Equipment-owned consumer port (Equipment
  # implements Intervention's `intervention.change_applier` /
  # `intervention.draft_publisher`; Intervention symmetrically implements
  # Equipment's InterventionServiceReportPort here) — mirrors
  # Facility\Infrastructure\Adapter\Equipment\FacilityValidationAdapter.
  Intervention\Infrastructure\Adapter\Equipment\InterventionServiceReportAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Infrastructure\Persistence\Doctrine\Mapper\InterventionViewMapper:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Application\UseCase\Command\Publication\RequestPublication\RequestPublicationHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Publication\ExecutePublication\ExecutePublicationHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Publication\GetPublication\GetPublicationHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Workflow\MutateInterventionWorkflow\MutateInterventionWorkflowHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Workflow\GetInterventionWorkflow\GetInterventionWorkflowHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Workflow\ListInterventionWorkflow\ListInterventionWorkflowHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Workflow\ListInterventionIssues\ListInterventionIssuesHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Activity\AddInterventionComment\AddInterventionCommentHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Activity\ListInterventionActivities\ListInterventionActivitiesHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Label\CreateInterventionLabel\CreateInterventionLabelHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Label\UpdateInterventionLabel\UpdateInterventionLabelHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Label\DeleteInterventionLabel\DeleteInterventionLabelHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Label\ListInterventionLabels\ListInterventionLabelsHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Template\CreateInterventionTemplate\CreateInterventionTemplateHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Template\UpdateInterventionTemplate\UpdateInterventionTemplateHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Template\DeleteInterventionTemplate\DeleteInterventionTemplateHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Template\InstantiateInterventionTemplate\InstantiateInterventionTemplateHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Template\ListInterventionTemplates\ListInterventionTemplatesHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Template\GetInterventionTemplate\GetInterventionTemplateHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Recurrence\CreateInterventionRecurrence\CreateInterventionRecurrenceHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Recurrence\UpdateInterventionRecurrence\UpdateInterventionRecurrenceHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Recurrence\DeleteInterventionRecurrence\DeleteInterventionRecurrenceHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Recurrence\GetInterventionRecurrence\GetInterventionRecurrenceHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Recurrence\ListInterventionRecurrences\ListInterventionRecurrencesHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Sweep\MaterializeDueRecurrences\MaterializeDueRecurrencesHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Sweep\SendDueReminders\SendDueRemindersHandler:
    tags: ['messenger.message_handler']

  # R9: team -> participants snapshot assignment. Consumes Organization's
  # inbound TeamDirectoryPort directly, exactly like OrganizationAuthorizationPort
  # above; no new alias needed (Organization\Application\Port\Inbound\TeamDirectoryPort
  # is aliased in config/modules/organization.yaml and resolves from the merged container).
  Intervention\Application\UseCase\Command\Assignment\AssignTeamToIntervention\AssignTeamToInterventionHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Attachment\AddInterventionAttachment\AddInterventionAttachmentHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Command\Attachment\DeleteInterventionAttachment\DeleteInterventionAttachmentHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Attachment\ListInterventionAttachments\ListInterventionAttachmentsHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Attachment\GetInterventionAttachmentContent\GetInterventionAttachmentContentHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\Workflow\GetInterventionStatistics\GetInterventionStatisticsHandler:
    tags: ['messenger.message_handler']

  Intervention\Application\UseCase\Query\ExportInterventions\ExportInterventionsHandler:
    tags: ['messenger.message_handler']

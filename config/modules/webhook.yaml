imports:
  - { resource: 'webhook/doctrine.yaml' }
  - { resource: 'webhook/api_platform.yaml' }
  - { resource: 'webhook/framework.yaml' }
  - { resource: 'webhook/framework_2.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Webhook\Presentation\:
    resource: '../../src/Webhook/Presentation'

  Webhook\Infrastructure\EventSubscriber\:
    resource: '../../src/Webhook/Infrastructure/EventSubscriber'

  Webhook\Infrastructure\Adapter\:
    resource: '../../src/Webhook/Infrastructure/Adapter'

  Webhook\Infrastructure\Scheduler\:
    resource: '../../src/Webhook/Infrastructure/Scheduler'

  Webhook\Infrastructure\Console\InspectWebhookDeliveriesCommand:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  # Outbound ports
  Webhook\Application\Port\Outbound\Internal\WebhookSubscriptionRepositoryPort:
    alias: Webhook\Infrastructure\Persistence\Doctrine\Repository\WebhookSubscriptionRepository

  Webhook\Application\Port\Outbound\Internal\WebhookDeliveryRepositoryPort:
    alias: Webhook\Infrastructure\Persistence\Doctrine\Repository\WebhookDeliveryRepository

  Webhook\Application\Port\Outbound\WebhookDeliveryQueuePort:
    alias: Webhook\Infrastructure\Adapter\Messenger\MessengerWebhookDeliveryQueueAdapter

  Webhook\Application\Port\Outbound\Internal\WebhookDeliveryWorkPort:
    alias: Webhook\Infrastructure\Adapter\Delivery\DoctrineWebhookDeliveryWorkAdapter

  Webhook\Application\Port\Outbound\WebhookDeliverySchedulePort:
    alias: Webhook\Infrastructure\Adapter\Delivery\DoctrineWebhookDeliveryScheduleAdapter

  Webhook\Infrastructure\Adapter\Delivery\DoctrineWebhookDeliveryWorkAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  Webhook\Infrastructure\Adapter\Delivery\DoctrineWebhookDeliveryScheduleAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  Webhook\Application\Port\Outbound\WebhookSecretCipherPort:
    alias: Webhook\Infrastructure\Adapter\Crypto\OpensslWebhookSecretCipherAdapter

  Webhook\Application\Port\Outbound\WebhookHttpClientPort:
    alias: Webhook\Infrastructure\Adapter\Http\SymfonyHttpWebhookClientAdapter

  # SSRF hardening policy, shared by the validator, the two handlers that
  # accept a target URL, and the HTTP adapter's send-time re-validation.
  Webhook\Domain\Service\WebhookUrlPolicy:
    arguments:
      $allowInsecureUrls: '%env(bool:WEBHOOK_ALLOW_INSECURE_URLS)%'

  # A dedicated HttpClientInterface instance rather than relying on
  # FrameworkBundle's `http_client` service autoregistration (which is only
  # configured today via the transitive symfony/mercure-bundle dependency,
  # not an explicit `framework.http_client` block).
  webhook.http_client.transport:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

  webhook.http_client:
    class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
    autoconfigure: false
    arguments: ['@webhook.http_client.transport']
    tags:
      - { name: kernel.reset, method: reset }

  Webhook\Infrastructure\Adapter\Http\SymfonyHttpWebhookClientAdapter:
    arguments:
      $httpClient: '@webhook.http_client'

  # Repositories (main entity manager)
  Webhook\Infrastructure\Persistence\Doctrine\Repository\WebhookSubscriptionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Webhook\Infrastructure\Persistence\Doctrine\Repository\WebhookDeliveryRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Fire-and-forget async dispatch (mirrors Import's MessengerImportJobQueueAdapter)
  Webhook\Infrastructure\Adapter\Messenger\MessengerWebhookDeliveryQueueAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'
      $connection: '@doctrine.dbal.main_connection'

  # Curated-event subscriber: dispatches directly onto the raw message bus,
  # not CommandBusPort (see its docblock).

  # Command handlers
  Webhook\Application\UseCase\Command\Subscription\CreateWebhookSubscription\CreateWebhookSubscriptionHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Subscription\UpdateWebhookSubscription\UpdateWebhookSubscriptionHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Subscription\DeleteWebhookSubscription\DeleteWebhookSubscriptionHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Subscription\RotateWebhookSecret\RotateWebhookSecretHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Subscription\PingWebhookSubscription\PingWebhookSubscriptionHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Delivery\DispatchWebhookEvent\DispatchWebhookEventHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Delivery\DeliverWebhook\DeliverWebhookHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
      $timeoutSeconds: '%env(int:WEBHOOK_HTTP_TIMEOUT)%'
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Delivery\RedeliverWebhook\RedeliverWebhookHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Command\Sweep\RecoverWebhookDeliveries\RecoverWebhookDeliveriesHandler:
    tags: ['messenger.message_handler']

  # Query handlers
  Webhook\Application\UseCase\Query\Subscription\GetWebhookSubscription\GetWebhookSubscriptionHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Query\Subscription\ListWebhookSubscriptions\ListWebhookSubscriptionsHandler:
    tags: ['messenger.message_handler']

  Webhook\Application\UseCase\Query\Delivery\ListWebhookDeliveries\ListWebhookDeliveriesHandler:
    tags: ['messenger.message_handler']

  Webhook\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Webhook\Application\Port\Outbound\WebhookEventCatalogPort: '@Webhook\Application\Service\WebhookEventCatalogRegistry'
  Webhook\Application\Port\Inbound\WebhookEventPublisherPort: '@Webhook\Infrastructure\Adapter\Event\WebhookEventPublisherAdapter'
  Webhook\Application\Service\WebhookEventCatalogRegistry:
    arguments:
      $sources: !tagged_iterator webhook.event_source
  Webhook\Infrastructure\Adapter\Event\WebhookEventPublisherAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'

  Webhook\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Webhook\Infrastructure\Adapter\Idempotency\WebhookHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Webhook\Infrastructure\Adapter\Idempotency\WebhookHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
    tags: [http.idempotency_replay_authorization]

  Webhook\Infrastructure\Adapter\Idempotency\WebhookSecretIdempotencyProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
    tags: [shared.sensitive_idempotency_proof]

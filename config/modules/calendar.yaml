imports:
  - { resource: 'calendar/doctrine.yaml' }
  - { resource: 'calendar/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Calendar\Presentation\:
    resource: '../../src/Calendar/Presentation'

  # Repository (main entity manager)
  Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarEventRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Calendar\Application\Port\Outbound\Internal\Event\CalendarEventRepositoryPort:
    alias: Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarEventRepository

  # Cross-module outbound ports (adapters live in the owning modules)
  Calendar\Application\Port\Outbound\Member\CalendarMemberDirectoryPort:
    alias: Organization\Infrastructure\Adapter\Calendar\OrganizationCalendarMemberDirectoryAdapter




  # Unified feed aggregator: merges standalone events with the three
  # cross-module feed ports, isolating and logging a failing source.
  Calendar\Application\Service\CalendarFeedAggregator: ~

  # Command handlers
  Calendar\Application\UseCase\Command\Event\CreateCalendarEvent\CreateCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\Event\UpdateCalendarEvent\UpdateCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\Event\DeleteCalendarEvent\DeleteCalendarEventHandler:
    tags: ['messenger.message_handler']

  # Query handlers
  Calendar\Application\UseCase\Query\Event\GetCalendarEvent\GetCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Query\Feed\GetCalendarFeed\GetCalendarFeedHandler:
    tags: ['messenger.message_handler']

  # ---------------------------------------------------------------------------
  # Member iCal feed tokens (phase 10a)
  # ---------------------------------------------------------------------------

  # Repository (main entity manager)
  Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarFeedTokenRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Calendar\Application\Port\Outbound\Internal\FeedToken\CalendarFeedTokenRepositoryPort:
    alias: Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarFeedTokenRepository

  # Secret generator/hasher: raw secret lives in memory only, SHA-256 in base.
  Calendar\Application\Service\CalendarFeedTokenSecretFactory: ~

  # RFC 5545 serializer for the public .ics endpoint (deep links need the
  # public frontend base URL).
  Calendar\Presentation\Api\Ical\CalendarFeedIcalWriter:
    arguments:
      $frontendUrl: '%app.frontend_url%'

  # Feed token command handlers
  Calendar\Application\UseCase\Command\FeedToken\RotateCalendarFeedToken\RotateCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\FeedToken\RevokeCalendarFeedToken\RevokeCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

  # Feed token query handlers
  Calendar\Application\UseCase\Query\FeedToken\GetCalendarFeedTokenMetadata\GetCalendarFeedTokenMetadataHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Query\FeedToken\ResolveCalendarFeedToken\ResolveCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

  Calendar\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Calendar\Application\Service\CalendarFeedSourceRegistry:
    arguments:
      $sources: !tagged_iterator calendar.feed_source

  Calendar\Infrastructure\Adapter\Feed\CalendarEventFeedSourceAdapter:
    tags:
      - { name: calendar.feed_source, priority: 400 }

  Calendar\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Calendar\Infrastructure\Adapter\OrganizationCatalog\CalendarSystemRoleContributionAdapter:
    tags: [organization.system_role_contribution]

  Calendar\Infrastructure\Adapter\Idempotency\CalendarHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Calendar\Infrastructure\Adapter\Idempotency\CalendarHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $mainConnection: '@doctrine.dbal.main_connection'
    tags: [http.idempotency_replay_authorization]

  Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedTokenIdempotencyProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
    tags: [shared.sensitive_idempotency_proof]

  Calendar\Application\UseCase\Command\Feed\ReadCalendarFeedIcs\ReadCalendarFeedIcsHandler:
    arguments:
      $rootTransaction: '@Shared\Infrastructure\Messaging\Outbox\RootTransactionManagerAdapter'
    tags: [messenger.message_handler]
  Calendar\Application\Port\Outbound\Feed\CalendarFeedIcsAccessPort: '@Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsAccessAdapter'
  Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsAccessAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
  Calendar\Application\Port\Outbound\Feed\CalendarFeedIcsUsagePort: '@Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsUsageAdapter'
  Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsUsageAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $entityManager: '@doctrine.orm.main_entity_manager'
  Calendar\Application\Port\Outbound\Feed\CalendarFeedDocumentWriterPort: '@Calendar\Infrastructure\Adapter\Ical\CalendarFeedDocumentWriterAdapter'
  Calendar\Infrastructure\Adapter\Ical\CalendarFeedDocumentWriterAdapter:
    arguments:
      $frontendUrl: '%app.frontend_url%'
  Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  Calendar\Infrastructure\Adapter\Idempotency\CalendarFeedIcsHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
when@dev:
  imports:
    - { resource: 'calendar/seeds.yaml' }

when@test:
  imports:
    - { resource: 'calendar/seeds.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Calendar\Presentation\:
    resource: '../../src/Calendar/Presentation'

  # Repository (main entity manager)
  Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarEventRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Calendar\Application\Port\Outbound\Event\CalendarEventRepositoryPort:
    alias: Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarEventRepository

  # Cross-module outbound ports (adapters live in the owning modules)
  Calendar\Application\Port\Outbound\Member\CalendarMemberDirectoryPort:
    alias: Organization\Infrastructure\Adapter\Calendar\OrganizationCalendarMemberDirectoryAdapter

  Calendar\Application\Port\Outbound\Feed\InspectionCalendarFeedPort:
    alias: Inspection\Infrastructure\Adapter\Calendar\InspectionCalendarFeedAdapter

  Calendar\Application\Port\Outbound\Feed\InterventionCalendarFeedPort:
    alias: Intervention\Infrastructure\Adapter\Calendar\InterventionCalendarFeedAdapter

  Calendar\Application\Port\Outbound\Feed\MaintenanceCalendarFeedPort:
    alias: Maintenance\Infrastructure\Adapter\Calendar\MaintenanceCalendarFeedAdapter

  # Unified feed aggregator: merges standalone events with the three
  # cross-module feed ports, isolating and logging a failing source.
  Calendar\Application\Service\CalendarFeedAggregator: ~

  # Command handlers
  Calendar\Application\UseCase\Command\Event\CreateCalendarEvent\CreateCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\Event\UpdateCalendarEvent\UpdateCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\Event\DeleteCalendarEvent\DeleteCalendarEventHandler:
    tags: ['messenger.message_handler']

  # Query handlers
  Calendar\Application\UseCase\Query\Event\GetCalendarEvent\GetCalendarEventHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Query\Feed\GetCalendarFeed\GetCalendarFeedHandler:
    tags: ['messenger.message_handler']

  # ---------------------------------------------------------------------------
  # Member iCal feed tokens (phase 10a)
  # ---------------------------------------------------------------------------

  # Repository (main entity manager)
  Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarFeedTokenRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Calendar\Application\Port\Outbound\FeedToken\CalendarFeedTokenRepositoryPort:
    alias: Calendar\Infrastructure\Persistence\Doctrine\Repository\CalendarFeedTokenRepository

  # Secret generator/hasher: raw secret lives in memory only, SHA-256 in base.
  Calendar\Application\Service\CalendarFeedTokenSecretFactory: ~

  # RFC 5545 serializer for the public .ics endpoint (deep links need the
  # public frontend base URL).
  Calendar\Presentation\Api\Ical\CalendarFeedIcalWriter:
    arguments:
      $frontendUrl: '%app.frontend_url%'

  # Feed token command handlers
  Calendar\Application\UseCase\Command\FeedToken\RotateCalendarFeedToken\RotateCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Command\FeedToken\RevokeCalendarFeedToken\RevokeCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

  # Feed token query handlers
  Calendar\Application\UseCase\Query\FeedToken\GetCalendarFeedTokenMetadata\GetCalendarFeedTokenMetadataHandler:
    tags: ['messenger.message_handler']

  Calendar\Application\UseCase\Query\FeedToken\ResolveCalendarFeedToken\ResolveCalendarFeedTokenHandler:
    tags: ['messenger.message_handler']

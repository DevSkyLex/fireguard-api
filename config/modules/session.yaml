services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Use Cases - Auto-register
    Session\Application\UseCase\:
        resource: '../../src/Session/Application/UseCase/'

    # Inbound Port (Session Tracking)
    Session\Application\Port\Inbound\Tracking\SessionTrackingPort:
        alias: Session\Application\Service\SessionTrackingService

    Session\Application\Service\SessionTrackingService: ~

    # Inbound Port (Session Status)
    Session\Application\Port\Inbound\Tracking\SessionStatusPort:
        alias: Session\Application\Service\SessionStatusService

    Session\Application\Service\SessionStatusService: ~

    # Command Handlers
    Session\Application\UseCase\Command\Session\CreateSession\CreateSessionHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Command\Session\RevokeSession\RevokeSessionHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Command\Session\RevokeAllUserSessions\RevokeAllUserSessionsHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Command\Session\RevokeOtherUserSessions\RevokeOtherUserSessionsHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Command\Session\UpdateSessionTokens\UpdateSessionTokensHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Command\Session\RevokeSessionByToken\RevokeSessionByTokenHandler:
        tags: ['messenger.message_handler']

    # Query Handlers
    Session\Application\UseCase\Query\Session\GetSession\GetSessionHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Query\Session\ListUserSessions\ListUserSessionsHandler:
        tags: ['messenger.message_handler']
    Session\Application\UseCase\Query\Session\GetSessionByAccessToken\GetSessionByAccessTokenHandler:
        tags: ['messenger.message_handler']

    # Repository
    Session\Infrastructure\Persistence\Doctrine\Repository\SessionRepository:
        arguments:
            $entityManager: '@doctrine.orm.auth_entity_manager'

    Session\Infrastructure\Persistence\Doctrine\Mapper\SessionMapper: ~

    # Port Binding
    Session\Application\Port\Outbound\SessionRepositoryPort:
        alias: Session\Infrastructure\Persistence\Doctrine\Repository\SessionRepository

    # Providers
    Session\Presentation\Api\Provider\Session\ListUserSessionsProvider: ~
    Session\Presentation\Api\Provider\Session\GetSessionProvider: ~

    # Processors
    Session\Presentation\Api\Processor\Session\RevokeSessionProcessor: ~
    Session\Presentation\Api\Processor\Session\RevokeAllSessionsProcessor: ~
    Session\Presentation\Api\Processor\Session\RevokeOtherSessionsProcessor: ~

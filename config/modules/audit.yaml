# Configuration for the Audit module

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Audit\Infrastructure\:
    resource: '../../src/Audit/Infrastructure/'
    exclude:
      - '../../src/Audit/Infrastructure/**/Tests/'
      - '../../src/Audit/Infrastructure/**/Tests.php'
      - '../../src/Audit/Infrastructure/**/Test.php'

  Audit\Application\UseCase\:
    resource: '../../src/Audit/Application/UseCase/'

  Audit\Application\UseCase\Command\RecordAuditEvent\RecordAuditEventHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\GetAuditEvent\GetAuditEventHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\ListAuditEvents\ListAuditEventsHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\ExportAuditEvents\ExportAuditEventsHandler:
    tags: ['messenger.message_handler']

  Audit\Presentation\:
    resource: '../../src/Audit/Presentation/'

  Audit\Application\Port\Outbound\AuditEventRepositoryPort: '@Audit\Infrastructure\Persistence\Doctrine\Repository\AuditEventRepository'

  # Published inbound capability: the organization-scoped, reduced slice of the
  # ledger. Consumed cross-module by Organization's activity-feed endpoint.
  # Reads through AuditEventRepositoryPort above (audit_events lives in the
  # AUTH database, which is also doctrine's default_entity_manager, so that
  # repository resolves the right one). This service touches no entity manager
  # of its own and therefore names none.
  Audit\Application\Port\Inbound\OrganizationAuditFeedPort:
    alias: Audit\Application\Service\OrganizationAuditFeedService

  Audit\Application\Service\OrganizationAuditFeedService: ~

imports:
  - { resource: 'audit/doctrine.yaml' }
  - { resource: 'audit/api_platform.yaml' }

# Configuration for the Audit module

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Audit\Infrastructure\:
    resource: '../../src/Audit/Infrastructure/'
    exclude:
      - '../../src/Audit/Infrastructure/**/Tests/'
      - '../../src/Audit/Infrastructure/**/Tests.php'
      - '../../src/Audit/Infrastructure/**/Test.php'

  Audit\Application\UseCase\:
    resource: '../../src/Audit/Application/UseCase/'

  Audit\Application\UseCase\Command\RecordAuditEvent\RecordAuditEventHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\GetAuditEvent\GetAuditEventHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\ListAuditEvents\ListAuditEventsHandler:
    tags: ['messenger.message_handler']

  Audit\Application\UseCase\Query\ExportAuditEvents\ExportAuditEventsHandler:
    tags: ['messenger.message_handler']

  Audit\Presentation\:
    resource: '../../src/Audit/Presentation/'

  Audit\Application\Port\Outbound\Internal\AuditEventRepositoryPort: '@Audit\Infrastructure\Persistence\Doctrine\Repository\AuditEventRepository'

  # Published inbound capability: the organization-scoped, reduced slice of the
  # ledger. Consumed cross-module by Organization's activity-feed endpoint.
  # Reads through AuditEventRepositoryPort above (audit_events lives in the
  # AUTH database, which is also doctrine's default_entity_manager, so that
  # repository resolves the right one). This service touches no entity manager
  # of its own and therefore names none.
  Audit\Application\Port\Inbound\OrganizationAuditFeedPort:
    alias: Audit\Application\Service\OrganizationAuditFeedService

  Audit\Application\Service\OrganizationAuditFeedService: ~

  Audit\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Audit\Application\Port\Inbound\AuditRecordingPort: '@Audit\Infrastructure\Adapter\Doctrine\AuditRecordingAdapter'
  Audit\Infrastructure\Adapter\Doctrine\AuditRecordingAdapter:
    arguments:
      $authConnection: '@doctrine.dbal.auth_connection'
      $mainConnection: '@doctrine.dbal.main_connection'
      $authEvents: '@shared.auth_event_dispatcher'
      $mainEvents: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'
  Audit\Infrastructure\EventSubscriber\AuditRecordRequestedSubscriber:
    arguments:
      $eventConsumer: '@shared.auth_event_consumer'

  Audit\Infrastructure\Adapter\Authorization\AuditPermissionContributionAdapter:
    tags: [authorization.permission_catalog_contribution]

  Audit\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Audit\Infrastructure\Persistence\Doctrine\Repository\AuditEventRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Audit\Application\UseCase\Command\ExportAuditCsv\ExportAuditCsvHandler:
    arguments:
      $transaction: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventDispatcher: '@shared.auth_event_dispatcher'
    tags: [messenger.message_handler]
  Audit\Application\Port\Outbound\Export\AuditCsvEncodingPort: '@Audit\Infrastructure\Adapter\Export\AuditCsvEncodingAdapter'
  Audit\Infrastructure\Adapter\Export\AuditCsvEncodingAdapter: ~
  Audit\Infrastructure\Adapter\Idempotency\AuditHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
  Audit\Infrastructure\Adapter\Idempotency\AuditHttpIdempotencyReplayAuthorizationAdapter:
    tags: [http.idempotency_replay_authorization]

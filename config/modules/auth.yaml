services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Auth Module - Ports
  Auth\Application\Port\Outbound\AccessTokenRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\AccessTokenRepository

  Auth\Application\Port\Outbound\ClientRepositoryPort:
    class: Auth\Infrastructure\OAuth2\Adapter\ClientRepositoryPortAdapter

  Auth\Application\Port\Outbound\RefreshTokenRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\RefreshTokenRepository

  Auth\Application\Port\Outbound\AuthCodeRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\AuthCodeRepository

  Auth\Application\Port\Outbound\AuthorizationServerPort:
    class: Auth\Infrastructure\OAuth2\Server\AuthorizationServerAdapter

  Auth\Application\Port\Outbound\ClientValidationPort:
    class: Auth\Infrastructure\OAuth2\Adapter\ClientValidationAdapter

  Auth\Application\Port\Outbound\JwtTokenServicePort:
    alias: Auth\Infrastructure\Jwt\JwtTokenService

  Auth\Application\Port\Outbound\TokenRevocationPort:
    alias: Auth\Infrastructure\Token\TokenRevocationService

  Auth\Application\Port\Outbound\JwtParserPort:
    alias: Auth\Infrastructure\Jwt\JwtParserService

  Auth\Application\Port\Outbound\TokenCachePort:
    alias: Auth\Infrastructure\Cache\TokenCacheService

  Auth\Infrastructure\Token\TokenRevocationService: ~
  Auth\Infrastructure\Jwt\JwtParserService: ~
  Auth\Infrastructure\Cache\TokenCacheService: ~
  Auth\Infrastructure\RateLimiter\LoginRateLimiterAdapter: ~

  # Domain Services
  Auth\Domain\Service\TokenValidationService: ~

  # Use Case Command Handlers
  Auth\Application\UseCase\Command\Login\LoginHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Logout\LogoutHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\RevokeToken\RevokeTokenHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\IssueToken\IssueTokenHandler:
    tags: ['messenger.message_handler']

  # Use Case Query Handlers
  Auth\Application\UseCase\Query\ValidateToken\ValidateTokenHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Query\IntrospectToken\IntrospectTokenHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Query\RefreshToken\RefreshTokenHandler:
    tags: ['messenger.message_handler']

  # League OAuth2 Server
  League\OAuth2\Server\Repositories\ClientRepositoryInterface:
    class: Auth\Infrastructure\OAuth2\Repository\ClientRepositoryAdapter

  League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface:
    class: Auth\Infrastructure\OAuth2\Repository\AccessTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface:
    class: Auth\Infrastructure\OAuth2\Repository\RefreshTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface:
    class: Auth\Infrastructure\OAuth2\Repository\AuthCodeRepositoryAdapter

  League\OAuth2\Server\Repositories\ScopeRepositoryInterface:
    class: Auth\Infrastructure\OAuth2\Repository\ScopeRepositoryAdapter

  access_token_ttl:
    class: DateInterval
    arguments: ['PT1H']

  League\OAuth2\Server\AuthorizationServer:
    arguments:
      $clientRepository: '@League\OAuth2\Server\Repositories\ClientRepositoryInterface'
      $accessTokenRepository: '@League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface'
      $scopeRepository: '@League\OAuth2\Server\Repositories\ScopeRepositoryInterface'
      $privateKey: '%kernel.project_dir%/config/jwt/private.key'
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'
    calls:
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\ClientCredentialsGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\RefreshTokenGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\AuthCodeGrant'
          - '@access_token_ttl'

  League\OAuth2\Server\Grant\ClientCredentialsGrant: ~

  League\OAuth2\Server\Grant\RefreshTokenGrant:
    arguments:
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'

  auth_code_ttl:
    class: DateInterval
    arguments: ['PT10M']

  League\OAuth2\Server\Grant\AuthCodeGrant:
    arguments:
      $authCodeRepository: '@League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface'
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'
      $authCodeTTL: '@auth_code_ttl'

  Auth\Presentation\Http\OAuth2\IssueTokenProcessor: ~

  Auth\Presentation\Http\OAuth2\RevokeTokenProcessor:
    arguments:
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'

  Auth\Presentation\Http\OAuth2\IntrospectTokenProcessor: ~

  # Refresh Token Cookie Service
  Auth\Presentation\Service\RefreshTokenCookieService: ~

  # JWT Token Service (uses #[Autowire] attributes)
  Auth\Infrastructure\Jwt\JwtTokenService: ~

  # Auth Processors
  Auth\Presentation\Http\Auth\LoginProcessor: ~
  Auth\Presentation\Http\Auth\RefreshTokenProcessor: ~
  Auth\Presentation\Http\Auth\LogoutProcessor: ~
  Auth\Presentation\Http\Auth\MfaVerifyProcessor: ~

  # WellKnown Providers
  Auth\Presentation\Http\WellKnown\UserInfoProvider: ~
  Auth\Presentation\Http\WellKnown\OpenIdConfigurationProvider: ~
  Auth\Presentation\Http\WellKnown\JwksProvider: ~

  # Event Listener
  Auth\Infrastructure\EventListener\RefreshTokenCookieListener: ~

  # Symfony Security
  Auth\Infrastructure\Security\User\SecurityUserProvider: ~
  Auth\Infrastructure\Security\Authenticator\OAuth2Authenticator: ~

  # Voters
  Auth\Infrastructure\Security\Voter\OAuth2ScopeVoter: ~
  Auth\Infrastructure\Security\Voter\ResourceOwnerVoter: ~

  # Console Commands
  Auth\Infrastructure\Console\GenerateTokenCommand: ~

  # Consent Repository
  Auth\Infrastructure\Persistence\Doctrine\Repository\ConsentRepository:
    arguments:
      $entityManager: '@doctrine.orm.entity_manager'

  Auth\Application\Port\Outbound\ConsentRepositoryPort:
    alias: Auth\Infrastructure\Persistence\Doctrine\Repository\ConsentRepository

  # Consent Handlers
  Auth\Application\UseCase\Command\GrantConsent\GrantConsentHandler: ~
  Auth\Application\UseCase\Query\CheckConsent\CheckConsentHandler: ~


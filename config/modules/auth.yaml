imports:
  - { resource: 'auth/doctrine.yaml' }
  - { resource: 'auth/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Auth Module - Ports
  Auth\Application\Port\Inbound\SecurityUserCacheInvalidationPort:
    alias: Auth\Application\Service\SecurityUserCacheInvalidator
  Auth\Application\Port\Outbound\JwtTokenServicePort:
    alias: Auth\Infrastructure\Adapter\Jwt\JwtTokenAdapter

  Auth\Application\Port\Outbound\JwtParserPort:
    alias: Auth\Infrastructure\Adapter\Jwt\JwtParserAdapter

  Auth\Application\Port\Outbound\UserAuthenticationPort:
    alias: Auth\Infrastructure\Adapter\User\UserAuthenticationAdapter

  Auth\Application\Port\Outbound\Internal\DPoPValidatorPort:
    alias: Auth\Infrastructure\Security\DPoP\DPoPValidator

  Auth\Application\Port\Outbound\SessionTrackingPort:
    alias: Auth\Infrastructure\Adapter\Session\SessionTrackingAdapter

  Auth\Application\Port\Outbound\SessionStatusPort:
    alias: Auth\Infrastructure\Adapter\Session\SessionStatusAdapter

  Auth\Application\Port\Outbound\TrustedDeviceCheckPort:
    alias: TrustedDevice\Infrastructure\Adapter\Auth\TrustedDeviceCheckAdapter

  Auth\Application\Port\Outbound\Federation\FederatedProviderClientPort:
    alias: Auth\Infrastructure\Adapter\Federation\ConfiguredFederatedProviderRegistryAdapter

  Auth\Application\Port\Outbound\Federation\FederatedIdentityRepositoryPort:
    alias: Auth\Infrastructure\Persistence\Doctrine\Repository\FederatedIdentityRepository

  Auth\Application\Port\Outbound\Federation\FederatedFlowRepositoryPort:
    alias: Auth\Infrastructure\Persistence\Doctrine\Repository\FederatedFlowRepository

  # Cross-module: implemented by the Otp module (delegates to its TOTP status inbound port)
  Auth\Application\Port\Outbound\Mfa\TotpEnrollmentCheckPort:
    alias: Otp\Infrastructure\Adapter\Auth\TotpEnrollmentCheckAdapter

  Auth\Infrastructure\Adapter\Shared\CurrentActorAdapter: ~

  # Adapters
  Auth\Infrastructure\Adapter\User\UserAuthenticationAdapter: ~
  Auth\Infrastructure\Adapter\Jwt\JwtParserAdapter: ~
  Auth\Infrastructure\Adapter\Session\SessionTrackingAdapter: ~
  Auth\Infrastructure\Adapter\Session\SessionStatusAdapter: ~
  Auth\Infrastructure\Adapter\RateLimiter\LoginRateLimiterAdapter: ~
  Auth\Infrastructure\Adapter\Federation\LeagueFederatedProviderAdapter: ~

  Auth\Infrastructure\Persistence\Doctrine\Repository\FederatedIdentityRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Auth\Infrastructure\Persistence\Doctrine\Repository\FederatedFlowRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  auth.federated_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
      $database: auth
      $idempotency: '@Shared\Infrastructure\Idempotency\HttpIdempotencyExecutionContext'
  # JWT Token Adapter (uses #[Autowire] attributes)
  Auth\Infrastructure\Adapter\Jwt\JwtTokenAdapter: ~

  # Logging helpers
  Auth\Infrastructure\Logging\SecurityLogSanitizer: ~

  Auth\Application\Service\SecurityUserCacheInvalidator: ~

  Auth\Application\Service\Federation\SessionIssuer:
    arguments:
  Auth\Application\Service\Federation\FederatedAuthenticationService:
    arguments:
      $transaction: '@shared.auth_root_transaction'
      $frontendUrl: '%env(APP_FRONTEND_URL)%'
  Auth\Application\Service\Federation\InitialPasswordService: ~

  # Use Case Command Handlers
  Auth\Application\UseCase\Command\Session\Login\LoginHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Session\Logout\LogoutHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Mfa\MfaVerify\MfaVerifyHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Mfa\MfaResend\MfaResendHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordReset\RequestPasswordReset\RequestPasswordResetHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordReset\ResendPasswordReset\ResendPasswordResetHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordReset\ConfirmPasswordReset\ConfirmPasswordResetHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Registration\RegisterUser\RegisterUserHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Registration\ResendRegistration\ResendRegistrationHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Registration\ConfirmRegistration\ConfirmRegistrationHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordChange\RequestPasswordChange\RequestPasswordChangeHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordChange\ConfirmPasswordChange\ConfirmPasswordChangeHandler:
    tags: ['messenger.message_handler']

  # Use Case Query Handlers
  Auth\Application\UseCase\Query\Session\RefreshToken\RefreshTokenHandler:
    tags: ['messenger.message_handler']

  # Refresh Token Cookie Service
  Auth\Presentation\Api\Service\RefreshTokenCookieService: ~
  Auth\Presentation\Api\Service\FederatedFlowCookieService: ~

  # Auth Processors
  Auth\Presentation\Api\Processor\Auth\LoginProcessor: ~
  Auth\Presentation\Api\Processor\Auth\RefreshTokenProcessor: ~
  Auth\Presentation\Api\Processor\Auth\LogoutProcessor: ~
  Auth\Presentation\Api\Processor\Auth\MfaVerifyProcessor:
    arguments:
      $commandBus: '@Shared\Application\Port\Inbound\CommandBusPort'
      $tokens: '@Auth\Application\Port\Outbound\JwtTokenServicePort'
  Auth\Presentation\Api\Processor\Auth\MfaResendProcessor:
    arguments:
      $commandBus: '@Shared\Application\Port\Inbound\CommandBusPort'

  Auth\Presentation\Api\Provider\Federation\FederatedProvidersProvider: ~
  Auth\Presentation\Api\Provider\Federation\FederatedConnectionsProvider: ~
  Auth\Presentation\Api\Processor\Federation\FederatedStartProcessor: ~
  Auth\Presentation\Api\Processor\Federation\FederatedCompleteProcessor: ~
  Auth\Presentation\Api\Processor\Federation\FederatedDisconnectProcessor: ~
  Auth\Presentation\Api\Processor\Federation\RequestPasswordSetupProcessor: ~
  Auth\Presentation\Api\Processor\Federation\ConfirmPasswordSetupProcessor: ~

  # Password Reset Processors
  Auth\Presentation\Api\Processor\PasswordReset\RequestPasswordResetProcessor: ~
  Auth\Presentation\Api\Processor\PasswordReset\ResendPasswordResetProcessor: ~
  Auth\Presentation\Api\Processor\PasswordReset\ConfirmPasswordResetProcessor: ~

  # Registration Processors
  Auth\Presentation\Api\Processor\Registration\RegisterUserProcessor: ~
  Auth\Presentation\Api\Processor\Registration\ResendRegistrationProcessor: ~
  Auth\Presentation\Api\Processor\Registration\ConfirmRegistrationProcessor: ~

  # Password Change Processors
  Auth\Presentation\Api\Processor\PasswordChange\RequestPasswordChangeProcessor: ~
  Auth\Presentation\Api\Processor\PasswordChange\ConfirmPasswordChangeProcessor: ~

  # Event Subscribers
  Auth\Infrastructure\EventSubscriber\OAuthRequestScopeSubscriber: ~
  Auth\Infrastructure\EventSubscriber\RefreshTokenCookieSubscriber: ~
  Auth\Infrastructure\EventSubscriber\FederatedFlowCookieSubscriber: ~
  Auth\Infrastructure\EventSubscriber\EventLogSubscriber: ~

  # Symfony Security
  Auth\Infrastructure\Security\User\SecurityUserProvider: ~
  Auth\Infrastructure\Security\Authenticator\OAuth2Authenticator: ~

  # Voters
  Auth\Infrastructure\Security\Voter\OAuth2ScopeVoter: ~
  Auth\Infrastructure\Security\Voter\ResourceOwnerVoter: ~

  # DPoP Validator
  Auth\Infrastructure\Security\DPoP\DPoPValidator: ~

  # Console Commands
  Auth\Infrastructure\Console\CleanupAuthDataCommand: ~

  Auth\Presentation\Api\Service\EmailOwnershipActor: ~
  Auth\Application\UseCase\Query\EmailOwnership\GetEmailOwnership\GetEmailOwnershipHandler:
    tags: ['messenger.message_handler']
  Auth\Presentation\Api\Provider\EmailOwnership\GetEmailOwnershipProvider: ~
  Auth\Application\UseCase\Command\EmailOwnership\StartEmailOwnership\StartEmailOwnershipHandler:
    tags: ['messenger.message_handler']
  Auth\Presentation\Api\Processor\EmailOwnership\StartEmailOwnershipProcessor: ~
  Auth\Application\UseCase\Command\EmailOwnership\ConfirmEmailOwnership\ConfirmEmailOwnershipHandler:
    tags: ['messenger.message_handler']
  Auth\Presentation\Api\Processor\EmailOwnership\ConfirmEmailOwnershipProcessor: ~

  Auth\Application\Port\Inbound\Federation\FederationFlowPort:
    alias: Auth\Application\Service\Federation\FederatedAuthenticationService
  Auth\Application\Port\Inbound\Federation\PasswordSetupPort:
    alias: Auth\Application\Service\Federation\InitialPasswordService

  Auth\Application\UseCase\Command\Federation\StartFederation\StartFederationHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Federation\CompleteFederation\CompleteFederationHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\Federation\DisconnectFederation\DisconnectFederationHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Query\Federation\ListFederatedConnections\ListFederatedConnectionsHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Query\Federation\ListFederatedProviders\ListFederatedProvidersHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordSetup\RequestPasswordSetup\RequestPasswordSetupHandler:
    tags: ['messenger.message_handler']

  Auth\Application\UseCase\Command\PasswordSetup\ConfirmPasswordSetup\ConfirmPasswordSetupHandler:
    tags: ['messenger.message_handler']

  Auth\Application\Port\Inbound\InteractiveSessionIssuerPort:
    alias: Auth\Application\Service\Federation\SessionIssuer

  Auth\Presentation\Api\EventSubscriber\FederatedExceptionSubscriber: ~

  Auth\Presentation\Api\Service\TrustedDeviceCookieService: ~

  Auth\Application\Port\Outbound\SecurityLogSanitizerPort:
    alias: Auth\Infrastructure\Logging\SecurityLogSanitizer

  Auth\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Shared\Application\Port\Outbound\CurrentActorPort: '@Auth\Infrastructure\Adapter\Shared\CurrentActorAdapter'

  Shared\Application\Port\Outbound\RateLimiterPort: '@Auth\Infrastructure\Adapter\RateLimiter\LoginRateLimiterAdapter'

  # MFA Port/Adapter Configuration
  Auth\Application\Port\Outbound\Internal\Mfa\ChallengeGeneratorPort:
    class: Auth\Infrastructure\Adapter\Mfa\OtpModuleChallengeGeneratorAdapter

  Auth\Application\Port\Outbound\Internal\Mfa\ChallengeVerifierPort:
    class: Auth\Infrastructure\Adapter\Mfa\OtpModuleChallengeVerifierAdapter

  Auth\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~


  Auth\Application\UseCase\Query\Password\GetPasswordPolicy\GetPasswordPolicyHandler:
    tags: [messenger.message_handler]
  Auth\Presentation\Api\Provider\Password\PasswordPolicyProvider: ~
  Auth\Presentation\Api\Validator\ConfiguredPassword\ConfiguredPasswordValidator: ~

  Auth\Application\Port\Outbound\AuthenticationPolicyPort: '@Auth\Infrastructure\Adapter\Policy\ConfiguredAuthenticationPolicyAdapter'
  Auth\Infrastructure\Adapter\Policy\ConfiguredAuthenticationPolicyAdapter:
    arguments:
      $signupEnabled: '%authentication_policy.signup_enabled%'
      $emailVerificationRequired: '%authentication_policy.email_verification_required%'
      $mfaRequired: '%env(bool:MFA_ENABLED)%'
      $trustedDeviceMfaBypassEnabled: '%authentication_policy.trusted_device_mfa_bypass_enabled%'
      $federatedProvisioningEnabled: '%authentication_policy.federated_provisioning_enabled%'


  Auth\Infrastructure\Adapter\Federation\ConfiguredFederatedProviderRegistryAdapter: ~
  Auth\Infrastructure\Adapter\Federation\GenericOidcProviderAdapter:
    arguments:
      $providers: '%auth.federated_oidc_providers%'

  Auth\Infrastructure\Adapter\Idempotency\LoginIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  Auth\Infrastructure\Adapter\Idempotency\RefreshIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  Auth\Application\UseCase\Command\Session\RefreshToken\RefreshTokenHandler:
    tags: [messenger.message_handler]

  Auth\Infrastructure\Adapter\Idempotency\FederatedProofRetentionAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
    tags: [shared.http_idempotency_retention_contribution]


  Auth\Infrastructure\Adapter\Idempotency\FederatedIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]

  Auth\Infrastructure\Adapter\Idempotency\MfaIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]

  Auth\Infrastructure\Adapter\Idempotency\AuthHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Shared\Application\Port\Outbound\Idempotency\HttpIdempotencyPrincipalPort: '@Auth\Infrastructure\Adapter\Idempotency\HttpIdempotencyPrincipalAdapter'
  Auth\Infrastructure\Adapter\Idempotency\HttpIdempotencyPrincipalAdapter: ~

  Auth\Infrastructure\Adapter\Idempotency\AuthCredentialHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Auth\Application\Port\Outbound\Federation\FederatedBrowserBindingPort: '@Auth\Infrastructure\Adapter\Federation\SignedFederatedBrowserBindingAdapter'
  Auth\Infrastructure\Adapter\Federation\SignedFederatedBrowserBindingAdapter: ~
  Auth\Application\Port\Outbound\Federation\FederatedStartFlowProofPort: '@Auth\Infrastructure\Adapter\Idempotency\FederatedStartFlowProofAdapter'
  Auth\Infrastructure\Adapter\Idempotency\FederatedStartFlowProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
  Auth\Infrastructure\Adapter\Idempotency\FederatedStartIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  Auth\Infrastructure\Adapter\Idempotency\FederatedStartHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Auth\Infrastructure\Adapter\Idempotency\SessionMutationIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]

  Auth\Infrastructure\Adapter\Idempotency\CredentialLifecycleIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]

  Auth\Infrastructure\Adapter\Idempotency\EvidenceHttpRoleAuthorizationCheckerAdapter:
    decorates: security.authorization_checker
    arguments:
      $inner: '@Auth\Infrastructure\Adapter\Idempotency\EvidenceHttpRoleAuthorizationCheckerAdapter.inner'

  Auth\Application\Port\Outbound\SessionAuthorizationProofPort: '@Auth\Infrastructure\Adapter\Idempotency\SessionAuthorizationProofAdapter'
  Auth\Infrastructure\Adapter\Idempotency\SessionAuthorizationProofAdapter: ~

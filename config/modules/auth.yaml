services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Auth Module - Ports
  Auth\Application\Port\Outbound\AccessTokenRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\AccessTokenRepository

  Auth\Application\Port\Outbound\ClientRepositoryPort:
    class: Auth\Infrastructure\Symfony\Adapter\Outbound\ClientRepositoryAdapter

  Auth\Application\Port\Outbound\RefreshTokenRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\RefreshTokenRepository

  Auth\Application\Port\Outbound\AuthCodeRepositoryPort:
    class: Auth\Infrastructure\Persistence\Doctrine\Repository\AuthCodeRepository

  Auth\Application\Port\Outbound\AuthorizationServerPort:
    class: Auth\Infrastructure\League\Adapter\Outbound\AuthorizationServerAdapter

  Auth\Application\Port\Outbound\ClientValidationPort:
    class: Auth\Infrastructure\Symfony\Adapter\Outbound\ClientValidationAdapter

  Auth\Application\Port\Outbound\JwtTokenServicePort:
    alias: Auth\Application\Service\JwtTokenService

  Auth\Presentation\Api\Port\RefreshTokenCookieServicePort:
    alias: Auth\Presentation\Api\Service\RefreshTokenCookieService

  # League OAuth2 Server
  League\OAuth2\Server\Repositories\ClientRepositoryInterface:
    class: Auth\Infrastructure\League\Adapter\Outbound\ClientRepositoryAdapter

  League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface:
    class: Auth\Infrastructure\League\Adapter\Outbound\AccessTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface:
    class: Auth\Infrastructure\League\Adapter\Outbound\RefreshTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface:
    class: Auth\Infrastructure\League\Adapter\Outbound\AuthCodeRepositoryAdapter

  League\OAuth2\Server\Repositories\ScopeRepositoryInterface:
    class: Auth\Infrastructure\League\Adapter\Outbound\ScopeRepositoryAdapter

  access_token_ttl:
    class: DateInterval
    arguments: ['PT1H']

  League\OAuth2\Server\AuthorizationServer:
    arguments:
      $clientRepository: '@League\OAuth2\Server\Repositories\ClientRepositoryInterface'
      $accessTokenRepository: '@League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface'
      $scopeRepository: '@League\OAuth2\Server\Repositories\ScopeRepositoryInterface'
      $privateKey: '%kernel.project_dir%/config/jwt/private.key'
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'
    calls:
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\ClientCredentialsGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\RefreshTokenGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\AuthCodeGrant'
          - '@access_token_ttl'

  League\OAuth2\Server\Grant\ClientCredentialsGrant: ~

  League\OAuth2\Server\Grant\RefreshTokenGrant:
    arguments:
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'

  auth_code_ttl:
    class: DateInterval
    arguments: ['PT10M']

  League\OAuth2\Server\Grant\AuthCodeGrant:
    arguments:
      $authCodeRepository: '@League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface'
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'
      $authCodeTTL: '@auth_code_ttl'

  Auth\Presentation\Api\Processor\IssueTokenProcessor: ~

  Auth\Presentation\Api\Processor\RevokeTokenProcessor:
    arguments:
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'

  Auth\Presentation\Api\Processor\IntrospectTokenProcessor:
    arguments:
      $issuer: '%env(OAUTH_ISSUER)%'

  # Refresh Token Cookie Service
  Auth\Presentation\Api\Service\RefreshTokenCookieService:
    arguments:
      $environment: '%kernel.environment%'
      $cookieBaseName: '%env(REFRESH_TOKEN_COOKIE_NAME)%'
      $lifetimeShort: '%env(int:REFRESH_TOKEN_LIFETIME_SHORT)%'
      $lifetimeLong: '%env(int:REFRESH_TOKEN_LIFETIME_LONG)%'

  # JWT Token Service (for direct user authentication, NOT OAuth2)
  Auth\Application\Service\JwtTokenService:
    arguments:
      $privateKeyPath: '%kernel.project_dir%/config/jwt/private.key'
      $publicKeyPath: '%kernel.project_dir%/config/jwt/public.key'
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'
      $issuer: '%env(OAUTH_ISSUER)%'
      $accessTokenTtl: 3600
      $refreshTokenTtl: '%env(int:REFRESH_TOKEN_LIFETIME_LONG)%'

  # Login/Logout Processors (use JwtTokenService, NOT OAuth2)
  Auth\Presentation\Api\Processor\LoginProcessor: ~

  Auth\Presentation\Api\Processor\RefreshTokenProcessor: ~

  Auth\Presentation\Api\Processor\LogoutProcessor:
    arguments:
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'

  # Refresh Token Cookie Event Subscriber
  Auth\Presentation\Api\EventSubscriber\RefreshTokenCookieSubscriber:
    tags: ['kernel.event_subscriber']

  # OpenID Connect Providers
  Auth\Presentation\Api\Provider\UserInfoProvider: ~

  Auth\Presentation\Api\Provider\OpenIdConfigurationProvider:
    arguments:
      $issuer: '%env(OAUTH_ISSUER)%'

  Auth\Presentation\Api\Provider\JwksProvider:
    arguments:
      $publicKeyPath: '%kernel.project_dir%/config/jwt/public.key'

  # Symfony Security
  Auth\Infrastructure\Symfony\Security\SecurityUserProvider: ~

  Auth\Infrastructure\Symfony\Security\OAuth2Authenticator: ~

  Auth\Infrastructure\Symfony\Security\Voter\OAuth2ScopeVoter:
    tags: ['security.voter']

  Auth\Infrastructure\Symfony\Security\Voter\ResourceOwnerVoter:
    tags: ['security.voter']

  # Console Commands
  Auth\Infrastructure\Symfony\Command\GenerateTokenCommand:
    tags: ['console.command']

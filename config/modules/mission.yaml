services:
  _defaults:
    autowire: true
    autoconfigure: true

  Mission\Presentation\:
    resource: '../../src/Mission/Presentation'

  Mission\Application\:
    resource: '../../src/Mission/Application'

  Mission\Domain\Service\:
    resource: '../../src/Mission/Domain/Service'

  Mission\Infrastructure\:
    resource: '../../src/Mission/Infrastructure'

  Mission\Application\Port\Outbound\MissionResourceGatewayPort:
    alias: Mission\Infrastructure\Adapter\Resource\DoctrineMissionResourceGatewayAdapter

  Mission\Application\Port\Outbound\MissionEquipmentDraftProviderPort:
    alias: Equipment\Infrastructure\Adapter\Mission\EquipmentMissionResourceAdapter

  Mission\Application\Port\Outbound\PublicationRepositoryPort:
    alias: Mission\Infrastructure\Adapter\Publication\DoctrinePublicationAdapter

  Mission\Application\Port\Outbound\PublicationQueuePort:
    alias: Mission\Infrastructure\Adapter\Publication\MessengerPublicationQueueAdapter

  Mission\Application\Port\Outbound\MissionWorkflowGatewayPort:
    alias: Mission\Infrastructure\Adapter\Workflow\DoctrineMissionWorkflowGateway

  Mission\Application\Port\Outbound\MissionIssueQueryPort:
    alias: Mission\Infrastructure\Adapter\Workflow\DoctrineMissionWorkflowGateway

  Mission\Application\Service\MissionChangeApplication:
    arguments:
      $appliers: !tagged_iterator mission.change_applier

  Mission\Application\Service\MissionDraftPublisher:
    arguments:
      $publishers: !tagged_iterator mission.draft_publisher

  Mission\Infrastructure\Adapter\Resource\DoctrineMissionResourceGatewayAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
      $owners: !tagged_iterator mission.resource_owner

  Mission\Infrastructure\Adapter\Publication\DoctrinePublicationAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Mission\Infrastructure\Adapter\Publication\MessengerPublicationQueueAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'

  Mission\Infrastructure\Adapter\Workflow\DoctrineMissionWorkflowGateway:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Mission\Application\UseCase\Command\Publication\RequestPublication\RequestPublicationHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Command\Publication\ExecutePublication\ExecutePublicationHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Query\Publication\GetPublication\GetPublicationHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Command\Workflow\MutateMissionWorkflow\MutateMissionWorkflowHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Query\Workflow\GetMissionWorkflow\GetMissionWorkflowHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Query\Workflow\ListMissionWorkflow\ListMissionWorkflowHandler:
    tags: ['messenger.message_handler']

  Mission\Application\UseCase\Query\Workflow\ListMissionIssues\ListMissionIssuesHandler:
    tags: ['messenger.message_handler']

api_platform:
  mapping:
    paths:
      - '%kernel.project_dir%/src/Approval/Presentation/Api/Resource'
  exception_to_status:
    Approval\Domain\Exception\ApprovalAccessDeniedException: 403
    Approval\Domain\Exception\ApprovalRequestNotFoundException: 404
    Approval\Domain\Exception\ApprovalRequestNotPendingException: 409
    Approval\Domain\Exception\ApproverNotAuthorizedException: 403
    Approval\Domain\Exception\DeferredActionNoLongerApplicableException: 409
    Approval\Domain\Exception\SelfApprovalNotAllowedException: 403

imports:
  - { resource: 'oauth/doctrine.yaml' }
  - { resource: 'oauth/api_platform.yaml' }

services:
  OAuth\Application\Port\Outbound\SessionRotationPort:
    alias: OAuth\Infrastructure\Adapter\Session\SessionRotationAdapter

  OAuth\Infrastructure\Adapter\Session\SessionRotationAdapter:
    autowire: true

  _defaults:
    autowire: true
    autoconfigure: true

  OAuth\Presentation\Api\Service\AuthorizationGrantCompletion:
    arguments:
      $idempotency: '@OAuth\Application\Port\Outbound\Token\AuthorizationReceiptPort'

  # OAuth Module - Validators
  OAuth\Presentation\Api\Validator\ValidScopes\ValidScopesValidator: ~
  OAuth\Presentation\Api\Validator\ValidRedirectUri\ValidRedirectUriValidator: ~

  # UseCases - Auto-register
  OAuth\Application\UseCase\:
    resource: '../../src/OAuth/Application/UseCase/'

  OAuth\Application\Service\OidcClaimsBuilder: ~

  OAuth\Application\Service\OidcClaimsBuilderInterface:
    alias: OAuth\Application\Service\OidcClaimsBuilder

  # Client Query Handlers
  OAuth\Application\UseCase\Query\Client\ValidateClientCredentials\ValidateClientCredentialsHandler:
    tags:
      - { name: messenger.message_handler, handles: OAuth\Application\UseCase\Query\Client\ValidateClientCredentials\ValidateClientCredentialsQuery }

  OAuth\Application\UseCase\Query\Client\GetClient\GetClientHandler:
    tags:
      - { name: messenger.message_handler, handles: OAuth\Application\UseCase\Query\Client\GetClient\GetClientQuery }

  OAuth\Application\UseCase\Query\Client\ListClients\ListClientsHandler:
    tags:
      - { name: messenger.message_handler, handles: OAuth\Application\UseCase\Query\Client\ListClients\ListClientsQuery }

  OAuth\Application\UseCase\Command\Client\RegisterClient\RegisterClientHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Client\UpdateClientDetails\UpdateClientDetailsHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Client\DeleteClient\DeleteClientHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Client\ActivateClient\ActivateClientHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Client\DeactivateClient\DeactivateClientHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Client\RegenerateClientSecret\RegenerateClientSecretHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
      $eventBus: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter'
    tags: ['messenger.message_handler']

  # Token/Consent Handlers
  OAuth\Application\UseCase\Command\Token\IssueToken\IssueTokenHandler:
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Token\RevokeToken\RevokeTokenHandler:
    arguments:
      $transactionManager: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Query\Token\ValidateToken\ValidateTokenHandler:
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Query\Token\IntrospectToken\IntrospectTokenHandler:
    arguments:
      $issuer: '%env(OAUTH_ISSUER)%'
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Query\Token\RefreshToken\RefreshTokenHandler:
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Command\Consent\GrantConsent\GrantConsentHandler:
    tags: ['messenger.message_handler']

  OAuth\Application\UseCase\Query\Consent\CheckConsent\CheckConsentHandler:
    tags: ['messenger.message_handler']

  # Repository
  OAuth\Infrastructure\Persistence\Doctrine\Repository\Client\ClientRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Repository\AccessTokenRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Repository\RefreshTokenRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Repository\AuthCodeRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Repository\ConsentRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Mapper\Client\ClientMapper: ~
  OAuth\Infrastructure\Persistence\Doctrine\Mapper\ConsentMapper: ~

  OAuth\Infrastructure\Persistence\Doctrine\Repository\UserTokenRevocationRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Persistence\Doctrine\Repository\GrantLifecycleRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Application\Port\Outbound\Token\GrantLifecyclePort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\GrantLifecycleRepository

  # Port Binding
  OAuth\Application\Port\Outbound\Token\JwtParserPort:
    alias: OAuth\Infrastructure\Adapter\Jwt\JwtParserAdapter

  OAuth\Application\Port\Outbound\Internal\Token\AccessTokenRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\AccessTokenRepository

  OAuth\Application\Port\Outbound\Internal\Token\RefreshTokenRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\RefreshTokenRepository

  OAuth\Application\Port\Outbound\Internal\Token\AuthCodeRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\AuthCodeRepository

  OAuth\Application\Port\Outbound\Internal\Consent\ConsentRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\ConsentRepository

  OAuth\Application\Port\Outbound\Token\TokenCachePort:
    alias: OAuth\Infrastructure\Adapter\Cache\TokenCacheAdapter

  OAuth\Application\Port\Outbound\Token\TokenRevocationPort:
    alias: OAuth\Infrastructure\Adapter\Token\TokenRevocationAdapter

  OAuth\Application\Port\Outbound\Internal\Token\AuthorizationServerPort:
    class: OAuth\Infrastructure\OAuth2\League\Server\AuthorizationServerAdapter

  OAuth\Application\Port\Outbound\Client\ClientValidationPort:
    class: OAuth\Infrastructure\OAuth2\League\Adapter\ClientValidationAdapter

  OAuth\Application\Port\Outbound\Internal\Client\ClientRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\Client\ClientRepository

  OAuth\Application\Port\Outbound\Internal\Client\OAuthClientRepositoryPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\Client\ClientRepository

  OAuth\Application\Port\Outbound\Token\IdTokenIssuerPort:
    alias: OAuth\Infrastructure\Oidc\Adapter\IdTokenIssuerAdapter

  OAuth\Application\Port\Outbound\Internal\User\OidcUserProviderPort:
    alias: OAuth\Infrastructure\Oidc\Adapter\OidcUserProviderAdapter

  # Auth Bridge Adapters
  Auth\Application\Port\Outbound\TokenRevocationPort:
    alias: OAuth\Infrastructure\Adapter\Token\TokenRevocationAdapter

  Auth\Application\Port\Outbound\TokenRefreshPort:
    alias: OAuth\Infrastructure\Adapter\Auth\TokenRefreshAdapter

  Auth\Application\Port\Outbound\AccessTokenLookupPort:
    alias: OAuth\Infrastructure\Adapter\Auth\AccessTokenLookupAdapter

  Auth\Application\Port\Outbound\ClientRepositoryPort:
    class: OAuth\Infrastructure\OAuth2\League\Adapter\ClientRepositoryPortAdapter

  OAuth\Infrastructure\Adapter\Auth\AccessTokenLookupAdapter: ~
  OAuth\Infrastructure\Adapter\Auth\TokenRefreshAdapter: ~

  OAuth\Application\Port\Outbound\Token\UserTokenRevocationPort:
    alias: OAuth\Infrastructure\Persistence\Doctrine\Repository\UserTokenRevocationRepository

  # OAuth Adapters
  OAuth\Infrastructure\Adapter\Cache\TokenCacheAdapter: ~
  OAuth\Infrastructure\Adapter\Token\TokenRevocationAdapter:
    arguments:
      $eventDispatcher: '@OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventDispatcherAdapter'
  OAuth\Infrastructure\Adapter\Jwt\JwtParserAdapter: ~

  # Console Commands
  OAuth\Infrastructure\Console\Command\Client\CreateClientCommand: ~
  OAuth\Infrastructure\Console\Command\Client\ListClientsCommand: ~
  OAuth\Infrastructure\Console\Command\Client\DeleteClientCommand: ~
  OAuth\Infrastructure\Console\Command\Token\GenerateTokenCommand: ~

  # Event Subscribers
  OAuth\Infrastructure\EventSubscriber\EventLogSubscriber: ~
  OAuth\Presentation\Api\EventSubscriber\OAuthErrorSubscriber: ~
  OAuth\Presentation\Api\EventSubscriber\OAuthResponseSubscriber: ~

  # OIDC Adapter
  OAuth\Infrastructure\Oidc\Adapter\IdTokenIssuerAdapter: ~
  OAuth\Infrastructure\Oidc\Adapter\OidcUserProviderAdapter: ~

  # OAuth Processors
  OAuth\Presentation\Api\Processor\Client\RegisterClientProcessor: ~
  OAuth\Presentation\Api\Processor\Client\UpdateClientProcessor: ~
  OAuth\Presentation\Api\Processor\Client\DeleteClientProcessor: ~
  OAuth\Presentation\Api\Processor\Client\ActivateClientProcessor: ~
  OAuth\Presentation\Api\Processor\Client\DeactivateClientProcessor: ~
  OAuth\Presentation\Api\Processor\Client\RegenerateSecretProcessor: ~
  OAuth\Presentation\Api\Processor\Authorization\AuthorizeProcessor: ~
  OAuth\Presentation\Api\Processor\Consent\GrantConsentProcessor: ~
  OAuth\Presentation\Api\Processor\Session\EndSessionProcessor: ~
  OAuth\Presentation\Api\Processor\Token\IssueTokenProcessor: ~
  OAuth\Presentation\Api\Processor\Token\RevokeTokenProcessor: ~
  OAuth\Presentation\Api\Processor\Token\IntrospectTokenProcessor: ~

  # Discovery Providers
  OAuth\Presentation\Api\Provider\Client\GetClientProvider: ~
  OAuth\Presentation\Api\Provider\Client\ListClientsProvider: ~
  OAuth\Presentation\Api\Provider\Discovery\UserInfoProvider: ~
  OAuth\Presentation\Api\Provider\Discovery\OpenIdConfigurationProvider: ~
  OAuth\Presentation\Api\Provider\Discovery\JwksProvider: ~

  # Domain Services
  OAuth\Domain\Service\TokenValidationService: ~

  # League OAuth2 Server
  League\OAuth2\Server\Repositories\ClientRepositoryInterface:
    class: OAuth\Infrastructure\OAuth2\League\Repository\ClientRepositoryAdapter

  League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface:
    class: OAuth\Infrastructure\OAuth2\League\Repository\AccessTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface:
    class: OAuth\Infrastructure\OAuth2\League\Repository\RefreshTokenRepositoryAdapter

  League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface:
    class: OAuth\Infrastructure\OAuth2\League\Repository\AuthCodeRepositoryAdapter

  League\OAuth2\Server\Repositories\ScopeRepositoryInterface:
    class: OAuth\Infrastructure\OAuth2\League\Repository\ScopeRepositoryAdapter

  access_token_ttl:
    class: DateInterval
    arguments: ['PT1H']

  League\OAuth2\Server\AuthorizationServer:
    arguments:
      $clientRepository: '@League\OAuth2\Server\Repositories\ClientRepositoryInterface'
      $accessTokenRepository: '@League\OAuth2\Server\Repositories\AccessTokenRepositoryInterface'
      $scopeRepository: '@League\OAuth2\Server\Repositories\ScopeRepositoryInterface'
      $privateKey: '%kernel.project_dir%/config/jwt/private.key'
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'
    calls:
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\ClientCredentialsGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\RefreshTokenGrant'
          - '@access_token_ttl'
      - method: enableGrantType
        arguments:
          - '@League\OAuth2\Server\Grant\AuthCodeGrant'
          - '@access_token_ttl'

  League\OAuth2\Server\Grant\ClientCredentialsGrant: ~

  League\OAuth2\Server\Grant\RefreshTokenGrant:
    arguments:
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'

  auth_code_ttl:
    class: DateInterval
    arguments: ['PT10M']

  League\OAuth2\Server\Grant\AuthCodeGrant:
    arguments:
      $authCodeRepository: '@League\OAuth2\Server\Repositories\AuthCodeRepositoryInterface'
      $refreshTokenRepository: '@League\OAuth2\Server\Repositories\RefreshTokenRepositoryInterface'
      $authCodeTTL: '@auth_code_ttl'

  OAuth\Application\Port\Inbound\OAuthDataLifecyclePort:
    alias: OAuth\Infrastructure\Adapter\Lifecycle\OAuthDataLifecycleAdapter
  OAuth\Infrastructure\Adapter\Lifecycle\OAuthDataLifecycleAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Application\Port\Outbound\Internal\User\OidcClaimsBuilderPort:
    alias: OAuth\Application\Service\OidcClaimsBuilder
  OAuth\Application\UseCase\Query\User\GetUserInfo\GetUserInfoHandler:
    tags: ['messenger.message_handler']

  OAuth\Presentation\Api\Service\RefreshTokenCookieService: ~

  OAuth\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  OAuth\Infrastructure\Adapter\Authorization\OAuthPermissionContributionAdapter:
    tags: [authorization.permission_catalog_contribution]

  OAuth\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  OAuth\Application\Port\Inbound\ClientSecurityProofPort: '@OAuth\Infrastructure\Adapter\Idempotency\ClientSecurityProofAdapter'
  OAuth\Infrastructure\Adapter\Idempotency\ClientSecurityProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  OAuth\Infrastructure\Adapter\Idempotency\TokenIdempotencyProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
    tags: [shared.sensitive_idempotency_proof]

  OAuth\Infrastructure\Adapter\Idempotency\OAuthProtocolHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  OAuth\Application\Port\Outbound\Token\AuthorizationReceiptPort: '@OAuth\Infrastructure\Adapter\Idempotency\AuthorizationIdempotencyAdapter'
  OAuth\Infrastructure\Adapter\Idempotency\AuthorizationIdempotencyAdapter:
    arguments:
      $engine: '@shared.http_idempotency.auth'
      $transaction: '@shared.auth_root_transaction'
      $entityManager: '@doctrine.orm.auth_entity_manager'
  OAuth\Infrastructure\EventSubscriber\Idempotency\OAuthIdempotencyExceptionSubscriber: ~

  OAuth\Application\Port\Inbound\ClientLifecycleProofPort: '@OAuth\Infrastructure\Adapter\Idempotency\ClientLifecycleProofAdapter'
  OAuth\Infrastructure\Adapter\Idempotency\ClientLifecycleProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
  OAuth\Infrastructure\Adapter\Idempotency\OAuthClientHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
  OAuth\Infrastructure\Adapter\Idempotency\OAuthClientMutationIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  OAuth\Infrastructure\Adapter\Idempotency\OAuthClientHttpIdempotencyResponseProjectionAdapter:
    tags: [shared.http_idempotency_response_projection]

  OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventBusAdapter:
    arguments:
      $events: '@shared.auth_event_dispatcher'

  OAuth\Application\Port\Inbound\TokenRevocationProofPort: '@OAuth\Infrastructure\Adapter\Idempotency\TokenRevocationProofAdapter'
  OAuth\Infrastructure\Adapter\Idempotency\TokenRevocationProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
      $encryptionKey: '%env(OAUTH_ENCRYPTION_KEY)%'
  OAuth\Infrastructure\Adapter\Idempotency\TokenRevocationIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]
  OAuth\Infrastructure\Adapter\Idempotency\OAuthRevocationHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
  OAuth\Infrastructure\Adapter\Event\TransactionalOAuthEventDispatcherAdapter:
    arguments:
      $events: '@shared.auth_event_dispatcher'

  OAuth\Presentation\Api\Serialization\Decoder\OAuthFormDecoder:
    autoconfigure: false
    tags: [serializer.encoder]
when@dev:
  imports:
    - { resource: 'oauth/seeds.yaml' }

when@test:
  imports:
    - { resource: 'oauth/seeds.yaml' }

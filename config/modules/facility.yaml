imports:
  - { resource: 'facility/doctrine.yaml' }
  - { resource: 'facility/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Facility\Infrastructure\Adapter\Intervention\InterventionEconomicScopeAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Application\Port\Outbound\InterventionEconomicScopePort:
    alias: Facility\Infrastructure\Adapter\Intervention\InterventionEconomicScopeAdapter

  Facility\Presentation\:
    resource: '../../src/Facility/Presentation'

  Facility\Infrastructure\Adapter\ServiceRequest\ServiceRequestSiteTargetAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\FacilityCustomerValidationPort:
    alias: Customer\Infrastructure\Adapter\Facility\FacilityCustomerValidationAdapter

  Facility\Infrastructure\Adapter\Intervention\InterventionSiteCustomerSnapshotAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Intervention\Application\Port\Outbound\InterventionSiteCustomerSnapshotPort:
    alias: Facility\Infrastructure\Adapter\Intervention\InterventionSiteCustomerSnapshotAdapter

  Facility\Infrastructure\Adapter\Maintenance\FacilityMaintenanceLifecycleAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'


  # CanonicalFacilityMutationProcessor names no entity manager on purpose:
  # it holds none since the mutations moved to
  # Application\UseCase\{Command,Query}\Facility\*CanonicalFacility*.

  Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityHierarchyQueryRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityAttachmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Infrastructure\Adapter\Equipment\FacilitySubtreeScopeAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityModelRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\Internal\FacilityModelRepositoryPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityModelRepository

  Facility\Application\Service\FacilityModelAccessGuard: ~

  Facility\Application\Service\FacilitySpatialValidityResolver: ~

  Facility\Infrastructure\Adapter\Spatial\FacilitySpatialReadAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\FacilitySpatialReadPort:
    alias: Facility\Infrastructure\Adapter\Spatial\FacilitySpatialReadAdapter

  Facility\Application\Service\FacilityHierarchyGuard:
    arguments:
      $maxDepth: '%facility.hierarchy.max_depth%'
  Facility\Application\Service\FacilityHierarchyPublicationContext: ~
  Facility\Application\Service\FacilityLifecycleReferenceGuard: ~

  Facility\Application\Port\Inbound\FacilityLifecycleReferencePort:
    alias: Facility\Application\Service\FacilityLifecycleReferenceGuard

  Facility\Infrastructure\Adapter\Hierarchy\FacilityHierarchySnapshotAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\FacilityHierarchySnapshotPort:
    alias: Facility\Infrastructure\Adapter\Hierarchy\FacilityHierarchySnapshotAdapter

  Facility\Application\Port\Inbound\FacilityHierarchyPort:
    alias: Facility\Application\Service\FacilityHierarchyGuard

  Facility\Presentation\Api\Controller\DownloadFacilityModelController:
    tags: ['controller.service_arguments']

  Facility\Application\UseCase\Command\Attachment\SetFacilityAttachmentCalibration\SetFacilityAttachmentCalibrationHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\Port\Outbound\FacilityPlanReferenceCleanupPort:
    alias: Equipment\Infrastructure\Adapter\Facility\EquipmentPlanReferenceCleanupAdapter

  Facility\Application\UseCase\Command\Model\UploadFacilityModel\UploadFacilityModelHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Model\UpdateFacilityModel\UpdateFacilityModelHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Model\ActivateFacilityModel\ActivateFacilityModelHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Model\DeleteFacilityModel\DeleteFacilityModelHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Model\GetFacilityModel\GetFacilityModelHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Model\ListFacilityModels\ListFacilityModelsHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Model\DownloadFacilityModel\DownloadFacilityModelHandler:
    tags: ['messenger.message_handler']

  Facility\Infrastructure\Persistence\Doctrine\Repository\CanonicalFacilityRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\Internal\FacilityRepositoryPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityRepository

  Facility\Application\Port\Outbound\Internal\FacilityAttachmentRepositoryPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityAttachmentRepository

  # The offline-sync half of `facilities`: the three columns
  # FacilityRepositoryPort does not carry, plus the two hierarchy reads the
  # canonical guards need. Separate port because saving the aggregate cannot
  # bump the canonical If-Match revision.
  Facility\Application\Port\Outbound\Internal\CanonicalFacilityRepositoryPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\CanonicalFacilityRepository

  # Third declaration of the same capability, one per consumer — Inspection
  # and Equipment own theirs too, exactly as the FacilityValidationPorts do.
  Facility\Application\Port\Outbound\InterventionScopePort:
    alias: Intervention\Infrastructure\Adapter\Facility\InterventionScopeAdapter

  Intervention\Infrastructure\Adapter\Facility\InterventionScopeAdapter: ~

  # Organization-defined typed metadata schema (facility-metadata-fields)
  Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityMetadataFieldRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\Port\Outbound\Internal\FacilityMetadataFieldRepositoryPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\FacilityMetadataFieldRepository

  Facility\Application\Service\FacilityMetadataSchemaGuard: ~

  # R11b: generalized facility attachments (multipart /facilities/{id}/attachments)



  # Facility plan Phase 4: spatial zone geometry. Neither the processor nor
  # the provider touches Doctrine directly (they dispatch through the bus),
  # so no $entityManager wiring is needed here.
  Facility\Application\Service\FacilityAttachmentAncestryGuard: ~

  Facility\Application\UseCase\Command\Facility\SetFacilityPlanGeometry\SetFacilityPlanGeometryHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetFacilityPlanOverlay\GetFacilityPlanOverlayHandler:
    tags: ['messenger.message_handler']

  # A2: 3D building model — read-only assembly over FacilityRepositoryPort,
  # no new port needed (findBuildingFloors/findRoomsForFloors already carry
  # everything the handler needs, including primary-plan dimensions).
  Facility\Application\UseCase\Query\Facility\GetFacilityBuildingModel\GetFacilityBuildingModelHandler:
    tags: ['messenger.message_handler']

  # A3: FacilityBuildingModelProvider dispatches through the bus only — no
  # Doctrine touch, so it needs no explicit entry here (autoconfigured via
  # the `Facility\Presentation\:` resource above), matching
  # FacilityPlanOverlayProvider.

  # R11b follow-up: the download endpoint serving attachment bytes, gated the
  # same way as FacilityMediaProvider/FacilityMediaProcessor.

  # Archival guard: refuses archiving a facility with active dependents (children,
  # equipment, inspections). The dependency ports are implemented by the owning modules.
  Facility\Application\Service\FacilityArchivalGuard: ~

  Facility\Application\Port\Inbound\FacilityArchivalGuardPort:
    alias: Facility\Application\Service\FacilityArchivalGuard

  Facility\Application\Port\Outbound\FacilityEquipmentDependencyPort:
    alias: Equipment\Infrastructure\Adapter\Facility\FacilityEquipmentDependencyAdapter

  # Facility plan Phase 4, Equipment side: the plan-overlay's equipment read.
  # Adapter hosted in — and wired by — the Equipment module (owns `equipment`).
  Facility\Application\Port\Outbound\FacilityEquipmentPlanPositionPort:
    alias: Equipment\Infrastructure\Adapter\Facility\EquipmentPlanPositionAdapter

  Facility\Application\Port\Outbound\FacilityInspectionDependencyPort:
    alias: Inspection\Infrastructure\Adapter\Facility\FacilityInspectionDependencyAdapter

  Facility\Application\Port\Outbound\FacilityInterventionDependencyPort:
    alias: Intervention\Infrastructure\Adapter\Facility\FacilityInterventionDependencyAdapter

  # Inbound port reused by the Import module's bulk CSV import: provisions
  # facilities through CreateFacilityHandler (quota + parentCode resolution included).
  Facility\Application\Service\FacilityProvisioningService: ~

  Facility\Application\Port\Inbound\FacilityProvisioningPort:
    alias: Facility\Application\Service\FacilityProvisioningService

  facility.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
      $database: main
      $idempotency: '@Shared\Infrastructure\Idempotency\HttpIdempotencyExecutionContext'
  Facility\Infrastructure\Adapter\Organization\FacilityStatisticsAdapter: ~

  Facility\Infrastructure\Adapter\Organization\FacilitySearchAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module read model for the Compliance module (facility directory)
  Facility\Infrastructure\Adapter\Compliance\FacilityComplianceDirectoryAdapter: ~

  Facility\Infrastructure\Adapter\Intervention\FacilityInterventionResourceAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags:
      - intervention.change_applier
      - { name: intervention.draft_publisher, priority: 100 }
      - intervention.resource_owner

  Facility\Infrastructure\Adapter\Intervention\FacilityPublicationGuardAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags:
      - { name: intervention.publication_guard, priority: 100 }

  # Cross-module site naming for the Intervention module's `/interventions/statistics`
  # bySite breakdown — mirrors Facility\Infrastructure\Adapter\Equipment\FacilityNamingAdapter.
  Facility\Infrastructure\Adapter\Intervention\InterventionSiteNamingAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module facility naming for the Maintenance module's schedule CSV export
  Facility\Infrastructure\Adapter\Maintenance\FacilityMaintenanceNamingAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Infrastructure\Adapter\Messaging\FacilityMessagingSubjectResolverAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['messaging.subject_resolver']

  Facility\Application\UseCase\Command\Facility\CreateFacility\CreateFacilityHandler:
    arguments:
      $maxDepth: '%facility.hierarchy.max_depth%'
      $transactionManager: '@facility.main_transaction_manager'
      $eventDispatcher: '@Shared\Infrastructure\Messaging\Outbox\MainTransactionEventDispatcher'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\UpdateFacility\UpdateFacilityHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\ArchiveFacility\ArchiveFacilityHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\RestoreFacility\RestoreFacilityHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\MoveFacility\MoveFacilityHandler:
    arguments:
      $maxDepth: '%facility.hierarchy.max_depth%'
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  # Canonical (flat, offline-syncable) facility mutations. Both name the
  # `main` transaction manager explicitly: autowiring would open a transaction
  # on the `auth` connection while the writes go to `main`.
  Facility\Application\UseCase\Command\Facility\PatchCanonicalFacility\PatchCanonicalFacilityHandler:
    arguments:
      $maxDepth: '%facility.hierarchy.max_depth%'
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\DeleteCanonicalFacility\DeleteCanonicalFacilityHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetCanonicalFacility\GetCanonicalFacilityHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Facility\DuplicateFacilitySubtree\DuplicateFacilitySubtreeHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetFacility\GetFacilityHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetFacilityPaths\GetFacilityPathsHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\ListFacilities\ListFacilitiesHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\ExportFacilities\ExportFacilitiesHandler:
    arguments:
      $events: '@facility.export_events'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\GeocodeAddress\GeocodeAddressHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetFacilityChildren\GetFacilityChildrenHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Facility\GetFacilityDescendants\GetFacilityDescendantsHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Attachment\AddFacilityAttachment\AddFacilityAttachmentHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Attachment\DeleteFacilityAttachment\DeleteFacilityAttachmentHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\Attachment\SetPrimaryFacilityAttachment\SetPrimaryFacilityAttachmentHandler:
    arguments:
      $transactionManager: '@facility.main_transaction_manager'
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Attachment\ListFacilityAttachments\ListFacilityAttachmentsHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\MetadataField\CreateMetadataField\CreateMetadataFieldHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\MetadataField\UpdateMetadataField\UpdateMetadataFieldHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Command\MetadataField\DeleteMetadataField\DeleteMetadataFieldHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\MetadataField\ListMetadataFields\ListMetadataFieldsHandler:
    tags: ['messenger.message_handler']

  # Address geocoding (input aid). The adapter needs no entity manager — it
  # touches no database: HTTP out (base URL from GEOCODING_BASE_URL via
  # #[Autowire] on the adapter), the shared lock factory for the 1 req/s
  # outbound throttle, and Shared's CachePort for the 24 h per-address cache.
  Facility\Application\Port\Outbound\GeocodingPort:
    alias: Facility\Infrastructure\Adapter\Geocoding\NominatimGeocodingAdapter

  Facility\Infrastructure\Adapter\Geocoding\NominatimGeocodingAdapter: ~

  # Console Commands use #[AsCommand]
  Facility\Infrastructure\Console\CreateFacilityConsoleCommand: ~

  Facility\Application\UseCase\Query\SuggestAddresses\SuggestAddressesHandler:
    tags: ['messenger.message_handler']

  Facility\Application\Port\Outbound\Internal\AddressSuggestionsPort:
    alias: Facility\Infrastructure\Adapter\Geocoding\PhotonAddressSuggestionsAdapter

  Facility\Infrastructure\Adapter\Geocoding\PhotonAddressSuggestionsAdapter: ~

  Facility\Infrastructure\EventSubscriber\FacilityPlanAuditListener:
    arguments:
      $events: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'

  Facility\Infrastructure\Adapter\MaintenanceExport\MaintenanceExportSiteIdentityAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['maintenance_export.identity_validator']

  Facility\Application\Port\Inbound\FacilityAvailabilityPort:
    alias: Facility\Infrastructure\Adapter\Onboarding\FacilityAvailabilityAdapter

  Facility\Infrastructure\Adapter\Onboarding\FacilityAvailabilityAdapter: ~

  Facility\Application\Port\Inbound\FacilityMutationAuthorizationPort:
    alias: Facility\Application\Service\FacilityMutationAuthorizationGuard

  Facility\Application\Service\FacilityMutationAuthorizationGuard: ~

  Facility\Application\Port\Outbound\CanonicalFacilityCollectionPort:
    alias: Facility\Infrastructure\Persistence\Doctrine\Repository\CanonicalFacilityCollectionRepository

  Facility\Infrastructure\Persistence\Doctrine\Repository\CanonicalFacilityCollectionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Facility\Application\UseCase\Query\Facility\ListCanonicalFacilities\ListCanonicalFacilitiesHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Attachment\GetFacilityMediaContext\GetFacilityMediaContextHandler:
    tags: ['messenger.message_handler']

  Facility\Application\UseCase\Query\Attachment\DownloadFacilityAttachment\DownloadFacilityAttachmentHandler:
    tags: ['messenger.message_handler']

  Facility\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Facility\Infrastructure\Adapter\Webhook\FacilityWebhookEventSourceAdapter:
    tags:
      - { name: webhook.event_source, priority: 100 }

  Facility\Infrastructure\Adapter\Onboarding\CreateFirstFacilityStepAdapter:
    tags:
      - { name: onboarding.organization_step_contribution }

  Facility\Infrastructure\Adapter\Schema\SchemaContributionAdapter:
    tags: [shared.schema_contribution]

  Facility\Infrastructure\Adapter\Import\FacilityImportKindProcessorAdapter:
    tags: [fireguard.import_kind_processor]

  Facility\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Facility\Infrastructure\Adapter\OrganizationCatalog\FacilityQuotaContributionAdapter:
    tags: [organization.quota_contribution]

  Facility\Infrastructure\Adapter\OrganizationCatalog\FacilitySystemRoleContributionAdapter:
    tags: [organization.system_role_contribution]

  Facility\Infrastructure\Adapter\Idempotency\ResponseProjection\FacilityHttpIdempotencyResponseProjectionAdapter:
    tags: [shared.http_idempotency_response_projection]

  Facility\Infrastructure\Adapter\Idempotency\FacilityHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Facility\Infrastructure\Adapter\Idempotency\FacilityHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
    tags: [http.idempotency_replay_authorization]

  Facility\Application\Port\Inbound\FreshFacilityScopePort: '@Facility\Infrastructure\Adapter\Idempotency\FreshFacilityScopeAdapter'
  Facility\Infrastructure\Adapter\Idempotency\FreshFacilityScopeAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  Facility\Application\Port\Outbound\FacilityCsvRendererPort: '@Facility\Infrastructure\Adapter\Export\FacilityCsvRendererAdapter'
  Facility\Infrastructure\Adapter\Export\FacilityCsvRendererAdapter: ~
  Facility\Application\UseCase\Command\Export\GenerateFacilitiesExport\GenerateFacilitiesExportHandler:
    arguments:
      $transactions: '@facility.main_transaction_manager'
    tags: [messenger.message_handler]

  Facility\Application\Service\Export\FacilityExportCsvSchema: ~

  facility.export_events:
    class: Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $sender: '@messenger.transport.main_outbox'
parameters:
  # Maximum facility hierarchy depth (root = level 1); no facility may end up deeper than this.
  facility.hierarchy.max_depth_default: 8
  facility.hierarchy.max_depth: '%env(int:default:facility.hierarchy.max_depth_default:FACILITY_MAX_DEPTH)%'

when@dev:
  imports:
    - { resource: 'facility/seeds.yaml' }

when@test:
  imports:
    - { resource: 'facility/seeds.yaml' }

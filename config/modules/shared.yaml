# Configuration for the Shared module
# This file contains all service definitions for the Shared kernel

services:
  # Default configuration for Shared services
  _defaults:
    autowire: true
    autoconfigure: true

  # Load all Shared Infrastructure services
  Shared\Infrastructure\:
    resource: '../../src/Shared/Infrastructure/'
    exclude:
      - '../../src/Shared/Infrastructure/**/Tests/'
      - '../../src/Shared/Infrastructure/**/Tests.php'
      - '../../src/Shared/Infrastructure/**/Test.php'
      - '../../src/Shared/Infrastructure/Persistence/Doctrine/Record/'
      - '../../src/Shared/Infrastructure/Messaging/Outbox/OutboxEvent.php'
      - '../../src/Shared/Infrastructure/DataFixtures/SeedFixtureAdapter.php'

  # Load Shared Application layer (handlers)
  Shared\Application\UseCase\:
    resource: '../../src/Shared/Application/UseCase/'

  # Load Shared Presentation layer (API resources, providers)
  Shared\Presentation\:
    resource: '../../src/Shared/Presentation/'

  # Specific adapter configurations
  Shared\Infrastructure\Symfony\Adapter\Outbound\CacheAdapter:
    arguments:
      $cachePool: '@cache.app'

  Shared\Infrastructure\Symfony\Adapter\Outbound\FileStorageAdapter:
    arguments:
      $basePath: '%shared.file_storage.base_path%'

  # Object storage: DSN-driven Flysystem operator (local disk in dev/test,
  # S3/MinIO in staging/prod) backing FlysystemFileStorageAdapter below.
  Shared\Infrastructure\Storage\FlysystemFactory:
    arguments:
      $projectDir: '%kernel.project_dir%'

  shared.flysystem.default:
    class: League\Flysystem\FilesystemOperator
    factory: ['@Shared\Infrastructure\Storage\FlysystemFactory', 'create']
    arguments:
      $dsn: '%env(STORAGE_DSN)%'

  Shared\Infrastructure\Symfony\Adapter\Outbound\FlysystemFileStorageAdapter:
    arguments:
      $filesystem: '@shared.flysystem.default'

  # Port to Adapter bindings (Inbound Ports)
  Shared\Application\Port\Inbound\CommandBusPort: '@Shared\Infrastructure\Symfony\Adapter\Inbound\MessengerCommandBusAdapter'
  Shared\Application\Port\Inbound\QueryBusPort: '@Shared\Infrastructure\Symfony\Adapter\Inbound\MessengerQueryBusAdapter'
  Shared\Application\Port\Inbound\EventListenerPort: '@Shared\Infrastructure\Symfony\Adapter\Inbound\MessengerEventListenerAdapter'
  Shared\Application\Port\Inbound\SeedReferenceRegistryPort: '@Shared\Infrastructure\DataFixtures\SeedReferenceRegistryAdapter'

  Shared\Infrastructure\DataFixtures\SeedReferenceRegistryAdapter:
    tags:
      - { name: kernel.reset, method: reset }

  # Application layer factories
  Shared\Application\Factory\UuidFactory:
    arguments:
      $generator: '@Shared\Application\Port\Outbound\UuidGeneratorPort'

  # Domain service bindings
  Shared\Domain\Service\EventIdProvider: '@Shared\Infrastructure\Service\UuidEventIdProvider'

  # Port to Adapter bindings (Outbound Ports)
  Shared\Application\Port\Outbound\CachePort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\CacheAdapter'
  Shared\Application\Port\Outbound\ClockPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\SystemClockAdapter'
  Shared\Application\Port\Outbound\GeoIpLookupPort: '@Shared\Infrastructure\Adapter\GeoIp\DbIpGeoIpAdapter'
  Shared\Application\Port\Outbound\RequestOriginPort: '@Shared\Infrastructure\Adapter\Http\SymfonyRequestOriginAdapter'

  Shared\Infrastructure\Adapter\GeoIp\DbIpGeoIpAdapter:
    arguments:
      $databasePath: '%env(resolve:GEOIP_DATABASE_PATH)%'
      $enabled: '%env(bool:GEOIP_ENABLED)%'
      $maxAgeDays: '%env(int:GEOIP_MAX_AGE_DAYS)%'

  Shared\Infrastructure\Adapter\GeoIp\DbIpDatabaseUpdaterAdapter:
    arguments:
      $databasePath: '%env(resolve:GEOIP_DATABASE_PATH)%'

  Shared\Infrastructure\Console\UpdateGeoIpCommand:
    arguments:
      $enabled: '%env(bool:GEOIP_ENABLED)%'
      $maxAgeDays: '%env(int:GEOIP_MAX_AGE_DAYS)%'

  Shared\Infrastructure\Console\InspectWorkerQueuesCommand:
    arguments:
      $authConnection: '@doctrine.dbal.auth_connection'
      $mainConnection: '@doctrine.dbal.main_connection'

  Shared\Application\Port\Outbound\EventBusPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\MessengerEventBusAdapter'
  Shared\Application\Port\Outbound\FileStoragePort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\FlysystemFileStorageAdapter'
  Shared\Application\Port\Outbound\FileCleanupPort: '@Shared\Infrastructure\Messaging\Outbox\TransactionalFileCleanupAdapter'
  Shared\Application\Port\Outbound\RootTransactionManagerPort: '@Shared\Infrastructure\Messaging\Outbox\RootTransactionManagerAdapter'
  Shared\Application\Port\Outbound\SpreadsheetSafeTextPort: '@Shared\Infrastructure\Csv\SpreadsheetSafeTextAdapter'
  Shared\Application\Port\Outbound\ImageInputValidationPort: '@Shared\Infrastructure\Image\ImageInputValidationAdapter'
  Shared\Application\Port\Outbound\LoggerPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\LoggerAdapter'
  Shared\Application\Port\Outbound\MailerPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\MailerAdapter'
  Shared\Application\Port\Outbound\TransactionManagerPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
  Shared\Application\Port\Outbound\TranslationPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\TranslatorAdapter'
  Shared\Application\Port\Outbound\UuidGeneratorPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\UuidGeneratorAdapter'
  Shared\Application\Port\Outbound\HashingPort: '@Shared\Infrastructure\Symfony\Adapter\Outbound\HashingAdapter'
  Shared\Application\Port\Outbound\EventDispatcherPort: '@Shared\Infrastructure\EventDispatcher\SymfonyEventDispatcherAdapter'
  Shared\Application\Port\Outbound\CurrentActorPort: '@Auth\Infrastructure\Adapter\Shared\CurrentActorAdapter'
  Shared\Application\Port\Outbound\DurableEventContextPort: '@Shared\Infrastructure\Messaging\Outbox\DurableEventContext'
  Shared\Application\Port\Outbound\Event\IntegrationEventDecoderPort: '@Shared\Infrastructure\EventDispatcher\CompositeIntegrationEventDecoder'
  Shared\Application\Port\Outbound\Event\IntegrationEventSnapshotPort: '@Shared\Infrastructure\EventDispatcher\ReflectionIntegrationEventSnapshotAdapter'

  Shared\Infrastructure\EventDispatcher\CompositeIntegrationEventDecoder:
    arguments:
      $converters: !tagged_iterator shared.integration_event_converter

  # Explicitly register every owner converter: modules with individual service
  # declarations have no Infrastructure resource to discover tagged attributes.
  Approval\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Assistant\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Audit\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Auth\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Automation\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Calendar\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Compliance\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Customer\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Equipment\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Facility\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Import\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Inspection\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Intervention\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Maintenance\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  MaintenanceExport\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Messaging\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  OAuth\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Onboarding\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Organization\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Otp\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Procurement\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  ServiceRequest\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  User\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~
  Webhook\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $sender: '@messenger.transport.main_outbox'

  # The historical default transaction port is auth-owned. Business commands
  # explicitly use the main DBAL or root-commit adapter instead.
  Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  Shared\Infrastructure\Messaging\Outbox\RootTransactionManagerAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $entityManager: '@doctrine.orm.main_entity_manager'

  shared.auth_root_transaction:
    class: Shared\Infrastructure\Messaging\Outbox\RootTransactionManagerAdapter
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
      $entityManager: '@doctrine.orm.auth_entity_manager'

  shared.auth_event_dispatcher:
    class: Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
      $sender: '@messenger.transport.auth_outbox'

  shared.auth_file_cleanup:
    class: Shared\Infrastructure\Messaging\Outbox\TransactionalFileCleanupAdapter
    arguments:
      $events: '@shared.auth_event_dispatcher'
      $owningDatabase: auth

  Shared\Infrastructure\EventSubscriber\FileCleanupSubscriber:
    arguments:
      $authReceipts: '@shared.auth_event_consumer'

  Shared\Infrastructure\Messaging\Outbox\TransactionalFileCleanupAdapter:
    arguments:
      $events: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'

  Shared\Infrastructure\Messaging\Outbox\MainTransactionEventDispatcher:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  Shared\Infrastructure\Messaging\Outbox\DoctrineIdempotentConsumerAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'

  shared.auth_event_consumer:
    class: Shared\Infrastructure\Messaging\Outbox\DoctrineIdempotentConsumerAdapter
    arguments:
      $connection: '@doctrine.dbal.auth_connection'

  Shared\Application\Port\Outbound\IdempotentConsumerPort: '@Shared\Infrastructure\Messaging\Outbox\DoctrineIdempotentConsumerAdapter'
  Shared\Application\Port\Outbound\RateLimiterPort: '@Auth\Infrastructure\Adapter\RateLimiter\LoginRateLimiterAdapter'
  Shared\Application\Port\Outbound\HealthCheckPort: '@Shared\Infrastructure\Adapter\Doctrine\HealthCheckAdapter'

  # Health Check Adapter configuration
  Shared\Infrastructure\Adapter\Doctrine\HealthCheckAdapter:
    arguments:
      $authConnection: '@doctrine.dbal.auth_connection'
      $mainConnection: '@doctrine.dbal.main_connection'
      $cache: '@cache.app'

  Shared\Application\UseCase\Query\Health\HealthCheckHandler:
    tags:
      - { name: messenger.message_handler, handles: Shared\Application\UseCase\Query\Health\HealthCheckQuery }

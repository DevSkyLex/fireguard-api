imports:
  - { resource: 'approval/doctrine.yaml' }
  - { resource: 'approval/api_platform.yaml' }
  - { resource: 'approval/framework.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Approval\Presentation\:
    resource: '../../src/Approval/Presentation'

  Approval\Application\Service\:
    resource: '../../src/Approval/Application/Service'

  Approval\Infrastructure\Scheduler\:
    resource: '../../src/Approval/Infrastructure/Scheduler'

  # Inbound port (the interception seam consumed by Inspection/Equipment processors)
  Approval\Application\Port\Inbound\ApprovalGatePort:
    alias: Approval\Application\Service\ApprovalGate

  # Outbound ports
  Approval\Application\Port\Outbound\ApprovalDecisionLockPort:
    alias: Approval\Infrastructure\Persistence\Doctrine\Lock\PostgresApprovalDecisionLockAdapter

  Approval\Infrastructure\Persistence\Doctrine\Lock\PostgresApprovalDecisionLockAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Approval\Application\Port\Outbound\Internal\ApprovalRequestRepositoryPort:
    alias: Approval\Infrastructure\Persistence\Doctrine\Repository\ApprovalRequestRepository

  # Cross-module outbound ports (adapters hosted in Organization)
  Approval\Application\Port\Outbound\ApprovalPolicyPort:
    alias: Organization\Infrastructure\Adapter\Approval\OrganizationApprovalPolicyAdapter

  Approval\Application\Port\Outbound\ApprovalMemberDirectoryPort:
    alias: Organization\Infrastructure\Adapter\Approval\OrganizationApprovalMemberDirectoryAdapter

  # Tagged-iterator executor registry — consumes every owning module's tagged adapter
  Approval\Application\Service\ApprovalActionExecutorRegistry:
    arguments:
      $executors: !tagged_iterator approval.deferred_action_executor

  # Cross-module adapter hosted here (implements Organization's action-type catalog port)
  Approval\Infrastructure\Adapter\Organization\ApprovalActionTypeCatalogAdapter: ~

  # Repository (main entity manager)
  Approval\Infrastructure\Persistence\Doctrine\Repository\ApprovalRequestRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Command handlers
  Approval\Application\UseCase\Command\Decision\ApproveApprovalRequest\ApproveApprovalRequestHandler:
    tags: ['messenger.message_handler']

  Approval\Application\UseCase\Command\Decision\RejectApprovalRequest\RejectApprovalRequestHandler:
    tags: ['messenger.message_handler']

  Approval\Application\UseCase\Command\Sweep\ExpireStaleApprovalRequests\ExpireStaleApprovalRequestsHandler:
    tags: ['messenger.message_handler']

  Approval\Application\UseCase\Command\Decision\WithdrawApprovalRequest\WithdrawApprovalRequestHandler:
    arguments:
      $eventDispatcher: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'
    tags: ['messenger.message_handler']

  # Query handlers
  Approval\Application\UseCase\Query\Request\GetApprovalRequest\GetApprovalRequestHandler:
    tags: ['messenger.message_handler']

  Approval\Application\UseCase\Query\Request\ListApprovalRequests\ListApprovalRequestsHandler:
    tags: ['messenger.message_handler']

  Approval\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Approval\Application\Port\Outbound\ApprovalActionCatalogPort: '@Approval\Application\Service\ApprovalActionCatalogRegistry'
  Approval\Application\Service\ApprovalActionCatalogRegistry:
    arguments:
      $providers: !tagged_iterator approval.action_descriptor
      $executors: !tagged_iterator approval.deferred_action_executor

  Approval\Infrastructure\Adapter\Schema\SchemaContributionAdapter:
    tags: [shared.schema_contribution]

  Approval\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Approval\Infrastructure\Adapter\OrganizationCatalog\ApprovalSystemRoleContributionAdapter:
    tags: [organization.system_role_contribution]

  Approval\Infrastructure\Adapter\OrganizationCatalog\ApprovalSettingsPolicyContributionAdapter:
    tags: [organization.settings_policy_contribution]

  Approval\Infrastructure\Adapter\Idempotency\ApprovalHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Approval\Infrastructure\Adapter\Idempotency\ApprovalHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $policy: '@Organization\Infrastructure\Adapter\Idempotency\FreshOrganizationApprovalPolicyAdapter'
    tags: [http.idempotency_replay_authorization]

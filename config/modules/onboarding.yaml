imports:
  - { resource: 'onboarding/doctrine.yaml' }
  - { resource: 'onboarding/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Onboarding\Presentation\:
    resource: '../../src/Onboarding/Presentation'

  onboarding.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
      $database: main
      $idempotency: '@Shared\Infrastructure\Idempotency\HttpIdempotencyExecutionContext'
  Onboarding\Infrastructure\Persistence\Doctrine\Repository\OrganizationOnboardingSessionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Onboarding\Application\Port\Outbound\Internal\OrganizationOnboardingSessionRepositoryPort:
    alias: Onboarding\Infrastructure\Persistence\Doctrine\Repository\OrganizationOnboardingSessionRepository

  Onboarding\Application\Service\OrganizationOnboardingFlowService:
    arguments:
      $transactionManager: '@onboarding.main_transaction_manager'

  Onboarding\Application\Port\Inbound\Internal\OrganizationOnboardingServicePort:
    alias: Onboarding\Application\Service\OrganizationOnboardingFlowService

  Onboarding\Infrastructure\EventSubscriber\OnboardingNotificationSubscriber: ~

  Onboarding\Infrastructure\Persistence\Doctrine\Repository\OrganizationSetupRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Onboarding\Application\Port\Outbound\OrganizationSetupRepositoryPort:
    alias: Onboarding\Infrastructure\Persistence\Doctrine\Repository\OrganizationSetupRepository

  Onboarding\Application\Service\OrganizationSetupService:
    arguments:
      $transactionManager: '@onboarding.main_transaction_manager'

  Onboarding\Application\UseCase\Command\Setup\PrepareOrganizationSetup\PrepareOrganizationSetupHandler:
    tags: ['messenger.message_handler']

  Onboarding\Application\Port\Inbound\OrganizationSetupPort:
    alias: Onboarding\Application\Service\OrganizationSetupService

  Onboarding\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Onboarding\Application\Service\OrganizationOnboardingStepRegistry:
    arguments:
      $contributions: !tagged_iterator onboarding.organization_step_contribution

  Onboarding\Application\UseCase\Command\Flow\SynchronizeOrganizationOnboarding\SynchronizeOrganizationOnboardingHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\StartOrganizationOnboarding\StartOrganizationOnboardingHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\ExecuteOrganizationOnboardingStep\ExecuteOrganizationOnboardingStepHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\SkipOrganizationOnboardingStep\SkipOrganizationOnboardingStepHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\RollbackOrganizationOnboarding\RollbackOrganizationOnboardingHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\DismissOrganizationOnboarding\DismissOrganizationOnboardingHandler:
    tags: [messenger.message_handler]
  Onboarding\Application\UseCase\Command\Flow\ResumeOrganizationOnboarding\ResumeOrganizationOnboardingHandler:
    tags: [messenger.message_handler]

  Onboarding\Infrastructure\Adapter\Idempotency\OnboardingHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
  Onboarding\Infrastructure\Adapter\Idempotency\OnboardingHttpIdempotencyReplayAuthorizationAdapter:
    tags: [http.idempotency_replay_authorization]

when@dev:
  imports:
    - { resource: 'onboarding/seeds.yaml' }

when@test:
  imports:
    - { resource: 'onboarding/seeds.yaml' }

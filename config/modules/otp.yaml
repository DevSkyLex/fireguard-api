imports:
  - { resource: 'otp/doctrine.yaml' }
  - { resource: 'otp/api_platform.yaml' }

parameters:
  # Fallback when TOTP_DIGITS is absent from the environment (.env.example
  # documents it); 6 digits is the authenticator-app standard.
  env(TOTP_DIGITS): '6'
  env(TOTP_ENCRYPTION_KEYS): '{}'
  env(TOTP_ENCRYPTION_WRITE_KEY): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # OTP Module - Ports
  Otp\Application\Port\Inbound\Challenge\ChallengeAccessPort:
    alias: Otp\Application\Service\ChallengeAccessService
  Otp\Application\Service\ChallengeAccessService: ~
  Otp\Application\Port\Outbound\Internal\Challenge\OtpRepositoryPort:
    alias: Otp\Infrastructure\Persistence\Doctrine\Repository\OtpRepository

  Otp\Application\Port\Outbound\Internal\Challenge\OtpNotifierPort:
    alias: Otp\Infrastructure\Adapter\Notifier\OtpNotifierAdapter

  Otp\Application\Port\Outbound\Internal\Totp\TotpServicePort:
    alias: Otp\Infrastructure\Adapter\Notifier\TotpAdapter

  Otp\Application\Port\Outbound\Internal\Totp\TotpEnrollmentRepositoryPort:
    alias: Otp\Infrastructure\Persistence\Doctrine\Repository\TotpEnrollmentRepository

  Otp\Application\Port\Inbound\Challenge\OtpChallengePort:
    alias: Otp\Application\Service\OtpChallengeService

  Otp\Application\Port\Inbound\Totp\TotpEnrollmentPurgePort:
    alias: Otp\Infrastructure\Persistence\Doctrine\Repository\TotpEnrollmentRepository

  Otp\Application\Port\Inbound\Totp\TotpStatusPort:
    alias: Otp\Application\Service\TotpStatusService

  # OTP Repository
  Otp\Infrastructure\Persistence\Doctrine\Repository\OtpRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Infrastructure\Persistence\Doctrine\Mapper\OtpMapper: ~

  # TOTP Enrollment Repository
  Otp\Infrastructure\Persistence\Doctrine\Repository\TotpEnrollmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Infrastructure\Persistence\Doctrine\Mapper\TotpEnrollmentMapper: ~

  Otp\Application\Port\Outbound\Totp\TotpSecretCipherPort:
    alias: Otp\Infrastructure\Adapter\Crypto\OpensslTotpSecretCipherAdapter

  Otp\Infrastructure\Adapter\Crypto\OpensslTotpSecretCipherAdapter:
    arguments:
      $encodedKeys: '%env(json:TOTP_ENCRYPTION_KEYS)%'
      $writeKeyId: '%env(TOTP_ENCRYPTION_WRITE_KEY)%'

  Otp\Infrastructure\Console\MigrateTotpSecretsCommand:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Application\Service\TotpStatusService: ~

  Otp\Infrastructure\Adapter\Auth\TotpEnrollmentCheckAdapter: ~

  # OTP Notifier
  Otp\Infrastructure\Notification\RequestOriginResolver: ~

  Otp\Infrastructure\Adapter\Notifier\OtpNotifierAdapter:
    arguments:
      $senderEmail: '%env(MAILER_FROM)%'

  Otp\Infrastructure\Adapter\Notifier\TotpAdapter: ~

  # OTP Challenge Service
  Otp\Application\Service\OtpChallengeService: ~

  # Command Handlers
  Otp\Application\UseCase\Command\Challenge\GenerateOtp\GenerateOtpHandler:
    arguments:
      $otpCodeLength: '%env(int:OTP_CODE_LENGTH)%'
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Command\Challenge\VerifyOtp\VerifyOtpHandler:
    arguments:
      $transaction: '@Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter'
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Command\Totp\SetupTotp\SetupTotpHandler:
    arguments:
      $rootTransaction: '@shared.auth_root_transaction'
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Command\Totp\ConfirmTotp\ConfirmTotpHandler:
    arguments:
      $rootTransaction: '@shared.auth_root_transaction'
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Command\Totp\DisableTotp\DisableTotpHandler:
    arguments:
      $rootTransaction: '@shared.auth_root_transaction'
      $durableEvents: '@shared.auth_event_dispatcher'
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Command\Challenge\ResendChallenge\ResendChallengeHandler:
    tags: ['messenger.message_handler']

  # Query Handlers
  Otp\Application\UseCase\Query\Challenge\GetChallengeStatus\GetChallengeStatusHandler:
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Query\Config\ListPurposes\ListPurposesHandler:
    tags: ['messenger.message_handler']
  Otp\Application\UseCase\Query\Config\ListChannels\ListChannelsHandler:
    tags: ['messenger.message_handler']

  # API Processors
  Otp\Presentation\Api\Processor\Challenge\VerifyOtpProcessor: ~
  Otp\Presentation\Api\Processor\Totp\SetupTotpProcessor: ~
  Otp\Presentation\Api\Processor\Totp\ConfirmTotpProcessor: ~
  Otp\Presentation\Api\Processor\Totp\DisableTotpProcessor: ~
  Otp\Presentation\Api\Processor\Challenge\CreateChallengeProcessor: ~
  Otp\Presentation\Api\Processor\Challenge\ResendChallengeProcessor: ~

  # API Providers
  Otp\Presentation\Api\Provider\Challenge\GetChallengeStatusProvider: ~
  Otp\Presentation\Api\Provider\Config\ListPurposesProvider: ~
  Otp\Presentation\Api\Provider\Config\ListChannelsProvider: ~

  Otp\Application\Port\Inbound\Challenge\EmailOwnershipChallengePort:
    alias: Otp\Application\Service\EmailOwnershipChallengeService
  Otp\Application\Service\EmailOwnershipChallengeService:
    arguments:
      $transaction: '@otp.email_ownership_transaction'
  otp.email_ownership_transaction:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
      $database: auth
      $idempotency: '@Shared\Infrastructure\Idempotency\HttpIdempotencyExecutionContext'
  Otp\Application\Port\Inbound\OtpDataLifecyclePort:
    alias: Otp\Infrastructure\Adapter\Lifecycle\OtpDataLifecycleAdapter
  Otp\Infrastructure\Adapter\Lifecycle\OtpDataLifecycleAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Otp\Infrastructure\Adapter\Authorization\OtpPermissionContributionAdapter:
    tags: [authorization.permission_catalog_contribution]

  Otp\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Otp\Application\Port\Inbound\Challenge\MfaChallengeVerificationPort: '@Otp\Application\Service\MfaChallengeVerificationService'
  Otp\Application\Service\MfaChallengeVerificationService: ~
  Otp\Application\Port\Outbound\Internal\Totp\RecoveryCodeGeneratorPort: '@Otp\Infrastructure\Adapter\Crypto\RecoveryCodeGeneratorAdapter'
  Otp\Infrastructure\Adapter\Crypto\RecoveryCodeGeneratorAdapter: ~
  Otp\Application\UseCase\Command\Totp\GenerateRecoveryCodes\GenerateRecoveryCodesHandler:
    arguments:
      $rootTransaction: '@shared.auth_root_transaction'
      $events: '@shared.auth_event_dispatcher'
    tags: [messenger.message_handler]
  Otp\Application\UseCase\Command\Challenge\VerifyMfaChallenge\VerifyMfaChallengeHandler:
    arguments:
      $events: '@shared.auth_event_dispatcher'
    tags: [messenger.message_handler]
  Otp\Application\UseCase\Query\Totp\GetRecoveryCodesStatus\GetRecoveryCodesStatusHandler:
    tags: [messenger.message_handler]

  Otp\Presentation\Api\Processor\Totp\GenerateRecoveryCodesProcessor: ~
  Otp\Presentation\Api\Provider\Totp\GetRecoveryCodesStatusProvider: ~
  Otp\Presentation\Api\EventSubscriber\RecoveryCodesExceptionSubscriber: ~
  Otp\Presentation\Api\Service\RecoveryCodesActor: ~

  Otp\Application\Port\Inbound\Challenge\ChallengeReplayProofPort: '@Otp\Infrastructure\Adapter\Idempotency\ChallengeReplayProofAdapter'
  Otp\Infrastructure\Adapter\Idempotency\ChallengeReplayProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Infrastructure\Adapter\Idempotency\OtpAuthenticatorHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Otp\Application\Port\Inbound\Challenge\ChallengeLifecycleProofPort: '@Otp\Infrastructure\Adapter\Idempotency\ChallengeLifecycleProofAdapter'
  Otp\Infrastructure\Adapter\Idempotency\ChallengeLifecycleProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Otp\Infrastructure\Adapter\Idempotency\AuthenticatorIdempotencyProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
    tags: [shared.sensitive_idempotency_proof]

  Otp\Infrastructure\Adapter\Idempotency\OtpChallengeHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]
  Otp\Infrastructure\Adapter\Idempotency\ChallengeIdempotencyProofAdapter:
    tags: [shared.sensitive_idempotency_proof]

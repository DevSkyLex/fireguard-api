imports:
  - { resource: 'authorization/doctrine.yaml' }
  - { resource: 'authorization/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Authorization Module - Ports
  Authorization\Application\Port\Outbound\Internal\PermissionRepositoryPort:
    alias: Authorization\Infrastructure\Persistence\Doctrine\Repository\PermissionRepository

  Authorization\Presentation\:
    resource: '../../src/Authorization/Presentation'

  Authorization\Presentation\Api\Provider\Permission\ListPermissionsProvider:
    tags: ['api_platform.state_provider']

  # Command Handlers
  Authorization\Application\UseCase\Command\Role\CreateRole\CreateRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\UpdateRole\UpdateRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\DeleteRole\DeleteRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\AddPermissionToRole\AddPermissionToRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\RemovePermissionFromRole\RemovePermissionFromRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\CreatePermission\CreatePermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\UpdatePermission\UpdatePermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\DeletePermission\DeletePermissionHandler:
    tags: ['messenger.message_handler']

  # Event Handlers
  Authorization\Application\EventHandler\AssignDefaultRoleOnUserCreatedHandler:
    tags: ['messenger.message_handler']

  # Query Handlers
  Authorization\Application\UseCase\Query\Role\GetRole\GetRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Role\ListRoles\ListRolesHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Permission\GetPermission\GetPermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Permission\ListPermissions\ListPermissionsHandler:
    tags: ['messenger.message_handler']


  Authorization\Application\Port\Outbound\Internal\RoleRepositoryPort:
    alias: Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleRepository

  Authorization\Application\Port\Outbound\Internal\RoleAssignmentRepositoryPort:
    alias: Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleAssignmentRepository

  # Inbound Port (Authorization API)
  Authorization\Application\Port\Inbound\AuthorizationPort:
    class: Authorization\Application\Service\AuthorizationService

  # Mappers
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\PermissionMapper: ~
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\RoleMapper: ~
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\RoleAssignmentMapper: ~

  # Repositories
  Authorization\Infrastructure\Persistence\Doctrine\Repository\PermissionRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleAssignmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  # Authorization Service
  Authorization\Application\Service\AuthorizationCacheInvalidator: ~

  Authorization\Application\Service\AuthorizationService:
    arguments:
      $permissionCacheTtl: '%env(int:AUTHZ_PERMISSION_CACHE_TTL)%'

  # Security Voters
  Authorization\Infrastructure\Security\Voter\PermissionVoter:
    tags: ['security.voter']

  Authorization\Infrastructure\Security\Voter\RoleVoter:
    tags: ['security.voter']

  # Console Commands
  Authorization\Infrastructure\Console\AssignRoleCommand:
    tags: ['console.command']
  Authorization\Infrastructure\Console\SyncPermissionsCommand:
    tags: ['console.command']

  Authorization\Application\Port\Inbound\AuthorizationDataLifecyclePort:
    alias: Authorization\Infrastructure\Adapter\Lifecycle\AuthorizationDataLifecycleAdapter
  Authorization\Infrastructure\Adapter\Lifecycle\AuthorizationDataLifecycleAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Application\Port\Inbound\AuthorizationSeedRoleAssignmentsPort:
    alias: Authorization\Infrastructure\Adapter\Lifecycle\AuthorizationSeedRoleAssignmentsAdapter
  Authorization\Infrastructure\Adapter\Lifecycle\AuthorizationSeedRoleAssignmentsAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Infrastructure\Adapter\Schema\SchemaContributionAdapter:
    tags: [shared.schema_contribution]

  Authorization\Application\Port\Outbound\PermissionCatalogPort: '@Authorization\Infrastructure\Catalog\PermissionCatalog'
  Authorization\Application\Port\Outbound\RoleCatalogPort: '@Authorization\Infrastructure\Catalog\RoleCatalog'
  Authorization\Infrastructure\Catalog\PermissionCatalog:
    arguments:
      $contributors: !tagged_iterator authorization.permission_catalog_contribution
  Authorization\Infrastructure\Catalog\RoleCatalog:
    arguments:
      $contributors: !tagged_iterator authorization.role_catalog_contribution

  Authorization\Infrastructure\Adapter\Authorization\AuthorizationPermissionContributionAdapter:
    tags: [authorization.permission_catalog_contribution]

  Authorization\Infrastructure\Adapter\Authorization\SystemRoleContributionAdapter:
    tags: [authorization.role_catalog_contribution]

  Authorization\Application\Port\Inbound\FreshAuthorizationPort: '@Authorization\Infrastructure\Adapter\Idempotency\FreshAuthorizationAdapter'
  Authorization\Infrastructure\Adapter\Idempotency\FreshAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
  Authorization\Infrastructure\Adapter\Idempotency\EvidenceAuthorizationAdapter:
    decorates: Authorization\Application\Port\Inbound\AuthorizationPort
    arguments:
      $users: '@Shared\Application\Port\Outbound\Idempotency\HttpIdempotencyAccountPort'
      $inner: '@Authorization\Infrastructure\Adapter\Idempotency\EvidenceAuthorizationAdapter.inner'

  Shared\Application\Port\Outbound\Idempotency\HttpIdempotencyPlatformAuthorityPort: '@Authorization\Infrastructure\Adapter\Idempotency\AuthorizationHttpIdempotencyPlatformAuthorityAdapter'
  Authorization\Infrastructure\Adapter\Idempotency\AuthorizationHttpIdempotencyPlatformAuthorityAdapter:
    arguments:
      $hierarchy: '@security.role_hierarchy'

  Authorization\Infrastructure\Adapter\Idempotency\AuthorizationHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Authorization\Infrastructure\Adapter\Idempotency\AuthorizationHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
    tags: [http.idempotency_replay_authorization]

  Authorization\Application\Port\Inbound\UserGrantSnapshotPort: '@Authorization\Infrastructure\Adapter\Idempotency\UserGrantSnapshotAdapter'
  Authorization\Infrastructure\Adapter\Idempotency\UserGrantSnapshotAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'

when@dev:
  imports:
    - { resource: 'authorization/seeds.yaml' }

when@test:
  imports:
    - { resource: 'authorization/seeds.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Authorization Module - Ports
  Authorization\Application\Port\Outbound\PermissionRepositoryPort:
    class: Authorization\Infrastructure\Persistence\Doctrine\Repository\PermissionRepository

  Authorization\Presentation\:
    resource: '../../src/Authorization/Presentation'

  Authorization\Presentation\Api\Provider\Permission\ListPermissionsProvider:
    tags: ['api_platform.state_provider']

  # Command Handlers
  Authorization\Application\UseCase\Command\Role\CreateRole\CreateRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\UpdateRole\UpdateRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\DeleteRole\DeleteRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\AddPermissionToRole\AddPermissionToRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Role\RemovePermissionFromRole\RemovePermissionFromRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\CreatePermission\CreatePermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\UpdatePermission\UpdatePermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Command\Permission\DeletePermission\DeletePermissionHandler:
    tags: ['messenger.message_handler']

  # Query Handlers
  Authorization\Application\UseCase\Query\Role\GetRole\GetRoleHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Role\ListRoles\ListRolesHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Permission\GetPermission\GetPermissionHandler:
    tags: ['messenger.message_handler']
  Authorization\Application\UseCase\Query\Permission\ListPermissions\ListPermissionsHandler:
    tags: ['messenger.message_handler']


  Authorization\Application\Port\Outbound\RoleRepositoryPort:
    class: Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleRepository

  Authorization\Application\Port\Outbound\RoleAssignmentRepositoryPort:
    class: Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleAssignmentRepository

  # Inbound Port (Authorization API)
  Authorization\Application\Port\Inbound\AuthorizationPort:
    class: Authorization\Application\Service\AuthorizationService

  # Mappers
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\PermissionMapper: ~
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\RoleMapper: ~
  Authorization\Infrastructure\Persistence\Doctrine\Mapper\RoleAssignmentMapper: ~

  # Repositories
  Authorization\Infrastructure\Persistence\Doctrine\Repository\PermissionRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  Authorization\Infrastructure\Persistence\Doctrine\Repository\RoleAssignmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  # Authorization Service
  Authorization\Application\Service\AuthorizationCacheInvalidator: ~

  Authorization\Application\Service\AuthorizationService:
    arguments:
      $permissionCacheTtl: '%env(int:AUTHZ_PERMISSION_CACHE_TTL)%'

  # Security Voters
  Authorization\Infrastructure\Security\Voter\PermissionVoter:
    tags: ['security.voter']

  Authorization\Infrastructure\Security\Voter\RoleVoter:
    tags: ['security.voter']

  # Console Commands
  Authorization\Infrastructure\Console\AssignRoleCommand:
    tags: ['console.command']
  Authorization\Infrastructure\Console\SyncPermissionsCommand:
    tags: ['console.command']

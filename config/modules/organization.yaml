services:
  _defaults:
    autowire: true
    autoconfigure: true

  Organization\Presentation\:
    resource: '../../src/Organization/Presentation'

  organization.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Command handlers
  Organization\Application\UseCase\Command\Organization\CreateOrganization\CreateOrganizationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\DeleteOrganization\DeleteOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\UpdateOrganizationSettings\UpdateOrganizationSettingsHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AddOrganizationMember\AddOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
      $quota: '@Organization\Application\Port\Inbound\OrganizationQuotaPort'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\CreateOrganizationRole\CreateOrganizationRoleHandler:
    tags: ['messenger.message_handler']

  # The handlers guarded against last-administrator lockout run the check and the
  # write in one 'main' transaction: the guard's advisory lock is
  # transaction-scoped, so it only serializes concurrent callers when it is taken
  # on the same connection that commits the write.
  Organization\Application\UseCase\Command\Organization\UpdateOrganizationRole\UpdateOrganizationRoleHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AssignOrganizationRoleToMember\AssignOrganizationRoleToMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RemoveOrganizationMember\RemoveOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\LeaveOrganization\LeaveOrganizationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\TransferOrganizationOwnership\TransferOrganizationOwnershipHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RemoveOrganizationRoleFromMember\RemoveOrganizationRoleFromMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\ReactivateOrganizationMember\ReactivateOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
      $quota: '@Organization\Application\Port\Inbound\OrganizationQuotaPort'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\SetOrganizationMemberRoles\SetOrganizationMemberRolesHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\DeleteOrganizationRole\DeleteOrganizationRoleHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\SuspendOrganization\SuspendOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RestoreOrganization\RestoreOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RemoveOrganizationLogo\RemoveOrganizationLogoHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Team\CreateTeam\CreateTeamHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Team\UpdateTeam\UpdateTeamHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Team\DeleteTeam\DeleteTeamHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Team\AddTeamMember\AddTeamMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Team\RemoveTeamMember\RemoveTeamMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\InviteOrganizationMember\InviteOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
      $quota: '@Organization\Application\Port\Inbound\OrganizationQuotaPort'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AcceptOrganizationInvitation\AcceptOrganizationInvitationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RevokeOrganizationInvitation\RevokeOrganizationInvitationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\ResendOrganizationInvitation\ResendOrganizationInvitationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\ChangeOrganizationPlan\ChangeOrganizationPlanHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Plan\CreatePlan\CreatePlanHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Plan\UpdatePlan\UpdatePlanHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Plan\DeletePlan\DeletePlanHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  # Query handlers
  Organization\Application\UseCase\Query\Organization\GetOrganization\GetOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListUserOrganizations\ListUserOrganizationsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationMembers\ListOrganizationMembersHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationRoles\ListOrganizationRolesHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationPermissions\ListOrganizationPermissionsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationInvitations\ListOrganizationInvitationsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationInvitationPreview\GetOrganizationInvitationPreviewHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationDashboard\GetOrganizationDashboardHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationAuditEvents\ListOrganizationAuditEventsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationDashboardTrend\GetOrganizationDashboardTrendHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetNavigationCounters\GetNavigationCountersHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetCurrentOrganizationMemberProfile\GetCurrentOrganizationMemberProfileHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationMember\GetOrganizationMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationRole\GetOrganizationRoleHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Plan\GetPlan\GetPlanHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Plan\ListPlans\ListPlansHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationQuota\GetOrganizationQuotaHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Team\GetTeam\GetTeamHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Team\ListTeams\ListTeamsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Team\ListTeamMembers\ListTeamMembersHandler:
    tags: ['messenger.message_handler']

  # Event subscribers (react to Symfony's core event dispatcher, the
  # mechanism EventDispatcherPort uses for every Organization domain event)
  Organization\Infrastructure\EventSubscriber\RemoveTeamMembershipsOnMemberRemovedHandler: ~

  # Repositories
  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRoleRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationMemberRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationInvitationRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\PlanRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\TeamRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Outbound ports
  Organization\Application\Port\Outbound\OrganizationRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRepository

  Organization\Application\Port\Outbound\OrganizationRoleRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRoleRepository

  Organization\Application\Port\Outbound\OrganizationMemberRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationMemberRepository

  Organization\Application\Port\Outbound\OrganizationInvitationRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationInvitationRepository

  Organization\Application\Port\Outbound\PlanRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\PlanRepository

  Organization\Application\Port\Outbound\TeamRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\TeamRepository

  # Quota advisory lock (runs on the main connection carrying the create transaction)
  Organization\Infrastructure\Persistence\Doctrine\Lock\PostgresOrganizationQuotaLockAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Application\Port\Outbound\OrganizationQuotaLockPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Lock\PostgresOrganizationQuotaLockAdapter

  # Inbound ports
  Organization\Application\Port\Inbound\OrganizationAuthorizationPort:
    alias: Organization\Application\Service\OrganizationAuthorizationService

  Organization\Application\Port\Inbound\OrganizationQuotaPort:
    alias: Organization\Application\Service\OrganizationQuotaService

  Organization\Application\Port\Inbound\OrganizationNotificationPolicyPort:
    alias: Organization\Application\Service\OrganizationNotificationPolicyService

  Organization\Application\Port\Inbound\OrganizationLastAdminGuardPort:
    alias: Organization\Application\Service\OrganizationLastAdminGuardService

  Organization\Application\Port\Inbound\OrganizationPermissionGrantGuardPort:
    alias: Organization\Application\Service\OrganizationPermissionGrantGuardService

  Organization\Application\Port\Inbound\TeamDirectoryPort:
    alias: Organization\Application\Service\TeamDirectoryService

  Organization\Application\Service\TeamDirectoryService: ~

  Organization\Application\Service\OrganizationInvitationTokenHasher: ~

  Organization\Application\Service\OrganizationInvitationNotifier:
    arguments:
      $frontendUrl: '%app.frontend_url%'

  Organization\Application\Service\OrganizationCacheInvalidator: ~

  Organization\Application\Service\OrganizationAuthorizationService: ~

  Organization\Application\Service\OrganizationQuotaService: ~

  Organization\Application\Service\OrganizationNotificationPolicyService: ~

  Organization\Application\Service\OrganizationLastAdminGuardService: ~

  Organization\Application\Service\OrganizationPermissionGrantGuardService: ~

  Organization\Application\Port\Outbound\FacilityStatisticsPort:
    alias: Facility\Infrastructure\Adapter\Organization\FacilityStatisticsAdapter

  Organization\Application\Port\Outbound\EquipmentStatisticsPort:
    alias: Equipment\Infrastructure\Adapter\Organization\EquipmentStatisticsAdapter

  Organization\Application\Port\Outbound\EquipmentTypeCatalogPort:
    alias: Equipment\Infrastructure\Adapter\Organization\EquipmentTypeCatalogAdapter

  Organization\Application\Port\Outbound\InspectionStatisticsPort:
    alias: Inspection\Infrastructure\Adapter\Organization\InspectionStatisticsAdapter

  Organization\Application\Port\Outbound\NonConformityStatisticsPort:
    alias: Inspection\Infrastructure\Adapter\Organization\NonConformityStatisticsAdapter

  Organization\Application\Port\Outbound\InterventionStatisticsPort:
    alias: Intervention\Infrastructure\Adapter\Organization\InterventionStatisticsAdapter

  # R17: Approval module's regulated action-type catalog, hosted in Approval
  Organization\Application\Port\Outbound\ApprovalActionTypeCatalogPort:
    alias: Approval\Infrastructure\Adapter\Organization\ApprovalActionTypeCatalogAdapter

  # Cross-module read model for the Maintenance module (compliance policy)
  Organization\Infrastructure\Adapter\Maintenance\OrganizationCompliancePolicyAdapter: ~

  # Cross-module read model for the Automation module (automation policy)
  Organization\Infrastructure\Adapter\Automation\OrganizationAutomationPolicyAdapter: ~

  # Cross-module read models for the Approval module (four-eyes approval policy + member directory)
  Organization\Infrastructure\Adapter\Approval\OrganizationApprovalPolicyAdapter: ~
  Organization\Infrastructure\Adapter\Approval\OrganizationApprovalMemberDirectoryAdapter: ~

  # Cross-module read model for the Compliance module (plan-tier export entitlement gate)
  Organization\Infrastructure\Adapter\Compliance\OrganizationExportEntitlementAdapter: ~

  # Cross-module read model for the Assistant module (L2.2: business-context
  # `includeBusinessContext` opt-in gate)
  Organization\Infrastructure\Adapter\Assistant\OrganizationAssistantSettingsAdapter: ~

  # Cross-module member directory for the Messaging module (mention validation,
  # actor member resolution)
  Organization\Infrastructure\Adapter\Messaging\OrganizationMessagingMemberDirectoryAdapter: ~

  # Cross-module member directory for the Calendar module (actor member
  # resolution for standalone event creation)
  Organization\Infrastructure\Adapter\Calendar\OrganizationCalendarMemberDirectoryAdapter: ~

  # Image services
  Organization\Infrastructure\Image\OrganizationLogoResizer: ~

  # Console Commands use #[AsCommand]
  Organization\Infrastructure\Console\CreateOrganizationConsoleCommand: ~
  Organization\Infrastructure\Console\AddOrganizationAdminConsoleCommand: ~


services:
  _defaults:
    autowire: true
    autoconfigure: true

  Organization\Presentation\:
    resource: '../../src/Organization/Presentation'

  organization.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Command handlers
  Organization\Application\UseCase\Command\Organization\CreateOrganization\CreateOrganizationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\DeleteOrganization\DeleteOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\DeleteOrganizationLegalProfile\DeleteOrganizationLegalProfileHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AddOrganizationMember\AddOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\CreateOrganizationRole\CreateOrganizationRoleHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\UpdateOrganizationRole\UpdateOrganizationRoleHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AssignOrganizationRoleToMember\AssignOrganizationRoleToMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RemoveOrganizationMember\RemoveOrganizationMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RemoveOrganizationRoleFromMember\RemoveOrganizationRoleFromMemberHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\DeleteOrganizationRole\DeleteOrganizationRoleHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\InviteOrganizationMember\InviteOrganizationMemberHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\AcceptOrganizationInvitation\AcceptOrganizationInvitationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\RevokeOrganizationInvitation\RevokeOrganizationInvitationHandler:
    arguments:
      $transactionManager: '@organization.main_transaction_manager'
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Command\Organization\UpsertOrganizationLegalProfile\UpsertOrganizationLegalProfileHandler:
    tags: ['messenger.message_handler']

  # Query handlers
  Organization\Application\UseCase\Query\Organization\GetOrganization\GetOrganizationHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListUserOrganizations\ListUserOrganizationsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationMembers\ListOrganizationMembersHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationRoles\ListOrganizationRolesHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationPermissions\ListOrganizationPermissionsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\ListOrganizationInvitations\ListOrganizationInvitationsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationLegalProfile\GetOrganizationLegalProfileHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationStatistics\GetOrganizationStatisticsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationFacilityStatistics\GetOrganizationFacilityStatisticsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationMembershipStatistics\GetOrganizationMembershipStatisticsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationEquipmentStatistics\GetOrganizationEquipmentStatisticsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationInspectionStatistics\GetOrganizationInspectionStatisticsHandler:
    tags: ['messenger.message_handler']

  Organization\Application\UseCase\Query\Organization\GetOrganizationNonConformityStatistics\GetOrganizationNonConformityStatisticsHandler:
    tags: ['messenger.message_handler']

  # Repositories
  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRoleRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationMemberRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationLegalProfileRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationInvitationRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Outbound ports
  Organization\Application\Port\Outbound\OrganizationRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRepository

  Organization\Application\Port\Outbound\OrganizationRoleRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationRoleRepository

  Organization\Application\Port\Outbound\OrganizationMemberRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationMemberRepository

  Organization\Application\Port\Outbound\OrganizationLegalProfileRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationLegalProfileRepository

  Organization\Application\Port\Outbound\OrganizationInvitationRepositoryPort:
    alias: Organization\Infrastructure\Persistence\Doctrine\Repository\OrganizationInvitationRepository

  # Inbound ports
  Organization\Application\Port\Inbound\OrganizationAuthorizationPort:
    alias: Organization\Application\Service\OrganizationAuthorizationService

  Organization\Application\Service\OrganizationAuthorizationService: ~

  Organization\Application\Port\Outbound\FacilityStatisticsPort:
    alias: Facility\Infrastructure\Adapter\Organization\FacilityStatisticsAdapter

  Organization\Application\Port\Outbound\EquipmentStatisticsPort:
    alias: Equipment\Infrastructure\Adapter\Organization\EquipmentStatisticsAdapter

  Organization\Application\Port\Outbound\InspectionStatisticsPort:
    alias: Inspection\Infrastructure\Adapter\Organization\InspectionStatisticsAdapter

  Organization\Application\Port\Outbound\NonConformityStatisticsPort:
    alias: Inspection\Infrastructure\Adapter\Organization\NonConformityStatisticsAdapter

  # Console Commands use #[AsCommand]
  Organization\Infrastructure\Console\CreateOrganizationConsoleCommand: ~
  Organization\Infrastructure\Console\AddOrganizationAdminConsoleCommand: ~

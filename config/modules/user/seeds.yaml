services:
  _defaults:
    autowire: true
    autoconfigure: false

  User\Infrastructure\DataFixtures\UserFixtures: ~

  app.seed.user:
    class: Shared\Infrastructure\DataFixtures\SeedFixtureAdapter
    arguments:
      $fixture: '@User\Infrastructure\DataFixtures\UserFixtures'
      $manager: '@doctrine.orm.auth_entity_manager'
      $seedKey: 'user'
      $prerequisites: ['authorization']
    tags:
      - { name: 'app.seed_fixture.auth' }


when@dev:
  services:
    User\Infrastructure\DataFixtures\FixtureUserPasswords:
      factory: ['User\Infrastructure\DataFixtures\FixtureUserPasswords', 'fromJson']
      arguments:
        $json: '%env(FIXTURE_USER_PASSWORDS_JSON)%'
        $minimumLength: 16

when@test:
  services:
    User\Infrastructure\DataFixtures\FixtureUserPasswords:
      factory: ['User\Infrastructure\DataFixtures\FixtureUserPasswords', 'fromJson']
      arguments:
        $json: '{"admin":"Admin123!","test":"Test123!","demo":"Demo123!","staff":"Staff123!","dev_client":"DevClient123!"}'

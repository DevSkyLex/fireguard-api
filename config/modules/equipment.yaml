services:
  _defaults:
    autowire: true
    autoconfigure: true

  Equipment\Presentation\:
    resource: '../../src/Equipment/Presentation'

  Equipment\Presentation\Api\Processor\Media\MediaProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Presentation\Api\Provider\Media\MediaProvider:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Presentation\Api\Provider\Equipment\CanonicalEquipmentProvider:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Presentation\Api\Processor\Equipment\CanonicalEquipmentMutationProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Presentation\Api\Processor\Equipment\CreateEquipmentProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Persistence\Doctrine\Repository\EquipmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Persistence\Doctrine\Repository\TagRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Persistence\Doctrine\Repository\AttachmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Persistence\Doctrine\Repository\MaintenanceLogRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Application\Port\Outbound\EquipmentRepositoryPort:
    alias: Equipment\Infrastructure\Persistence\Doctrine\Repository\EquipmentRepository

  equipment.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Adapter\Organization\EquipmentStatisticsAdapter: ~

  Equipment\Infrastructure\Adapter\Organization\EquipmentTypeCatalogAdapter: ~

  # Reports active equipment assigned to a facility (for the facility archival guard)
  Equipment\Infrastructure\Adapter\Facility\FacilityEquipmentDependencyAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Infrastructure\Adapter\Intervention\EquipmentInterventionResourceAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['intervention.change_applier', 'intervention.draft_publisher', 'intervention.resource_owner']

  Equipment\Infrastructure\Adapter\Messaging\EquipmentMessagingSubjectResolverAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['messaging.subject_resolver']

  # R17: re-executes the equipment decommission on approval
  Equipment\Infrastructure\Adapter\Approval\EquipmentDecommissionExecutorAdapter:
    tags: ['approval.deferred_action_executor']

  # Cross-module read model for the Maintenance sweep (trackable equipment directory)
  Equipment\Infrastructure\Adapter\Maintenance\EquipmentMaintenanceDirectoryAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module read model for the Compliance module (equipment inventory, by facility)
  Equipment\Infrastructure\Adapter\Compliance\EquipmentComplianceStatisticsAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Equipment\Application\Port\Outbound\TagRepositoryPort:
    alias: Equipment\Infrastructure\Persistence\Doctrine\Repository\TagRepository

  Equipment\Application\Port\Outbound\AttachmentRepositoryPort:
    alias: Equipment\Infrastructure\Persistence\Doctrine\Repository\AttachmentRepository

  Equipment\Application\Port\Outbound\MaintenanceLogRepositoryPort:
    alias: Equipment\Infrastructure\Persistence\Doctrine\Repository\MaintenanceLogRepository

  # Keeps maintenance logs + commissionedAt in step with flat-surface status writes
  Equipment\Application\Service\EquipmentMaintenanceLogSynchronizer: ~

  Equipment\Application\Port\Inbound\EquipmentMaintenanceLogSynchronizerPort:
    alias: Equipment\Application\Service\EquipmentMaintenanceLogSynchronizer

  # Inbound port reused by the Import module's bulk CSV import: provisions
  # equipment through CreateEquipmentHandler (quota included).
  Equipment\Application\Service\EquipmentProvisioningService: ~

  Equipment\Application\Port\Inbound\EquipmentProvisioningPort:
    alias: Equipment\Application\Service\EquipmentProvisioningService

  Equipment\Application\Port\Outbound\FacilityValidationPort:
    alias: Facility\Infrastructure\Adapter\Equipment\FacilityValidationAdapter

  Facility\Infrastructure\Adapter\Equipment\FacilityValidationAdapter: ~

  # Facility plan Phase 4, Equipment side: validates that an attachment is a
  # floor plan belonging to the equipment's own facility or one of its
  # ancestors. Composes Facility's own ports/guard, no Doctrine of its own.
  Equipment\Application\Port\Outbound\EquipmentFloorPlanValidationPort:
    alias: Facility\Infrastructure\Adapter\Equipment\EquipmentFloorPlanValidationAdapter

  Facility\Infrastructure\Adapter\Equipment\EquipmentFloorPlanValidationAdapter: ~

  # Equipment-side implementation of the Facility plan-overlay's equipment
  # read (Facility\Application\Port\Outbound\FacilityEquipmentPlanPositionPort,
  # aliased in config/modules/facility.yaml).
  Equipment\Infrastructure\Adapter\Facility\EquipmentPlanPositionAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Read-side label lookup, deliberately separate from the validation port
  # above: resolving a name must not go through a contract that throws.
  Equipment\Application\Port\Outbound\FacilityNamingPort:
    alias: Facility\Infrastructure\Adapter\Equipment\FacilityNamingAdapter

  # The default entity manager is not the one facilities live in; every other
  # Facility adapter is wired to `main` the same way, and autowiring silently
  # hands over an entity manager where FacilityRecord is not mapped.
  Facility\Infrastructure\Adapter\Equipment\FacilityNamingAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Reads back a published intervention's applied equipment changes so the
  # service-history subscriber below can synthesize maintenance log entries.
  Equipment\Application\Port\Outbound\InterventionServiceReportPort:
    alias: Intervention\Infrastructure\Adapter\Equipment\InterventionServiceReportAdapter

  # Best-effort reaction to InterventionPublishedEvent: appends one completed
  # maintenance-log entry per serviced equipment. Must never fail the
  # publication (see class docblock).
  Equipment\Infrastructure\EventSubscriber\InterventionServiceHistorySubscriber: ~

  Equipment\Application\UseCase\Command\Equipment\CreateEquipment\CreateEquipmentHandler:
    arguments:
      $transactionManager: '@equipment.main_transaction_manager'
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\UpdateEquipment\UpdateEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\AssignToFacility\AssignToFacilityHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\UnassignFromFacility\UnassignFromFacilityHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\SetEquipmentPlanPosition\SetEquipmentPlanPositionHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\CommissionEquipment\CommissionEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\PutUnderMaintenance\PutUnderMaintenanceHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\DecommissionEquipment\DecommissionEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\AddTagToEquipment\AddTagToEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\RemoveTagFromEquipment\RemoveTagFromEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\AddAttachment\AddAttachmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Command\Equipment\DeleteAttachment\DeleteAttachmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\GetEquipment\GetEquipmentHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\ListEquipments\ListEquipmentsHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\GetEquipmentKpis\GetEquipmentKpisHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\ListEquipmentAttachments\ListEquipmentAttachmentsHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\ListEquipmentTypes\ListEquipmentTypesHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Equipment\ListMaintenanceLogs\ListMaintenanceLogsHandler:
    tags: ['messenger.message_handler']

  # NO async routing (config/packages/messenger.yaml): runs sync, inline in
  # the publication worker, right after InterventionPublishedEvent fires.
  Equipment\Application\UseCase\Command\Equipment\RecordInterventionServiceHistory\RecordInterventionServiceHistoryHandler:
    tags: ['messenger.message_handler']

  Equipment\Application\UseCase\Query\Tag\ListTags\ListTagsHandler:
    tags: ['messenger.message_handler']


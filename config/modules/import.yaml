imports:
  - { resource: 'import/doctrine.yaml' }
  - { resource: 'import/api_platform.yaml' }
  - { resource: 'import/framework.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Import\Presentation\:
    resource: '../../src/Import/Presentation'

  Import\Application\Service\:
    resource: '../../src/Import/Application/Service'

  Import\Infrastructure\:
    resource: '../../src/Import/Infrastructure'
    exclude: '../../src/Import/Infrastructure/Persistence/Doctrine/Record/'

  Import\Application\Port\Outbound\Internal\ImportExecutionPort:
    alias: Import\Infrastructure\Persistence\Doctrine\Execution\PostgresImportExecutionAdapter

  Import\Infrastructure\Persistence\Doctrine\Execution\PostgresImportExecutionAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Outbound ports
  Import\Application\Port\Outbound\Internal\ImportJobRepositoryPort:
    alias: Import\Infrastructure\Persistence\Doctrine\Repository\ImportJobRepository

  Import\Application\Port\Outbound\ImportJobQueuePort:
    alias: Import\Infrastructure\Adapter\Messenger\MessengerImportJobQueueAdapter

  Import\Application\Port\Outbound\CsvRowStreamerPort:
    alias: Import\Infrastructure\Csv\CsvRowStreamer

  # Repository
  Import\Infrastructure\Persistence\Doctrine\Repository\ImportJobRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Fire-and-forget async dispatch (mirrors Intervention's MessengerPublicationQueueAdapter)
  Import\Infrastructure\Adapter\Messenger\MessengerImportJobQueueAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'

  # Command handlers
  Import\Application\UseCase\Command\CreateImportJob\CreateImportJobHandler:
    arguments:
      $idempotency: '@Shared\Application\Port\Outbound\Idempotency\HttpIdempotencyExecutionPort'
      $transactionManager: '@Shared\Infrastructure\Messaging\Outbox\RootTransactionManagerAdapter'
    tags: ['messenger.message_handler']

  Import\Application\UseCase\Command\ProcessImportJob\ProcessImportJobHandler:
    arguments:
      $eventDispatcher: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'
    tags: ['messenger.message_handler']

  # Query handlers
  Import\Application\UseCase\Command\ResumeImportJob\ResumeImportJobHandler:
    tags: ['messenger.message_handler']

  Import\Application\UseCase\Query\GetImportJob\GetImportJobHandler:
    tags: ['messenger.message_handler']

  Import\Application\UseCase\Query\ListImportJobs\ListImportJobsHandler:
    tags: ['messenger.message_handler']

  Import\Application\Port\Outbound\ImportConfirmationLockPort:
    alias: Import\Infrastructure\Persistence\Doctrine\Lock\PostgresImportConfirmationLockAdapter

  Import\Infrastructure\Persistence\Doctrine\Lock\PostgresImportConfirmationLockAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Import\Application\UseCase\Command\ConfirmImportSimulation\ConfirmImportSimulationHandler:
    tags: ['messenger.message_handler']

  Import\Application\UseCase\Query\GetImportTemplate\GetImportTemplateHandler:
    tags: ['messenger.message_handler']

  Import\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  Import\Application\Port\Outbound\Internal\ImportKindRegistryPort: '@Import\Application\Service\ImportKindProcessorRegistry'
  Import\Application\Service\ImportKindProcessorRegistry:
    arguments:
      $processors: !tagged_iterator fireguard.import_kind_processor

  Import\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  Import\Infrastructure\Adapter\Idempotency\ImportHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Import\Infrastructure\Adapter\Idempotency\ImportHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
    tags: [http.idempotency_replay_authorization]

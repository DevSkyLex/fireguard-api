services:
  _defaults:
    autowire: true
    autoconfigure: true

  # User Module
  User\Application\Port\Outbound\UserRepositoryPort:
    class: User\Infrastructure\Persistence\Doctrine\Repository\UserRepository

  User\Application\Port\Outbound\UserDataPurgePort:
    class: User\Infrastructure\Adapter\User\UserDataPurgeAdapter

  User\Application\UseCase\Command\User\CreateUser\CreateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\ActivateUser\ActivateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\DeactivateUser\DeactivateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\VerifyUserEmail\VerifyUserEmailHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\DeleteUser\DeleteUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\UpdateUser\UpdateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Query\User\AuthenticateUser\AuthenticateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Query\User\GetUser\GetUserHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\GetUser\GetUserQuery }

  User\Application\UseCase\Query\User\ListUsers\ListUsersHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\ListUsers\ListUsersQuery }

  User\Application\UseCase\Query\User\GetCurrentUserProfile\GetCurrentUserProfileHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\GetCurrentUserProfile\GetCurrentUserProfileQuery }

  User\Application\EventHandler\UserCreatedEventHandler:
    tags: ['messenger.message_handler']

  User\Application\EventHandler\UserEmailVerifiedEventHandler:
    tags: ['messenger.message_handler']

  User\Infrastructure\Persistence\Doctrine\Mapper\UserMapper: ~

  User\Presentation\Api\Processor\User\CreateUserProcessor: ~
  User\Presentation\Api\Processor\User\ActivateUserProcessor: ~
  User\Presentation\Api\Processor\User\DeactivateUserProcessor: ~
  User\Presentation\Api\Processor\User\DeleteUserProcessor: ~
  User\Presentation\Api\Processor\User\UpdateCurrentUserProfileProcessor: ~
  User\Presentation\Api\Processor\User\UpdateUserProcessor: ~
  User\Presentation\Api\Processor\User\UploadCurrentUserAvatarProcessor: ~
  User\Presentation\Api\Processor\User\UploadUserAvatarProcessor: ~
  User\Presentation\Api\Processor\User\VerifyUserEmailProcessor: ~
  User\Presentation\Api\Provider\User\UserProvider: ~
  User\Presentation\Api\Provider\User\ListUsersProvider: ~
  User\Presentation\Api\Provider\User\GetCurrentUserProfileProvider: ~
  User\Presentation\Api\Provider\User\GetUserAvatarProvider: ~
  User\Infrastructure\Image\AvatarResizer: ~

  # Console Commands use #[AsCommand]
  User\Infrastructure\Console\CreateUserConsoleCommand: ~
  User\Infrastructure\Console\DeleteUserConsoleCommand: ~
  User\Infrastructure\Console\ListUsersCommand: ~


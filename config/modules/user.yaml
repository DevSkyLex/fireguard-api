imports:
  - { resource: 'user/doctrine.yaml' }
  - { resource: 'user/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # User Module
  User\Application\Port\Inbound\UserDirectoryPort:
    alias: User\Application\Service\UserDirectoryService
  User\Application\Service\UserDirectoryService: ~
  User\Application\Port\Inbound\UserCredentialsPort:
    alias: User\Application\Service\UserCredentialsService
  User\Application\Service\UserCredentialsService: ~
  User\Application\Port\Inbound\UserRegistrationPort:
    alias: User\Application\Service\UserRegistrationService
  User\Application\Service\UserRegistrationService: ~
  User\Application\Port\Inbound\UserAuthenticationPort:
    alias: User\Application\Service\UserAuthenticationService
  User\Application\Service\UserAuthenticationService: ~
  User\Application\Port\Inbound\AccountStatusPort:
    alias: User\Infrastructure\Adapter\User\AccountStatusAdapter
  User\Infrastructure\Adapter\User\AccountStatusAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Port\Outbound\Internal\UserRepositoryPort:
    class: User\Infrastructure\Persistence\Doctrine\Repository\UserRepository
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Port\Outbound\AvatarPersistencePort:
    class: User\Infrastructure\Adapter\User\AvatarPersistenceAdapter
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Port\Outbound\UserDataPurgePort:
    class: User\Infrastructure\Adapter\User\UserDataPurgeAdapter
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
      $avatarCleanup: '@shared.auth_file_cleanup'
      $rootTransaction: '@shared.auth_root_transaction'

  User\Application\Port\Inbound\FederatedUserPort:
    alias: User\Application\Service\FederatedUserService

  User\Application\Service\FederatedUserService: ~

  # Email change requests live on the auth database; the entity manager is
  # named explicitly so autowiring can never pick the wrong one.
  User\Application\Port\Outbound\Internal\EmailChangeRequestRepositoryPort:
    class: User\Infrastructure\Persistence\Doctrine\Repository\UserEmailChangeRequestRepository
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Service\EmailChangeTokenHasher: ~

  User\Application\Service\EmailChangeNotifier:
    arguments:
      $frontendUrl: '%app.frontend_url%'

  # Resolves notification recipient emails from user ids (Notification module port)
  User\Infrastructure\Adapter\Notification\UserRecipientDirectoryAdapter: ~

  User\Application\UseCase\Command\User\CreateUser\CreateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\ActivateUser\ActivateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\DeactivateUser\DeactivateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\VerifyUserEmail\VerifyUserEmailHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\DeleteUser\DeleteUserHandler:
    arguments:
      $events: '@shared.auth_event_dispatcher'
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\User\UpdateUser\UpdateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\EmailChange\RequestEmailChange\RequestEmailChangeHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\EmailChange\ConfirmEmailChange\ConfirmEmailChangeHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Command\EmailChange\CancelEmailChange\CancelEmailChangeHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Query\User\AuthenticateUser\AuthenticateUserHandler:
    tags: ['messenger.message_handler']

  User\Application\UseCase\Query\User\GetUser\GetUserHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\GetUser\GetUserQuery }

  User\Application\UseCase\Query\User\ListUsers\ListUsersHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\ListUsers\ListUsersQuery }

  User\Application\UseCase\Query\User\GetCurrentUserProfile\GetCurrentUserProfileHandler:
    tags:
      - { name: messenger.message_handler, handles: User\Application\UseCase\Query\User\GetCurrentUserProfile\GetCurrentUserProfileQuery }

  User\Application\EventHandler\UserCreatedEventHandler:
    tags: ['messenger.message_handler']

  User\Application\EventHandler\UserEmailVerifiedEventHandler:
    tags: ['messenger.message_handler']

  User\Infrastructure\Persistence\Doctrine\Mapper\UserMapper: ~

  User\Presentation\Api\Processor\User\CreateUserProcessor: ~
  User\Presentation\Api\Processor\User\ActivateUserProcessor: ~
  User\Presentation\Api\Processor\User\DeactivateUserProcessor: ~
  User\Presentation\Api\Processor\User\DeactivateCurrentUserProfileProcessor: ~
  User\Presentation\Api\Processor\User\DeleteUserProcessor: ~
  User\Presentation\Api\Processor\User\UpdateCurrentUserProfileProcessor: ~
  User\Presentation\Api\Processor\User\UpdateUserProcessor: ~
  User\Presentation\Api\Processor\User\UploadCurrentUserAvatarProcessor: ~
  User\Presentation\Api\Processor\User\UploadUserAvatarProcessor: ~
  User\Presentation\Api\Processor\User\VerifyUserEmailProcessor: ~
  User\Presentation\Api\Processor\EmailChange\RequestEmailChangeProcessor: ~
  User\Presentation\Api\Processor\EmailChange\ConfirmEmailChangeProcessor: ~
  User\Presentation\Api\Processor\EmailChange\CancelEmailChangeProcessor: ~
  User\Presentation\Api\Provider\User\UserProvider: ~
  User\Presentation\Api\Provider\User\ListUsersProvider: ~
  User\Presentation\Api\Provider\User\GetCurrentUserProfileProvider: ~
  User\Presentation\Api\Provider\User\GetUserAvatarProvider: ~
  User\Infrastructure\Image\AvatarResizer: ~

  # Console Commands use #[AsCommand]
  User\Infrastructure\Console\CreateUserConsoleCommand: ~
  User\Infrastructure\Console\DeleteUserConsoleCommand: ~
  User\Infrastructure\Console\ListUsersCommand: ~

  User\Application\Port\Inbound\EmailOwnershipPort:
    alias: User\Application\Service\EmailOwnershipService
  User\Application\Service\EmailOwnershipService: ~
  User\Application\Port\Outbound\EmailOwnershipRepositoryPort:
    class: User\Infrastructure\Persistence\Doctrine\Repository\EmailOwnershipRepository
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  # Global presence preference is stored only in auth; the two public ports share one repository.
  User\Infrastructure\Persistence\Doctrine\Repository\UserPresencePreferenceRepository:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
  User\Application\Port\Outbound\PresencePreferenceRepositoryPort:
    alias: User\Infrastructure\Persistence\Doctrine\Repository\UserPresencePreferenceRepository
  User\Application\Port\Inbound\PresencePreferenceReaderPort:
    alias: User\Infrastructure\Persistence\Doctrine\Repository\UserPresencePreferenceRepository
  User\Application\Port\Outbound\PresencePreferenceRealtimePort:
    alias: User\Infrastructure\Adapter\Realtime\MercurePresencePreferenceAdapter
  User\Infrastructure\Adapter\Realtime\MercurePresencePreferenceAdapter: ~
  User\Infrastructure\EventSubscriber\PresencePreferenceRealtimeSubscriber: ~
  User\Application\UseCase\Query\Presence\GetPresencePreference\GetPresencePreferenceHandler:
    tags: ['messenger.message_handler']
  User\Application\UseCase\Query\Presence\GetPresencePreferenceSubscription\GetPresencePreferenceSubscriptionHandler:
    tags: ['messenger.message_handler']
  User\Application\UseCase\Command\Presence\UpdatePresencePreference\UpdatePresencePreferenceHandler:
    tags: ['messenger.message_handler']
  User\Presentation\Api\Provider\Presence\GetPresencePreferenceProvider: ~
  User\Presentation\Api\Provider\Presence\GetPresencePreferenceSubscriptionProvider: ~
  User\Presentation\Api\Processor\Presence\UpdatePresencePreferenceProcessor: ~

  User\Application\UseCase\Query\Avatar\GetUserAvatar\GetUserAvatarHandler:
    tags: ['messenger.message_handler']

  User\Application\Port\Outbound\AvatarStoragePort:
    alias: User\Infrastructure\Image\AvatarResizer
  User\Application\UseCase\Command\Avatar\UploadUserAvatar\UploadUserAvatarHandler:
    arguments:
      $transactions: '@shared.auth_root_transaction'
      $cleanup: '@shared.auth_file_cleanup'
    tags: ['messenger.message_handler']

  User\Infrastructure\Adapter\Event\IntegrationEventConverterAdapter: ~

  User\Infrastructure\Adapter\Authorization\UserPermissionContributionAdapter:
    tags: [authorization.permission_catalog_contribution]

  User\Infrastructure\Adapter\Audit\AuditRecordEventAdapter: ~

  User\Application\Port\Outbound\PasswordPolicyPort: '@User\Infrastructure\Adapter\Policy\ConfiguredPasswordPolicyAdapter'
  User\Infrastructure\Adapter\Policy\ConfiguredPasswordPolicyAdapter:
    arguments:
      $minimumLength: '%password_policy.minimum_length%'
      $maximumLength: '%password_policy.maximum_length%'
      $requireUppercase: '%password_policy.require_uppercase%'
      $requireLowercase: '%password_policy.require_lowercase%'
      $requireDigit: '%password_policy.require_digit%'
      $specialCharacters: '%password_policy.special_characters%'

  User\Application\Port\Inbound\UserSecurityRevisionPort: '@User\Infrastructure\Adapter\Idempotency\UserSecurityProofAdapter'
  User\Application\Port\Inbound\UserCredentialProofPort: '@User\Infrastructure\Adapter\Idempotency\UserSecurityProofAdapter'
  User\Infrastructure\Adapter\Idempotency\UserSecurityProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Port\Inbound\SignInEligibilityPort: '@User\Infrastructure\Adapter\User\SignInEligibilityAdapter'
  User\Infrastructure\Adapter\User\SignInEligibilityAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyReplayAuthorizationAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
    tags: [http.idempotency_replay_authorization]

  User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyResponseProjectionAdapter:
    tags: [shared.http_idempotency_response_projection]

  User\Infrastructure\Adapter\Idempotency\EmailChangeIdempotencyProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'
    tags: [shared.sensitive_idempotency_proof]

  User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyResultProofAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'
    tags: [shared.http_idempotency_result_proof]

  User\Infrastructure\EventSubscriber\Idempotency\UserReceiptPurgeSubscriber:
    arguments:
      $auth: '@shared.http_idempotency.auth'
      $main: '@Shared\Application\Service\Idempotency\DurableHttpIdempotencyService'

  Shared\Application\Port\Outbound\Idempotency\HttpIdempotencyAccountPort: '@User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyAccountAdapter'
  User\Infrastructure\Adapter\Idempotency\UserHttpIdempotencyAccountAdapter:
    arguments:
      $authenticationPolicy: '@Auth\Application\Port\Outbound\AuthenticationPolicyPort'
      $connection: '@doctrine.dbal.auth_connection'

  User\Application\Port\Inbound\CredentialLifecycleProofPort: '@User\Infrastructure\Adapter\Idempotency\CredentialLifecycleProofAdapter'
  User\Infrastructure\Adapter\Idempotency\CredentialLifecycleProofAdapter:
    arguments:
      $entityManager: '@doctrine.orm.auth_entity_manager'

  User\Application\Port\Inbound\FreshEmailOwnershipPort: '@User\Infrastructure\Adapter\Idempotency\FreshEmailOwnershipAdapter'
  User\Infrastructure\Adapter\Idempotency\FreshEmailOwnershipAdapter:
    arguments:
      $connection: '@doctrine.dbal.auth_connection'

when@dev:
  imports:
    - { resource: 'user/seeds.yaml' }

when@test:
  imports:
    - { resource: 'user/seeds.yaml' }

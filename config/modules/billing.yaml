imports:
  - { resource: 'billing/stripe.yaml' }
  - { resource: 'billing/billing.yaml' }
  - { resource: 'billing/doctrine.yaml' }
  - { resource: 'billing/api_platform.yaml' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Billing\Presentation\:
    resource: '../../src/Billing/Presentation'

  # Transaction manager (main schema)
  billing.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
      $database: main
      $idempotency: '@Shared\Infrastructure\Idempotency\HttpIdempotencyExecutionContext'
  # Persistence
  Billing\Infrastructure\Persistence\Doctrine\Repository\SubscriptionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Billing\Application\Port\Outbound\Internal\SubscriptionRepositoryPort:
    alias: Billing\Infrastructure\Persistence\Doctrine\Repository\SubscriptionRepository

  Billing\Infrastructure\Persistence\Doctrine\Lock\PostgresBillingReconciliationAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Billing\Application\Port\Outbound\BillingReconciliationPort:
    alias: Billing\Infrastructure\Persistence\Doctrine\Lock\PostgresBillingReconciliationAdapter

  # Stripe gateway
  Billing\Infrastructure\Adapter\Stripe\StripeGatewayAdapter:
    arguments:
      $secretKey: '%billing.stripe_secret_key%'
      $webhookSecret: '%billing.stripe_webhook_secret%'

  Billing\Application\Port\Outbound\Internal\StripeGatewayPort:
    alias: Billing\Infrastructure\Adapter\Stripe\StripeGatewayAdapter

  # Price catalog
  Billing\Application\Service\BillingPriceCatalog:
    arguments:
      $prices: '%billing.prices%'
      $currency: '%billing.currency%'

  # Cross-module seams (implemented by the Organization module, bound to Billing ports)
  Organization\Infrastructure\Adapter\Billing\OrganizationPlanAssignmentAdapter: ~

  Billing\Application\Port\Outbound\OrganizationPlanAssignmentPort:
    alias: Organization\Infrastructure\Adapter\Billing\OrganizationPlanAssignmentAdapter

  Organization\Infrastructure\Adapter\Billing\OrganizationAccessAdapter: ~

  Billing\Application\Port\Outbound\OrganizationAccessPort:
    alias: Organization\Infrastructure\Adapter\Billing\OrganizationAccessAdapter

  Organization\Infrastructure\Adapter\Billing\OrganizationPlanAdapter: ~

  Billing\Application\Port\Outbound\OrganizationPlanPort:
    alias: Organization\Infrastructure\Adapter\Billing\OrganizationPlanAdapter

  # Command handlers
  Billing\Application\UseCase\Command\StartCheckout\StartCheckoutHandler:
    arguments:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Command\StartPortal\StartPortalHandler:
    arguments:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Command\HandleStripeWebhook\HandleStripeWebhookHandler:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Command\CancelSubscription\CancelSubscriptionHandler:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Command\ResumeSubscription\ResumeSubscriptionHandler:
    tags: ['messenger.message_handler']

  # Query handlers
  Billing\Application\UseCase\Query\GetPricing\GetPricingHandler:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Query\GetOrganizationSubscription\GetOrganizationSubscriptionHandler:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Query\GetOrganizationInvoices\GetOrganizationInvoicesHandler:
    tags: ['messenger.message_handler']

  Billing\Application\UseCase\Query\GetOrganizationPaymentMethod\GetOrganizationPaymentMethodHandler:
    tags: ['messenger.message_handler']

  Billing\Application\Port\Outbound\BillingReturnUrlPort: '@Billing\Infrastructure\Adapter\Product\BillingReturnUrlAdapter'
  Billing\Infrastructure\Adapter\Product\BillingReturnUrlAdapter:
    arguments:
      $settingsPath: '%product.billing_settings_path%'

  Billing\Infrastructure\Adapter\Idempotency\ExternalBillingReconciliationAdapter:
    arguments:
      $connection: '@doctrine.dbal.main_connection'
      $receipts: '@Shared\Infrastructure\Messaging\Outbox\DoctrineIdempotentConsumerAdapter'
      $events: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'
  Billing\Infrastructure\EventSubscriber\ExternalBillingReconciliationSubscriber:
    arguments:
      $receipts: '@Shared\Infrastructure\Messaging\Outbox\DoctrineIdempotentConsumerAdapter'
      $reconciliation: '@Billing\Application\UseCase\Command\HandleStripeWebhook\HandleStripeWebhookHandler'

  Billing\Infrastructure\Adapter\Idempotency\BillingHttpIdempotencyOperationContributionAdapter:
    tags: [http.idempotency_operation]

  Billing\Infrastructure\Adapter\Idempotency\BillingHttpIdempotencyReplayAuthorizationAdapter:
    tags: [http.idempotency_replay_authorization]

  Billing\Infrastructure\Adapter\Idempotency\BillingHttpIdempotencyResponseProjectionAdapter:
    tags: [shared.http_idempotency_response_projection]

# The hermetic test suite never sets STRIPE_SECRET_KEY (see .env.test), and
# the real StripeClient rejects an empty key at construction time — so any
# Billing handler autowiring StripeGatewayPort would 500 before its own logic
# ever runs. Swap in the in-memory adapter for `test` only; every other
# environment keeps the real Stripe integration.
when@test:
  services:
    Billing\Infrastructure\Adapter\Stripe\FakeStripeGatewayAdapter: ~

    Billing\Application\Port\Outbound\Internal\StripeGatewayPort:
      alias: Billing\Infrastructure\Adapter\Stripe\FakeStripeGatewayAdapter

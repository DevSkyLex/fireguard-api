services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Use Cases - Auto-register
  TrustedDevice\Application\UseCase\:
    resource: '../../src/TrustedDevice/Application/UseCase/'

  # TrustedDevice Module - Ports
  TrustedDevice\Application\Port\Outbound\TrustedDeviceRepositoryPort:
    alias: TrustedDevice\Infrastructure\Persistence\Doctrine\Repository\TrustedDeviceRepository

  # Infrastructure
  TrustedDevice\Infrastructure\Persistence\Doctrine\Repository\TrustedDeviceRepository:
    arguments:
      $entityManager: '@doctrine.orm.entity_manager'

  TrustedDevice\Infrastructure\Persistence\Doctrine\Mapper\TrustedDeviceMapper: ~

  # Event Subscribers
  TrustedDevice\Presentation\Api\EventSubscriber\TrustedDeviceCookieListener: ~

  # Presentation Services
  TrustedDevice\Presentation\Api\Service\TrustedDeviceCookieService: ~

  # Command Handlers
  TrustedDevice\Application\UseCase\Command\TrustedDevice\TrustDevice\TrustDeviceHandler:
    tags: ['messenger.message_handler']
  TrustedDevice\Application\UseCase\Command\TrustedDevice\RevokeDevice\RevokeDeviceHandler:
    tags: ['messenger.message_handler']
  TrustedDevice\Application\UseCase\Command\TrustedDevice\RevokeAllDevices\RevokeAllDevicesHandler:
    tags: ['messenger.message_handler']

  # Query Handlers
  TrustedDevice\Application\UseCase\Query\TrustedDevice\CheckDeviceTrusted\CheckDeviceTrustedHandler:
    tags: ['messenger.message_handler']
  TrustedDevice\Application\UseCase\Query\TrustedDevice\ListTrustedDevices\ListTrustedDevicesHandler:
    tags: ['messenger.message_handler']

  # API Processors
  TrustedDevice\Presentation\Api\Processor\TrustedDevice\TrustDeviceProcessor: ~
  TrustedDevice\Presentation\Api\Processor\TrustedDevice\RevokeDeviceProcessor: ~
  TrustedDevice\Presentation\Api\Processor\TrustedDevice\RevokeAllDevicesProcessor: ~

  # API Providers
  TrustedDevice\Presentation\Api\Provider\TrustedDevice\ListTrustedDevicesProvider: ~

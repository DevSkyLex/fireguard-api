services:
  _defaults:
    autowire: true
    autoconfigure: true

  Inspection\Presentation\:
    resource: '../../src/Inspection/Presentation'

  Inspection\Application\Service\:
    resource: '../../src/Inspection/Application/Service'

  Inspection\Infrastructure\Scheduler\:
    resource: '../../src/Inspection/Infrastructure/Scheduler'

  # CanonicalInspectionProvider names no entity manager: both of its reads
  # went to Application\UseCase\Query\Inspection\.
  # CanonicalInspectionMutationProcessor names no entity manager on purpose:
  # it holds none since the mutations moved to
  # Application\UseCase\{Command,Query}\Inspection\*CanonicalInspection*.
  Inspection\Presentation\Api\Processor\Inspection\CreateInspectionProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # InspectionResponseProcessor names no entity manager on purpose: it holds
  # none since the mutations moved to Application\UseCase\Command\Response.
  # InspectionResponseProvider names no entity manager either: both of its
  # reads went to Application\UseCase\Query\Response\.

  # Repositories
  Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Persistence\Doctrine\Repository\NonConformityRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Persistence\Doctrine\Repository\ChecklistRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionAttachmentRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionResponseRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Persistence\Doctrine\Repository\CanonicalInspectionRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # R11b: generalized inspection + non-conformity attachments (multipart)
  Inspection\Presentation\Api\Processor\Attachment\InspectionMediaProcessor:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Presentation\Api\Provider\Attachment\InspectionMediaProvider:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  inspection.main_transaction_manager:
    class: Shared\Infrastructure\Symfony\Adapter\Outbound\DoctrineTransactionManagerAdapter
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Port aliases
  Inspection\Application\Port\Outbound\InspectionRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionRepository

  Inspection\Application\Port\Outbound\NonConformityStatisticsGatewayPort:
    alias: Inspection\Infrastructure\Adapter\Statistics\DoctrineNonConformityStatisticsGatewayAdapter

  Inspection\Infrastructure\Adapter\Statistics\DoctrineNonConformityStatisticsGatewayAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Adapter\Organization\InspectionStatisticsAdapter: ~

  # Reports in-progress inspections targeting a facility (for the facility archival guard)
  Inspection\Infrastructure\Adapter\Facility\FacilityInspectionDependencyAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Adapter\Intervention\InspectionInterventionResourceAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['intervention.change_applier', 'intervention.draft_publisher', 'intervention.resource_owner']

  Inspection\Infrastructure\Adapter\Messaging\InspectionMessagingSubjectResolverAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags: ['messaging.subject_resolver']

  # R17: re-executes the non-conformity waiver on approval
  Inspection\Infrastructure\Adapter\Approval\NonConformityWaiverExecutorAdapter:
    tags: ['approval.deferred_action_executor']

  Inspection\Infrastructure\Adapter\Organization\NonConformityStatisticsAdapter: ~

  Inspection\Infrastructure\Adapter\Organization\InspectionSearchAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Adapter\Organization\NonConformitySearchAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module read model for the Calendar module (unified feed source)
  Inspection\Infrastructure\Adapter\Calendar\InspectionCalendarFeedAdapter: ~

  # Cross-module outbound port for the Equipment module (adapter hosted here,
  # in the module owning the read model): org-wide open non-conformity count
  # for the equipment KPI band (L2.11) — see the port's docblock for why this
  # cannot be narrowed to a per-equipment count.
  Equipment\Application\Port\Outbound\NonConformityStatisticsPort:
    alias: Inspection\Infrastructure\Adapter\Equipment\EquipmentNonConformityStatisticsAdapter

  Inspection\Infrastructure\Adapter\Equipment\EquipmentNonConformityStatisticsAdapter: ~

  # Cross-module read model for the Compliance module (open non-conformities by severity, by facility)
  Inspection\Infrastructure\Adapter\Compliance\InspectionComplianceStatisticsAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # L2.2: Assistant business-context seam — this module's own adapter,
  # tagged `assistant.context_provider` (priority 20: rendered after
  # Compliance's org-wide summary, ahead of Maintenance's due dates).
  # Assistant's own config/modules/assistant.yaml is never touched to add
  # this source.
  Inspection\Infrastructure\Adapter\Assistant\InspectionAssistantContextProviderAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'
    tags:
      - { name: 'assistant.context_provider', priority: 20 }

  Inspection\Application\Port\Outbound\NonConformityRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\NonConformityRepository

  Inspection\Application\Port\Outbound\InspectionAttachmentRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionAttachmentRepository

  Inspection\Application\Port\Outbound\InspectionResponseRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\InspectionResponseRepository

  # The offline-sync half of `inspections`: the three columns
  # InspectionRepositoryPort deliberately does not carry. Separate port because
  # `save(Inspection)` leaves record_status/intervention_id/revision untouched
  # and therefore cannot bump the canonical If-Match revision.
  Inspection\Application\Port\Outbound\CanonicalInspectionRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\CanonicalInspectionRepository

  # Cross-module: the owning module implements the port, this module declares
  # it. Same direction as FacilityValidationPort / EquipmentValidationPort
  # above, and what removed the InterventionRecord read from
  # InspectionResponseProcessor.
  Inspection\Application\Port\Outbound\InterventionScopePort:
    alias: Intervention\Infrastructure\Adapter\Inspection\InterventionScopeAdapter

  Intervention\Infrastructure\Adapter\Inspection\InterventionScopeAdapter: ~

  Inspection\Application\Port\Outbound\ChecklistRepositoryPort:
    alias: Inspection\Infrastructure\Persistence\Doctrine\Repository\ChecklistRepository

  Inspection\Application\Port\Outbound\EquipmentValidationPort:
    alias: Equipment\Infrastructure\Adapter\Inspection\EquipmentValidationAdapter

  Inspection\Application\Port\Outbound\FacilityValidationPort:
    alias: Facility\Infrastructure\Adapter\Inspection\FacilityValidationAdapter

  Inspection\Application\Port\Outbound\ChecklistValidationPort:
    alias: Inspection\Infrastructure\Adapter\Checklist\ChecklistValidationAdapter

  # Cross-module: notifies the Maintenance module when an inspection closes
  Inspection\Application\Port\Outbound\InspectionMaintenanceSynchronizerPort:
    alias: Maintenance\Infrastructure\Adapter\Inspection\MaintenanceScheduleSynchronizerAdapter

  Equipment\Infrastructure\Adapter\Inspection\EquipmentValidationAdapter: ~

  Facility\Infrastructure\Adapter\Inspection\FacilityValidationAdapter: ~

  # Read-side label lookups, deliberately separate from the validation ports
  # above: resolving a name must not go through a contract that throws.
  #
  # Both are wired to `main` explicitly. Autowiring hands over the default
  # entity manager, which maps neither record — a perfectly typed adapter whose
  # every query fails at runtime.
  Inspection\Application\Port\Outbound\EquipmentNamingPort:
    alias: Equipment\Infrastructure\Adapter\Inspection\EquipmentNamingAdapter

  Equipment\Infrastructure\Adapter\Inspection\EquipmentNamingAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Application\Port\Outbound\FacilityNamingPort:
    alias: Facility\Infrastructure\Adapter\Inspection\FacilityNamingAdapter

  Facility\Infrastructure\Adapter\Inspection\FacilityNamingAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  Inspection\Infrastructure\Adapter\Checklist\ChecklistValidationAdapter: ~

  # PDF report renderers (no Doctrine — plain Twig contexts)
  Inspection\Infrastructure\Pdf\DompdfInspectionReportRenderer: ~

  Inspection\Infrastructure\Pdf\DompdfNonConformityReportRenderer: ~

  Inspection\Application\Port\Outbound\InspectionReportPdfRendererPort:
    alias: Inspection\Infrastructure\Pdf\DompdfInspectionReportRenderer

  Inspection\Application\Port\Outbound\NonConformityReportPdfRendererPort:
    alias: Inspection\Infrastructure\Pdf\DompdfNonConformityReportRenderer

  # PDF report entitlement (pro/max — the same Organization-module adapter
  # as the Compliance safety register, one allow-list for every PDF export)
  Inspection\Application\Port\Outbound\InspectionReportEntitlementPort:
    alias: Organization\Infrastructure\Adapter\Export\OrganizationExportEntitlementAdapter

  # Command Handlers
  Inspection\Application\UseCase\Command\Inspection\CreateInspection\CreateInspectionHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Inspection\EditInspection\EditInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Inspection\CancelInspection\CancelInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Inspection\SubmitInspection\SubmitInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Inspection\CloseInspection\CloseInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\NonConformity\AddNonConformity\AddNonConformityHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\NonConformity\UpdateNonConformityStatus\UpdateNonConformityStatusHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Sweep\EscalateNonConformitySlaBreaches\EscalateNonConformitySlaBreachesHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Checklist\CreateChecklist\CreateChecklistHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Checklist\ArchiveChecklist\ArchiveChecklistHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Checklist\UpdateChecklist\UpdateChecklistHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Attachment\AddInspectionAttachment\AddInspectionAttachmentHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Attachment\DeleteInspectionAttachment\DeleteInspectionAttachmentHandler:
    tags: ['messenger.message_handler']

  # Canonical inspection responses. All three name the `main` transaction
  # manager explicitly: autowiring would hand over the default one, which
  # opens a transaction on the `auth` connection while the writes go to
  # `main` — a rollback that rolls nothing back.
  Inspection\Application\UseCase\Command\Response\CreateInspectionResponse\CreateInspectionResponseHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Response\UpdateInspectionResponse\UpdateInspectionResponseHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Response\DeleteInspectionResponse\DeleteInspectionResponseHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  # Canonical (flat, offline-syncable) inspection mutations. Same `main`
  # transaction manager, same reason as above.
  Inspection\Application\UseCase\Command\Inspection\PatchCanonicalInspection\PatchCanonicalInspectionHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Command\Inspection\DeleteCanonicalInspection\DeleteCanonicalInspectionHandler:
    arguments:
      $transactionManager: '@inspection.main_transaction_manager'
    tags: ['messenger.message_handler']

  # Query Handlers
  Inspection\Application\UseCase\Query\Inspection\GetInspection\GetInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Inspection\ListInspections\ListInspectionsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\NonConformity\ListNonConformities\ListNonConformitiesHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\NonConformity\ListOrganizationNonConformities\ListOrganizationNonConformitiesHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\NonConformity\GetNonConformity\GetNonConformityHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\NonConformity\GetNonConformityStatistics\GetNonConformityStatisticsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Checklist\GetChecklist\GetChecklistHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Checklist\ListChecklists\ListChecklistsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Attachment\ListInspectionAttachments\ListInspectionAttachmentsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Response\GetInspectionResponse\GetInspectionResponseHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Response\ListInspectionResponses\ListInspectionResponsesHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Response\ResolveInspectionResponseScope\ResolveInspectionResponseScopeHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Inspection\GetCanonicalInspection\GetCanonicalInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Inspection\ReadCanonicalInspection\ReadCanonicalInspectionHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Inspection\ListCanonicalInspections\ListCanonicalInspectionsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\Inspection\ResolveCanonicalInspectionScope\ResolveCanonicalInspectionScopeHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\ExportInspections\ExportInspectionsHandler:
    tags: ['messenger.message_handler']

  Inspection\Application\UseCase\Query\ExportNonConformities\ExportNonConformitiesHandler:
    tags: ['messenger.message_handler']


  # NC SLA escalation sweep: candidate selection over non_conformities (main DB)
  Inspection\Application\Port\Outbound\NonConformitySlaPort:
    alias: Inspection\Infrastructure\Adapter\Sla\DoctrineNonConformitySlaAdapter

  Inspection\Infrastructure\Adapter\Sla\DoctrineNonConformitySlaAdapter:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Cross-module read model: per-severity non-conformity resolution SLAs
  # (adapter lives in the owning Organization module)
  Inspection\Application\Port\Outbound\Compliance\NonConformitySlaPolicyPort:
    alias: Organization\Infrastructure\Adapter\Inspection\OrganizationNonConformitySlaPolicyAdapter

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Automation\Infrastructure\:
    resource: '../../src/Automation/Infrastructure'

  # Outbound ports
  Automation\Application\Port\Outbound\AutomationRunPort:
    alias: Automation\Infrastructure\Persistence\Doctrine\Repository\AutomationRunRepository

  # Cross-module outbound port (adapter lives in the owning module)
  Automation\Application\Port\Outbound\AutomationPolicyPort:
    alias: Organization\Infrastructure\Adapter\Automation\OrganizationAutomationPolicyAdapter

  # Enqueues the async rule execution. NOT the command bus: that adapter
  # requires a HandledStamp, which an async-routed message never carries.
  Automation\Application\Port\Outbound\AutomationRuleQueuePort:
    alias: Automation\Infrastructure\Adapter\Messenger\MessengerAutomationRuleQueueAdapter

  Automation\Infrastructure\Adapter\Messenger\MessengerAutomationRuleQueueAdapter:
    arguments:
      $messageBus: '@messenger.default_bus'

  # Repository
  Automation\Infrastructure\Persistence\Doctrine\Repository\AutomationRunRepository:
    arguments:
      $entityManager: '@doctrine.orm.main_entity_manager'

  # Command handlers
  Automation\Application\UseCase\Command\Rule\ExecuteAutomationRule\ExecuteAutomationRuleHandler:
    arguments:
      $transactions: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
      $eventDispatcher: '@Shared\Infrastructure\Messaging\Outbox\TransactionalEventDispatcher'
    tags: ['messenger.message_handler']

  Automation\Application\Port\Outbound\AutomationRunHistoryPort:
    alias: Automation\Infrastructure\Persistence\Doctrine\Repository\AutomationRunRepository

  Automation\Presentation\:
    resource: '../../src/Automation/Presentation'

  Automation\Application\UseCase\Query\ListAutomationAttempts\ListAutomationAttemptsHandler:
    tags: ['messenger.message_handler']

  Automation\Application\UseCase\Command\RetryAutomationAttempt\RetryAutomationAttemptHandler:
    arguments:
      $transactions: '@Shared\Infrastructure\Messaging\Outbox\DbalTransactionManagerAdapter'
    tags: ['messenger.message_handler']

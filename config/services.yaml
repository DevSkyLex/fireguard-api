# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  shared.file_storage.base_path: '%kernel.project_dir%/var/storage'
  database_storage_timezone_default: 'UTC'
  # Public frontend base URL used to build deep links in transactional emails
  app.frontend_url: '%env(APP_FRONTEND_URL)%'
  # Security headers configuration with defaults
  security_headers.enabled_default: 'true'
  security_headers.csp_default: ''
  security_headers.hsts_max_age_default: 31536000
  security_headers.enabled: '%env(default:security_headers.enabled_default:SECURITY_HEADERS_ENABLED)%'
  security_headers.csp: '%env(default:security_headers.csp_default:SECURITY_HEADERS_CSP)%'
  security_headers.hsts_max_age: '%env(int:default:security_headers.hsts_max_age_default:SECURITY_HEADERS_HSTS_MAX_AGE)%'
  # Maximum facility hierarchy depth (root = level 1); no facility may end up deeper than this.
  facility.hierarchy.max_depth_default: 8
  facility.hierarchy.max_depth: '%env(int:default:facility.hierarchy.max_depth_default:FACILITY_MAX_DEPTH)%'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  # Note: Bounded contexts (Shared, Client, User, Auth, Tenant, Session) are configured
  # in their respective module files in config/modules/


  # MFA Port/Adapter Configuration
  Auth\Application\Port\Outbound\Mfa\ChallengeGeneratorPort:
    class: Auth\Infrastructure\Adapter\Mfa\OtpModuleChallengeGeneratorAdapter

  Auth\Application\Port\Outbound\Mfa\ChallengeVerifierPort:
    class: Auth\Infrastructure\Adapter\Mfa\OtpModuleChallengeVerifierAdapter

  app.doctrine_migrations.main_schema_filter_listener:
    class: Doctrine\Bundle\MigrationsBundle\EventListener\SchemaFilterListener
    arguments:
      $configurationTableName: 'doctrine_migration_versions_main'
    tags:
      - { name: 'kernel.event_listener', event: 'console.command', method: 'onConsoleCommand' }
      - { name: 'doctrine.dbal.schema_filter', connection: 'auth' }
      - { name: 'doctrine.dbal.schema_filter', connection: 'main' }

  # Re-declares main's PostgreSQL partial indexes (which ORM attributes cannot
  # express) so schema:validate and migrations:diff stop flagging them as drift.
  Shared\Infrastructure\Doctrine\PartialIndexSchemaListener:
    tags:
      - { name: 'doctrine.event_listener', event: 'postGenerateSchema', connection: 'main' }



<?xml version="1.0" encoding="UTF-8"?>
<!--
  Seed floor plan — Main Building, Floor 1.

  Deliberately a hand-written SVG rather than a raster blob: it is reviewable in
  a diff, weighs nothing, and its `width`/`height` attributes are exactly what
  ImageDimensions probes by regex. The drawing is schematic on purpose — the
  fixture exists to exercise the plan pipeline (viewer, outline editor, 3D
  extrusion), not to look like a real survey.

  The polygons the fixture stores as `plan_geometry` are expressed as fractions
  of this canvas, so they line up with the rooms drawn here.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <rect width="2400" height="1600" fill="#f8fafc"/>

  <!-- Building envelope: matches the floor's own outline, 0.05..0.95 x 0.08..0.92 -->
  <rect x="120" y="128" width="2160" height="1344" fill="#ffffff" stroke="#94a3b8" stroke-width="10"/>

  <!-- Zone A, 0.10..0.46 x 0.14..0.55 -->
  <rect x="240" y="224" width="864" height="656" fill="#f1f5f9" stroke="#64748b" stroke-width="6"/>
  <text x="264" y="264" font-family="sans-serif" font-size="34" fill="#475569">Zone A</text>

  <!-- Server Room, nested inside Zone A, 0.14..0.40 x 0.20..0.48 -->
  <rect x="336" y="320" width="624" height="448" fill="#e2e8f0" stroke="#475569" stroke-width="6"/>
  <text x="360" y="360" font-family="sans-serif" font-size="34" fill="#334155">Server Room</text>

  <!-- Circulation, drawn only so the plan reads as a floor rather than two boxes -->
  <line x1="1152" y1="128" x2="1152" y2="1472" stroke="#cbd5e1" stroke-width="6" stroke-dasharray="24 18"/>
  <text x="1200" y="800" font-family="sans-serif" font-size="34" fill="#94a3b8">Corridor</text>
</svg>

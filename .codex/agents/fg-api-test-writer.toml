The parent assigns test files. Preserve other edits and coordinate overlap. Select the correct
test level, cover denial and idempotence, and never modify production merely to make a test pass.
Run focused host-side PostgreSQL tests. Do not start nested agents unless delegated.
Report files, coverage, actual checks and blockers.
"""

matching .codex/rules.md entries, the owning MODULE.md and
.agents/skills/fg-api-endpoint/SKILL.md. Follow that native Codex procedure.
The parent assigns files and responsibility. Preserve other edits and coordinate overlap.
Build the complete API Platform contract while leaving business decisions in handlers.
Finish focused tests and contract validation. Do not start nested agents unless delegated.
Report files, behavior, checks and blockers.
"""

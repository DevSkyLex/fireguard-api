# Copy to config.toml and replace checkout placeholders before starting MCPs.
# config.toml is local and ignored by Git; this example uses native Codex options.
# Enable only the servers needed by the folders attached to your project.

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60

[mcp_servers."angular"]
command = "npx"
args = ["--no-install", "ng", "mcp", "--read-only"]
cwd = "<WEB_CHECKOUT>"
startup_timeout_sec = 60

[mcp_servers."spartan"]
command = "npx"
args = ["-y", "@spartan-ng/mcp"]
cwd = "<WEB_CHECKOUT>"
startup_timeout_sec = 60

[mcp_servers."playwright"]
command = "npx"
args = ["-y", "@playwright/mcp"]
cwd = "<WEB_CHECKOUT>"
startup_timeout_sec = 60

[mcp_servers."serena-api"]
enabled = false
command = "serena"
args = ["start-mcp-server", "--context", "ide", "--project-from-cwd"]
cwd = "<API_CHECKOUT>"
startup_timeout_sec = 120

[mcp_servers."serena-web"]
enabled = false
command = "serena"
args = ["start-mcp-server", "--context", "ide", "--project-from-cwd"]
cwd = "<WEB_CHECKOUT>"
startup_timeout_sec = 120

# Peer agents for the shared API + web project; definitions stay in their owner checkout.

[agents."fg-web-a11y-auditor"]
description = "Audit FireGuard semantics and interaction accessibility with concrete evidence and limits."
config_file = "../../fireguard-web/.codex/agents/fg-web-a11y-auditor.toml"

[agents."fg-web-access-builder"]
description = "Build FireGuard permission projections and owner-published access contracts."
config_file = "../../fireguard-web/.codex/agents/fg-web-access-builder.toml"

[agents."fg-web-api-contract-reviewer"]
description = "Compare FireGuard frontend transport contracts with explicitly scoped backend evidence."

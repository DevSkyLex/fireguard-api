sonar.projectKey=Fireguard-SSO
sonar.projectName=Fireguard SSO
sonar.projectVersion=1.0

# Required for SonarCloud
# sonar.organization=your_organization_key

sonar.sources=src
sonar.tests=tests

sonar.php.file.suffixes=php
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,var/**,config/**,bin/**,public/**
sonar.test.exclusions=tests/bootstrap.php

# Coverage (Optional - requires report generation)
# sonar.php.coverage.reportPaths=var/coverage/coverage.xml
# sonar.php.tests.reportPath=var/coverage/test.xml

# Quality Gate
sonar.qualitygate.wait=true

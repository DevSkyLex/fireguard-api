# The local Docker Compose scanner defaults to the develop project on its own
# local server. CI overrides both project key and name for the branch checkout.
sonar.projectKey=fireguard-api-develop
sonar.projectName=FireGuard API (local)

sonar.sources=src
sonar.tests=tests

sonar.php.file.suffixes=php
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,var/**,config/**,bin/**,public/**,migrations/**
sonar.test.exclusions=tests/bootstrap.php
sonar.coverage.exclusions=tests/**

sonar.php.coverage.reportPaths=var/coverage/full/clover.xml

# CI waits for the result using the official quality-gate action.

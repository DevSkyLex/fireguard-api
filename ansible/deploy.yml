---
- name: Deploy Fireguard API to VPS
  hosts: fireguard_vps
  gather_facts: false

  vars:
    fireguard_app_dir: "{{ lookup('env', 'VPS_APP_DIR') | default('/opt/fireguard-sso-api', true) }}"
    fireguard_image: "{{ lookup('env', 'IMAGE_REF') | lower }}"
    fireguard_healthcheck_url: "{{ lookup('env', 'VPS_HEALTHCHECK_URL') | default('', true) }}"
    fireguard_healthcheck_validate_certs: "{{ lookup('env', 'VPS_HEALTHCHECK_VALIDATE_CERTS') | default('true', true) | bool }}"
    fireguard_compose_file: compose.yaml
    fireguard_env_file: "{{ fireguard_app_dir }}/.env"
    # When true, the deploy RENDERS the production env file from GitHub variables
    # and secrets instead of trusting whatever is on the VPS. Off by default: the
    # existing file holds values GitHub does not have yet, and rendering before they
    # are populated would replace a working secret with an empty string. Turn it on
    # with the repository variable FIREGUARD_MANAGED_ENV=true once every key listed
    # by the preflight is set. The file is backed up first, either way.
    fireguard_managed_env: "{{ lookup('env', 'FIREGUARD_MANAGED_ENV') | default('false', true) | bool }}"
    # Written by the template rather than supplied: the image ref comes from the
    # build job, and the two connection URLs are derived from the POSTGRES_* parts
    # so the password cannot exist in two places and disagree with itself.
    fireguard_computed_env_keys:
      - FIREGUARD_IMAGE
      - AUTH_DATABASE_URL
      - MAIN_DATABASE_URL
    fireguard_traefik_network: traefik_proxy
    # How many per-deployment backup directories to keep. Nothing pruned them
    # before: every deploy wrote a full dump of BOTH databases and left it there,
    # so the VPS filled up at a rate nobody was tracking.
    fireguard_backup_retention: 10
    fireguard_healthcheck_retries: 30
    fireguard_healthcheck_delay: 5
    fireguard_deployment_timestamp: ""
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') | default('', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"

  pre_tasks:
    - name: Validate required deployment image
      ansible.builtin.assert:
        that:
          - fireguard_image is defined
          - fireguard_image | length > 0
        fail_msg: fireguard_image is required.

    - name: Validate Docker Compose is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Validate curl is available
      ansible.builtin.command: curl --version
      changed_when: false

    - name: Compute deployment timestamp once
      ansible.builtin.set_fact:
        fireguard_deployment_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"
      run_once: true
      when: fireguard_deployment_timestamp | length == 0

    - name: Propagate deployment timestamp to all hosts
      ansible.builtin.set_fact:
        fireguard_deployment_timestamp: "{{ hostvars[ansible_play_hosts_all[0]].fireguard_deployment_timestamp }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ ansible_play_hosts_all }}"
      run_once: true
      when: fireguard_deployment_timestamp | length == 0

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ fireguard_app_dir }}"
        state: directory
        mode: "0755"

    - name: Check production env file exists on VPS
      ansible.builtin.stat:
        path: "{{ fireguard_env_file }}"
      register: fireguard_env_stat

    - name: Stop if production env file is missing
      ansible.builtin.fail:
        msg: "Missing {{ fireguard_env_file }}. Create it manually on the VPS before deploying."
      when: not fireguard_env_stat.stat.exists

    - name: Copy production Docker Compose file
      ansible.builtin.copy:
        src: ../compose.prod.yaml
        dest: "{{ fireguard_app_dir }}/{{ fireguard_compose_file }}"
        mode: "0644"

    # Skipped when the file is generated: the template writes FIREGUARD_IMAGE itself.
    - name: Record deployed image in production env file
      ansible.builtin.lineinfile:
        path: "{{ fireguard_env_file }}"
        regexp: ^FIREGUARD_IMAGE=
        line: "FIREGUARD_IMAGE={{ fireguard_image }}"
        create: false
        mode: "0600"
      when: not fireguard_managed_env

    - name: Ensure production env file permissions are private
      ansible.builtin.file:
        path: "{{ fireguard_env_file }}"
        mode: "0600"

    # The image ships NO .env: .dockerignore excludes `.env` and `.env.*` and keeps
    # only `.env.example`, which symfony/dotenv never loads. Every key the app reads
    # must therefore be a real environment variable coming from this file.
    #
    # A key missing here is not a warning, it is an EnvNotFoundException on the first
    # request that reads it — which is how the 2026-07-28 and 2026-08-27 deploys each
    # spent four minutes failing the health check on a bare 500, *after* stopping the
    # app and migrating both databases. This check runs BEFORE any of that, so a
    # missing key costs a named error instead of a half-deployed production.
    - name: Read the production env file
      ansible.builtin.slurp:
        src: "{{ fireguard_env_file }}"
      register: fireguard_env_contents

    # Three sources, because the file serves two consumers and one of them also
    # answers for itself. `.env.example` is the application's declared contract.
    # `compose.prod.yaml` adds the Postgres identity and the image ref, marking what
    # it cannot do without as `${VAR:?message}` -- `${VAR:-default}` is optional and
    # is deliberately not collected. Deriving that list from the compose file rather
    # than hand-keeping it means POSTGRES_AUTH_PASSWORD cannot quietly drop out.
    #
    # And it SUBTRACTS what compose pins itself. Its `environment:` blocks hardcode
    # APP_ENV, REDIS_URL, MERCURE_URL, MERCURE_PUBLIC_URL and DEFAULT_URI, and
    # `environment:` wins over `env_file:` -- so those five reach the container
    # whatever the env file says, including in the `run --rm` deploy steps. Demanding
    # them was a false positive that would block a deploy over a key that is never
    # actually missing. Only literal values count: `${FRANKENPHP_CONFIG:-}` is an
    # interpolation, not a pin.
    - name: Read the production compose file
      ansible.builtin.set_fact:
        fireguard_compose: "{{ lookup('file', playbook_dir + '/../compose.prod.yaml') | from_yaml }}"

    - name: Subtract the keys compose pins in its own environment blocks
      ansible.builtin.set_fact:
        fireguard_pinned_env_keys: >-
          {{ (fireguard_compose.services | dict2items
              | map(attribute='value.environment', default={})
              | select('mapping') | map('dict2items') | flatten)
             | rejectattr('value', 'match', '\$\{')
             | map(attribute='key') | list }}

    - name: Resolve the keys the production env file must carry
      ansible.builtin.set_fact:
        fireguard_declared_env_keys: >-
          {{ ((lookup('file', playbook_dir + '/../.env.example') | regex_findall('(?m)^([A-Z][A-Z0-9_]*)='))
              | union(lookup('file', playbook_dir + '/../compose.prod.yaml') | regex_findall('\$\{([A-Z][A-Z0-9_]*):\?')))
             | difference(fireguard_pinned_env_keys) }}

    - name: Collect the env keys the production file sets
      ansible.builtin.set_fact:
        fireguard_present_env_keys: "{{ fireguard_env_contents.content | b64decode | regex_findall('(?m)^([A-Z][A-Z0-9_]*)=') }}"

    - name: Stop before touching production if a declared key is missing
      ansible.builtin.fail:
        msg: >-
          {{ fireguard_env_file }} is missing
          {{ fireguard_declared_env_keys | difference(fireguard_present_env_keys) | length }}
          key(s) that .env.example declares:
          {{ fireguard_declared_env_keys | difference(fireguard_present_env_keys) | join(', ') }}.
          The image carries no .env, so each of these is an EnvNotFoundException at
          runtime. Add them on the VPS and redeploy. The application is still running
          and no migration has run.
      when:
        - not fireguard_managed_env
        - fireguard_declared_env_keys | difference(fireguard_present_env_keys) | length > 0

    # ---- Generated env file (opt-in, FIREGUARD_MANAGED_ENV=true) -------------------
    #
    # The same check, moved one level earlier: instead of asking whether the VPS file
    # carries every key, ask whether the WORKFLOW does. A key GitHub does not supply
    # would render as `KEY=` — and an empty value is not a missing value, it is a
    # working one that happens to be wrong. On AUTH_DATABASE_URL that is not a failed
    # boot: `Synchronize auth database role password` below reads that URL and runs
    # ALTER USER on the live database, so an empty password would be applied.
    #
    # Hence: refuse to render at all unless every key has a non-empty value.
    - name: Collect the keys the workflow failed to supply
      ansible.builtin.set_fact:
        fireguard_blank_env_keys: >-
          {{ fireguard_blank_env_keys | default([])
             + ([item] if (lookup('env', item) | length == 0) else []) }}
      loop: "{{ fireguard_declared_env_keys | difference(fireguard_computed_env_keys) | list }}"
      loop_control:
        label: "{{ item }}"
      when: fireguard_managed_env

    - name: Refuse to generate an env file with blanks in it
      ansible.builtin.fail:
        msg: >-
          FIREGUARD_MANAGED_ENV is on but the workflow supplied no value for
          {{ fireguard_blank_env_keys | join(', ') }}.
          Rendering would write those keys empty, which is worse than leaving them
          missing -- an empty value is not a missing value, it is a working one that
          happens to be wrong, and an empty AUTH_DATABASE_URL password is applied to
          the live database by the role-password task below. Set them as GitHub
          variables or secrets, or turn FIREGUARD_MANAGED_ENV off. The application is
          still running and no migration has run.
      when:
        - fireguard_managed_env
        - fireguard_blank_env_keys | default([]) | length > 0

    # A value is written to the file verbatim, so a newline inside one does not
    # produce a broken line -- it produces an EXTRA line, and compose loads it.
    # Measured: ADMIN_EMAIL carrying a line break followed by "INJECTED_KEY=pwned"
    # rendered both lines, and DeployEnvContractTest does not catch it -- it asserts
    # which keys are DECLARED, not which end up in the file.
    #
    # A single quote is rejected too. Every value in the template is single-quoted,
    # because this file is SOURCED by /bin/sh in the two role-password tasks and not
    # merely read by compose: unquoted, the `&` in `?serverVersion=16&charset=utf8`
    # backgrounds the assignment and leaves AUTH_DATABASE_URL empty. That is what
    # broke the first managed deploy. Leading and trailing whitespace goes on the
    # same pass: no key can legitimately need it, and a pasted trailing space
    # silently breaks a URL or a DSN.
    - name: Collect the values that would corrupt the generated file
      ansible.builtin.set_fact:
        fireguard_unsafe_env_keys: >-
          {{ fireguard_unsafe_env_keys | default([])
             + ([item] if (lookup('env', item) is search('[\r\n\x27]')
                           or lookup('env', item) != (lookup('env', item) | trim))
                else []) }}
      loop: "{{ fireguard_declared_env_keys | difference(fireguard_computed_env_keys) | list }}"
      loop_control:
        label: "{{ item }}"
      when: fireguard_managed_env

    - name: Refuse to generate an env file from a value that would corrupt it
      ansible.builtin.fail:
        msg: >-
          These values contain a line break, a single quote, or leading or trailing
          whitespace:
          {{ fireguard_unsafe_env_keys | join(', ') }}.
          A line break adds a KEY=VALUE line that compose loads and nothing reviews.
          A single quote closes the quoting the file depends on -- it is SOURCED by
          /bin/sh in the role-password tasks, not only read by compose. Stray
          whitespace silently becomes part of a URL or a DSN. Fix the GitHub
          variable or secret. The application is still running and no migration has
          run.
      when:
        - fireguard_managed_env
        - fireguard_unsafe_env_keys | default([]) | length > 0

    # ONE previous copy, overwritten, not one per deployment. A timestamped backup
    # of a file holding every production secret accumulates a new full copy on disk
    # every deploy, forever, and nothing here prunes them. In managed mode the file
    # is reproducible from GitHub, so this is a convenience for recovering from a
    # bad render, not the source of truth -- one is enough.
    - name: Back up the production env file before replacing it
      ansible.builtin.copy:
        src: "{{ fireguard_env_file }}"
        dest: "{{ fireguard_env_file }}.previous"
        remote_src: true
        mode: "0600"
      when: fireguard_managed_env

    - name: Generate the production env file
      ansible.builtin.template:
        src: templates/production.env.j2
        dest: "{{ fireguard_env_file }}"
        mode: "0600"
      when: fireguard_managed_env

    - name: Check Traefik Docker network
      ansible.builtin.command: "docker network inspect {{ fireguard_traefik_network }}"
      register: fireguard_traefik_network_check
      changed_when: false
      failed_when: false

    - name: Create Traefik Docker network
      ansible.builtin.command: "docker network create {{ fireguard_traefik_network }}"
      when: fireguard_traefik_network_check.rc != 0

    - name: Log in to GHCR on VPS
      ansible.builtin.command:
        cmd: "docker login ghcr.io -u {{ ghcr_username }} --password-stdin"
        stdin: "{{ ghcr_token }}"
      no_log: true
      when:
        - ghcr_username | length > 0
        - ghcr_token | length > 0

    - name: Pull Docker images
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} pull"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Initialize JWT key volume
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} --profile tools run --rm jwt_init"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Ensure application runtime volume permissions
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} --profile tools run --rm app_var_init"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Start dependency services
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} up -d auth_database main_database redis mercure"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Wait for auth database
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        docker compose -f {{ fireguard_compose_file }} exec -T auth_database pg_isready -U "$POSTGRES_AUTH_USER" -d "$POSTGRES_AUTH_DB"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      register: fireguard_auth_db_ready
      changed_when: false
      retries: 30
      delay: 2
      until: fireguard_auth_db_ready.rc == 0

    - name: Wait for main database
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        docker compose -f {{ fireguard_compose_file }} exec -T main_database pg_isready -U "$POSTGRES_MAIN_USER" -d "$POSTGRES_MAIN_DB"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      register: fireguard_main_db_ready
      changed_when: false
      retries: 30
      delay: 2
      until: fireguard_main_db_ready.rc == 0

    # `Synchronize <db> database role password` carries a password, so it runs
    # under no_log -- and a no_log failure is a wall: the run says only "non-zero
    # return code". It hid the cause twice.
    #
    # These probes ASK THE VOLUME rather than trusting what it was told. Postgres
    # ignores POSTGRES_USER and POSTGRES_DB on a data directory that is already
    # initialised, so those two variables describe an intention, not a fact: the
    # role and database that exist are whatever initdb created, once. `pg_isready`
    # does not notice -- it checks that the server answers, not that the role
    # exists -- which is why `Wait for auth database` passes and everything after
    # it fails.
    #
    # No secret appears in any command here, so the output is safe to print, and
    # that is the point: the failure has to be legible without SSH to the host.
    #
    # Connecting is not enough to pass. The probe connects with whatever candidate
    # works, then checks the CONFIGURED names against the lists it read back --
    # measured against a real container: with both names wrong it still connects
    # as the discovered role, prints the real ones, and exits 78 naming both
    # mismatches. Exiting 0 on a successful connection alone would have let the
    # deploy carry on to fail at the ALTER, which is the failure this replaces.
    - name: Discover what the auth volume actually holds
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        test -n "$POSTGRES_AUTH_USER" || { echo "POSTGRES_AUTH_USER is empty after sourcing the env file"; exit 78; }
        test -n "$POSTGRES_AUTH_DB" || { echo "POSTGRES_AUTH_DB is empty after sourcing the env file"; exit 78; }
        test -n "$AUTH_DATABASE_URL" || { echo "AUTH_DATABASE_URL is empty after sourcing the env file"; exit 78; }
        echo "configured: user=${POSTGRES_AUTH_USER} database=${POSTGRES_AUTH_DB}"

        # template1 always exists, whatever POSTGRES_DB was at init time.
        connected=''
        for candidate in "$POSTGRES_AUTH_USER" postgres admin fireguard; do
          [ -n "$candidate" ] || continue
          if docker compose -f {{ fireguard_compose_file }} exec -T auth_database \
               psql -U "$candidate" -d template1 -tAc 'SELECT 1' >/dev/null 2>&1; then
            connected="$candidate"
            break
          fi
        done

        if [ -z "$connected" ]; then
          echo "no candidate role could connect to the auth volume"
          exit 78
        fi

        echo "connected as: ${connected}"
        roles=$(docker compose -f {{ fireguard_compose_file }} exec -T auth_database \
          psql -U "$connected" -d template1 -tAc "SELECT rolname FROM pg_roles WHERE rolname NOT LIKE 'pg\_%' ORDER BY rolname")
        databases=$(docker compose -f {{ fireguard_compose_file }} exec -T auth_database \
          psql -U "$connected" -d template1 -tAc "SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname")
        echo "roles present: $(echo "$roles" | tr '\n' ' ')"
        echo "databases present: $(echo "$databases" | tr '\n' ' ')"

        status=0
        echo "$roles" | grep -qx "$POSTGRES_AUTH_USER" \
          || { echo "MISMATCH: the configured role '${POSTGRES_AUTH_USER}' is not one of them"; status=78; }
        echo "$databases" | grep -qx "$POSTGRES_AUTH_DB" \
          || { echo "MISMATCH: the configured database '${POSTGRES_AUTH_DB}' is not one of them"; status=78; }
        exit "$status"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      register: fireguard_auth_volume
      changed_when: false
      failed_when: false

    - name: Report what the auth volume holds
      ansible.builtin.debug:
        msg: "{{ (fireguard_auth_volume.stdout_lines | default([])) + (fireguard_auth_volume.stderr_lines | default([])) }}"

    - name: Stop if the auth volume does not hold what this deploy was configured with
      ansible.builtin.fail:
        msg: >-
          POSTGRES_AUTH_USER and POSTGRES_AUTH_DB do not match the auth volume. The
          report above lists the roles and databases that are actually there; set
          the two GitHub variables to those names. The application is still running
          and no migration has run.
      when: fireguard_auth_volume.rc | default(1) != 0

    - name: Discover what the main volume actually holds
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        test -n "$POSTGRES_MAIN_USER" || { echo "POSTGRES_MAIN_USER is empty after sourcing the env file"; exit 78; }
        test -n "$POSTGRES_MAIN_DB" || { echo "POSTGRES_MAIN_DB is empty after sourcing the env file"; exit 78; }
        test -n "$MAIN_DATABASE_URL" || { echo "MAIN_DATABASE_URL is empty after sourcing the env file"; exit 78; }
        echo "configured: user=${POSTGRES_MAIN_USER} database=${POSTGRES_MAIN_DB}"

        # template1 always exists, whatever POSTGRES_DB was at init time.
        connected=''
        for candidate in "$POSTGRES_MAIN_USER" postgres main_admin fireguard; do
          [ -n "$candidate" ] || continue
          if docker compose -f {{ fireguard_compose_file }} exec -T main_database \
               psql -U "$candidate" -d template1 -tAc 'SELECT 1' >/dev/null 2>&1; then
            connected="$candidate"
            break
          fi
        done

        if [ -z "$connected" ]; then
          echo "no candidate role could connect to the main volume"
          exit 78
        fi

        echo "connected as: ${connected}"
        roles=$(docker compose -f {{ fireguard_compose_file }} exec -T main_database \
          psql -U "$connected" -d template1 -tAc "SELECT rolname FROM pg_roles WHERE rolname NOT LIKE 'pg\_%' ORDER BY rolname")
        databases=$(docker compose -f {{ fireguard_compose_file }} exec -T main_database \
          psql -U "$connected" -d template1 -tAc "SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname")
        echo "roles present: $(echo "$roles" | tr '\n' ' ')"
        echo "databases present: $(echo "$databases" | tr '\n' ' ')"

        status=0
        echo "$roles" | grep -qx "$POSTGRES_MAIN_USER" \
          || { echo "MISMATCH: the configured role '${POSTGRES_MAIN_USER}' is not one of them"; status=78; }
        echo "$databases" | grep -qx "$POSTGRES_MAIN_DB" \
          || { echo "MISMATCH: the configured database '${POSTGRES_MAIN_DB}' is not one of them"; status=78; }
        exit "$status"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      register: fireguard_main_volume
      changed_when: false
      failed_when: false

    - name: Report what the main volume holds
      ansible.builtin.debug:
        msg: "{{ (fireguard_main_volume.stdout_lines | default([])) + (fireguard_main_volume.stderr_lines | default([])) }}"

    - name: Stop if the main volume does not hold what this deploy was configured with
      ansible.builtin.fail:
        msg: >-
          POSTGRES_MAIN_USER and POSTGRES_MAIN_DB do not match the main volume. The
          report above lists the roles and databases that are actually there; set
          the two GitHub variables to those names. The application is still running
          and no migration has run.
      when: fireguard_main_volume.rc | default(1) != 0

    - name: Synchronize auth database role password
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        doctrine_user=$(python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["AUTH_DATABASE_URL"]).username or ""))')
        doctrine_password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["AUTH_DATABASE_URL"]).password or ""))')
        test -n "$doctrine_user"
        test -n "$doctrine_password"
        escaped_user=$(printf '%s' "$doctrine_user" | sed 's/"/""/g')
        escaped_password=$(printf '%s' "$doctrine_password" | sed "s/'/''/g")
        docker compose -f {{ fireguard_compose_file }} exec -T auth_database psql -U "$POSTGRES_AUTH_USER" -d "$POSTGRES_AUTH_DB" -c "ALTER USER \"$escaped_user\" WITH PASSWORD '$escaped_password';"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      no_log: true

    - name: Synchronize main database role password
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        doctrine_user=$(python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["MAIN_DATABASE_URL"]).username or ""))')
        doctrine_password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["MAIN_DATABASE_URL"]).password or ""))')
        test -n "$doctrine_user"
        test -n "$doctrine_password"
        escaped_user=$(printf '%s' "$doctrine_user" | sed 's/"/""/g')
        escaped_password=$(printf '%s' "$doctrine_password" | sed "s/'/''/g")
        docker compose -f {{ fireguard_compose_file }} exec -T main_database psql -U "$POSTGRES_MAIN_USER" -d "$POSTGRES_MAIN_DB" -c "ALTER USER \"$escaped_user\" WITH PASSWORD '$escaped_password';"
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh
      no_log: true

    - name: Create deployment backup directory
      ansible.builtin.file:
        path: "{{ fireguard_app_dir }}/backups/{{ fireguard_deployment_timestamp }}"
        state: directory
        mode: "0750"

    - name: Back up auth database
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        docker compose -f {{ fireguard_compose_file }} exec -T auth_database pg_dump -U "$POSTGRES_AUTH_USER" -d "$POSTGRES_AUTH_DB" -Fc > backups/{{ fireguard_deployment_timestamp }}/auth.dump
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh

    - name: Back up main database
      ansible.builtin.shell: |
        set -a
        . ./{{ fireguard_env_file | basename }}
        set +a
        docker compose -f {{ fireguard_compose_file }} exec -T main_database pg_dump -U "$POSTGRES_MAIN_USER" -d "$POSTGRES_MAIN_DB" -Fc > backups/{{ fireguard_deployment_timestamp }}/main.dump
      args:
        chdir: "{{ fireguard_app_dir }}"
        executable: /bin/sh

    # Directory names are the deployment timestamp, YYYYMMDDHHMMSS, so a
    # lexicographic sort is chronological. The slice takes everything EXCEPT the
    # newest N; `max(0, ...)` keeps it empty while there are fewer than N, rather
    # than relying on a negative slice to mean the same thing by accident.
    - name: List the deployment backups
      ansible.builtin.find:
        paths: "{{ fireguard_app_dir }}/backups"
        file_type: directory
        recurse: false
      register: fireguard_backup_dirs

    - name: Prune every deployment backup but the newest few
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ (fireguard_backup_dirs.files | map(attribute='path') | sort)
           [:[0, (fireguard_backup_dirs.files | length) - (fireguard_backup_retention | int)] | max] }}
      loop_control:
        label: "{{ item | basename }}"

    - name: Stop application service before schema changes
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} stop app"
      args:
        chdir: "{{ fireguard_app_dir }}"
      register: fireguard_stop_app
      changed_when: fireguard_stop_app.rc == 0
      failed_when: false

    - name: Run auth migrations
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} run --rm --no-deps app php -d display_errors=1 -d error_reporting=E_ALL bin/console doctrine:migrations:migrate --configuration=config/migrations/auth.yaml --no-interaction --env=prod -vvv"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Run main migrations
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} run --rm --no-deps app php -d display_errors=1 -d error_reporting=E_ALL bin/console doctrine:migrations:migrate --configuration=config/migrations/main.yaml --no-interaction --env=prod -vvv"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Clear production cache
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} run --rm --no-deps app php -d display_errors=1 -d error_reporting=E_ALL bin/console cache:clear --no-warmup --env=prod -vvv"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Warm production cache
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} run --rm --no-deps app php -d display_errors=1 -d error_reporting=E_ALL bin/console cache:warmup --env=prod -vvv"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Synchronize RBAC permissions
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} run --rm --no-deps app php -d display_errors=1 -d error_reporting=E_ALL bin/console app:authz:sync-permissions --update-roles --no-interaction --env=prod -vvv"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Start application service
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} up -d app"
      args:
        chdir: "{{ fireguard_app_dir }}"

    - name: Verify internal application health
      block:
        - name: Wait for internal application health
          ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} exec -T app curl -fsS http://localhost:8000/api/health"
          args:
            chdir: "{{ fireguard_app_dir }}"
          register: fireguard_internal_health
          changed_when: false
          retries: "{{ fireguard_healthcheck_retries }}"
          delay: "{{ fireguard_healthcheck_delay }}"
          until: fireguard_internal_health.rc == 0
      rescue:
        # The app logs JSON to stderr in prod (monolog), so the real exception —
        # e.g. `EnvNotFoundException: Environment variable not found: "..."` — is
        # in `docker compose logs`, not in curl's bare "error: 500". Surface it
        # before aborting so a failed deploy is diagnosable from the run output.
        - name: Dump application logs after failed health check
          ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} logs --tail=200 --no-color app"
          args:
            chdir: "{{ fireguard_app_dir }}"
          register: fireguard_app_logs
          changed_when: false
          # Never let the diagnostic itself abort the rescue block: a failure
          # here would replace the message below with a docker error and hide
          # the thing we came to read.
          failed_when: false
        # `command` output is registered, not printed. Without this task the
        # dump above went to a variable nobody read, and the failure message
        # pointed at logs that were never in the run output -- which is exactly
        # how the 2026-07-28 deploy failed undiagnosed for five weeks.
        - name: Surface the application logs in the run output
          ansible.builtin.debug:
            msg: "{{ (fireguard_app_logs.stdout_lines | default([])) + (fireguard_app_logs.stderr_lines | default([])) }}"
        - name: Fail the deploy after surfacing application logs
          ansible.builtin.fail:
            msg: >-
              The application did not become healthy. The app container logs were
              dumped in the previous task. A startup EnvNotFoundException there
              means a required key is missing from {{ fireguard_env_file }}.

    - name: Wait for public application health
      ansible.builtin.uri:
        url: "{{ fireguard_healthcheck_url }}"
        method: GET
        status_code: 200
        validate_certs: "{{ fireguard_healthcheck_validate_certs }}"
        return_content: false
      delegate_to: localhost
      register: fireguard_public_health
      retries: "{{ fireguard_healthcheck_retries }}"
      delay: "{{ fireguard_healthcheck_delay }}"
      until: fireguard_public_health.status == 200
      when: fireguard_healthcheck_url | length > 0

    - name: Show deployment services
      ansible.builtin.command: "docker compose -f {{ fireguard_compose_file }} ps"
      args:
        chdir: "{{ fireguard_app_dir }}"
      changed_when: false

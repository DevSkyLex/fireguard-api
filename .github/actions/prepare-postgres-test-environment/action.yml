name: Prepare PostgreSQL Test Environment
description: Setup PHP, install dependencies, and prepare PostgreSQL-backed test databases.

inputs:
  php-version:
    description: PHP version to install
    required: false
    default: '8.4'
  coverage-driver:
    description: Coverage driver passed to setup-php
    required: false
    default: none
  postgres-service-id:
    description: Service container identifier for the PostgreSQL job service
    required: true
  auth-database-url:
    description: Doctrine auth database URL used during test environment preparation
    required: true
  main-database-url:
    description: Doctrine main database URL used during test environment preparation
    required: true

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo_pgsql, intl, bcmath, zip
        coverage: ${{ inputs.coverage-driver }}

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      shell: bash
      env:
        AUTH_DATABASE_URL: ${{ inputs.auth-database-url }}
        MAIN_DATABASE_URL: ${{ inputs.main-database-url }}
      run: composer install --prefer-dist --no-progress

    - name: Prepare test artifacts
      shell: bash
      run: mkdir -p config/jwt var/coverage

    - name: Create main database
      shell: bash
      run: docker exec "${{ inputs.postgres-service-id }}" psql -U test -d postgres -c "CREATE DATABASE fireguard_main_test;"

    - name: Create JWT keys for tests
      shell: bash
      run: |
        openssl genrsa -out config/jwt/private.key 2048
        openssl rsa -in config/jwt/private.key -pubout -out config/jwt/public.key

    - name: Run database migrations
      shell: bash
      env:
        AUTH_DATABASE_URL: ${{ inputs.auth-database-url }}
        MAIN_DATABASE_URL: ${{ inputs.main-database-url }}
      run: |
        php bin/console doctrine:migrations:migrate --env=test --configuration=config/migrations/auth.yaml --no-interaction
        php bin/console doctrine:migrations:migrate --env=test --configuration=config/migrations/main.yaml --no-interaction

    - name: Validate Doctrine schema
      shell: bash
      env:
        AUTH_DATABASE_URL: ${{ inputs.auth-database-url }}
        MAIN_DATABASE_URL: ${{ inputs.main-database-url }}
      run: |
        php bin/console doctrine:schema:validate --env=test --em=auth
        php bin/console doctrine:schema:validate --env=test --em=main

    # Seeded once here rather than inside every E2E test, where DAMA rolled it
    # straight back at ~5s per test. Tests needing other data create it; tests
    # needing a table empty purge it — the rollback undoes either.
    - name: Seed fixture baseline
      shell: bash
      env:
        AUTH_DATABASE_URL: ${{ inputs.auth-database-url }}
        MAIN_DATABASE_URL: ${{ inputs.main-database-url }}
      run: php bin/console app:fixtures:load --env=test --no-interaction

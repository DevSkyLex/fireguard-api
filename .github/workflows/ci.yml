name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_mutation:
        description: Run the mutation testing job
        required: false
        type: boolean
        default: false
      run_e2e:
        description: Run end-to-end tests on non-deployment branches (always run on main/develop)
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  COMPOSER_ALLOW_SUPERUSER: 1
  AUTH_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_auth_test?serverVersion=16
  MAIN_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_main_test?serverVersion=16

jobs:
  # ==========================================================================
  # Code Style Check
  # ==========================================================================
  cs-check:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: php-cs-fixer

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  # ==========================================================================
  # Static Analysis
  # ==========================================================================
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.dist.neon --memory-limit=1G

  # ==========================================================================
  # Architecture Rules (Deptrac)
  # ==========================================================================
  deptrac:
    name: Architecture Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run Deptrac
        run: |
          vendor/bin/deptrac analyse --config-file=deptrac.yaml
          vendor/bin/deptrac analyse --config-file=deptrac.modules.php

  # ==========================================================================
  # PHPUnit Test Suites
  # ==========================================================================
  tests-unit:
    name: Unit and Architecture Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage-driver: pcov
          postgres-service-id: ${{ job.services.postgres.id }}
          auth-database-url: ${{ env.AUTH_DATABASE_URL }}
          main-database-url: ${{ env.MAIN_DATABASE_URL }}

      - name: Run unit and architecture tests with coverage
        run: |
          vendor/bin/phpunit \
            -c phpunit.dist.xml \
            --testsuite="Architecture Unit Tests,General Unit Tests" \
            --coverage-clover=var/coverage/unit-and-architecture.xml \
            --coverage-php=var/coverage/unit-and-architecture.php \
            --coverage-text \
            --only-summary-for-coverage-text

      - name: Preserve unit and architecture coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-unit
          path: var/coverage/unit-and-architecture.php
          if-no-files-found: error
          retention-days: 3

      # workflow_run cannot read the original push's `before`. Keep the exact
      # range alongside this CI run so deployment can skip documentation pushes.
      - name: Preserve push context for deployment
        if: ${{ github.event_name == 'push' }}
        run: |
          jq '{before, after, ref, repository: .repository.full_name}' \
            "$GITHUB_EVENT_PATH" > ci-push-context.json

      - name: Upload push context for deployment
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-push-context
          path: ci-push-context.json
          if-no-files-found: error
          retention-days: 7

  tests-integration:
    name: Integration and Functional Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage-driver: pcov
          postgres-service-id: ${{ job.services.postgres.id }}
          auth-database-url: ${{ env.AUTH_DATABASE_URL }}
          main-database-url: ${{ env.MAIN_DATABASE_URL }}

      - name: Run integration and functional tests with coverage
        run: |
          vendor/bin/phpunit \
            -c phpunit.dist.xml \
            --testsuite="General Integration Tests,General Functional Tests" \
            --coverage-clover=var/coverage/integration-and-functional.xml \
            --coverage-php=var/coverage/integration-and-functional.php \
            --coverage-text \
            --only-summary-for-coverage-text

      - name: Preserve integration and functional coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-integration
          path: var/coverage/integration-and-functional.php
          if-no-files-found: error
          retention-days: 3

  # ==========================================================================
  # End-to-End Flow Tests
  # ==========================================================================
  # Gates every pull request. These 327 tests are the only ones that exercise
  # the real HTTP flows end to end, and they were previously manual-opt-in only
  # — so the suite that mattered most never ran on a PR.
  #
  # They are also the expensive ones: ~900s of cumulative test time, 84% of the
  # whole suite, averaging 2.8s each. That is affordable as a gate only in
  # parallel, hence paratest below rather than phpunit.
  #
  # A push to either deployment branch now runs the full suite and must pass
  # before that exact commit can be deployed. Tag release preflight remains fast.
  tests-end-to-end:
    name: End-to-End Flow Tests
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.run_e2e == true || github.ref_name == 'main' || github.ref_name == 'develop')) }}
    env:
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage-driver: pcov
          postgres-service-id: ${{ job.services.postgres.id }}
          auth-database-url: ${{ env.AUTH_DATABASE_URL }}
          main-database-url: ${{ env.MAIN_DATABASE_URL }}

      # This suite runs against its own seeded databases — see phpunit.e2e.xml.
      # The other suites need those same tables empty, which is why the two
      # halves cannot share a config.
      - name: Create and seed the end-to-end databases
        env:
          AUTH_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_auth_e2e?serverVersion=16
          MAIN_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_main_e2e?serverVersion=16
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U test -d postgres -c "CREATE DATABASE fireguard_auth_e2e;"
          docker exec "${{ job.services.postgres.id }}" psql -U test -d postgres -c "CREATE DATABASE fireguard_main_e2e;"
          php bin/console doctrine:migrations:migrate --env=test --configuration=config/migrations/auth.yaml --no-interaction
          php bin/console doctrine:migrations:migrate --env=test --configuration=config/migrations/main.yaml --no-interaction
          php bin/console app:fixtures:load --env=test --no-interaction

      # paratest, not phpunit: serially these took ~15 minutes, which is why they
      # were opt-in. Each worker clones the seeded databases into its own copy
      # (see tests/bootstrap.php), which the postgres service user is allowed to
      # do because POSTGRES_USER is a superuser.
      - name: Run end-to-end flow tests with coverage
        env:
          # Overrides the workflow-level URLs and phpunit.e2e.xml's local
          # defaults: a real environment variable wins over both.
          AUTH_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_auth_e2e?serverVersion=16
          MAIN_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_main_e2e?serverVersion=16
        run: |
          vendor/bin/paratest \
            -c phpunit.e2e.xml \
            --processes="$(nproc)" \
            --coverage-clover=var/coverage/e2e.xml \
            --coverage-php=var/coverage/e2e.php \
            --coverage-text \
            --only-summary-for-coverage-text

      - name: Preserve end-to-end coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-e2e
          path: var/coverage/e2e.php
          if-no-files-found: error
          retention-days: 3

  # Merge execution data from the same run, never percentages or older uploads.
  coverage:
    # A skipped partial/manual run must not satisfy the required full-coverage check.
    name: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.run_e2e == true || github.ref_name == 'main' || github.ref_name == 'develop'))) &&
      'Application Coverage (90% lines)' || 'Application Coverage (not requested)' }}
    runs-on: ubuntu-latest
    needs: [tests-unit, tests-integration, tests-end-to-end]
    if: >-
      ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.run_e2e == true || github.ref_name == 'main' || github.ref_name == 'develop'))) }}
    steps:
      - name: Require all test suites to pass
        if: always() && (needs.tests-unit.result != 'success' || needs.tests-integration.result != 'success' || needs.tests-end-to-end.result != 'success')
        run: |
          echo "All five test suites must pass before checking complete coverage."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Exact names, no run-id/token override: only this workflow run is trusted.
      # Ubuntu jobs use the same checkout path embedded in PHPUnit's reports.
      - name: Download unit and architecture coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage-unit
          path: var/coverage/parts

      - name: Download integration and functional coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage-integration
          path: var/coverage/parts

      - name: Download end-to-end coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage-e2e
          path: var/coverage/parts

      - name: Merge complete application coverage
        id: merge
        run: |
          php -d memory_limit=1G bin/merge-coverage.php \
            var/coverage/full/clover.xml \
            var/coverage/parts/unit-and-architecture.php \
            var/coverage/parts/integration-and-functional.php \
            var/coverage/parts/e2e.php

      - name: Enforce 90 percent executable-line coverage
        run: php bin/check-coverage.php var/coverage/full/clover.xml 90

      - name: Preserve complete coverage report
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-complete
          path: var/coverage/full/clover.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        with:
          files: var/coverage/full/clover.xml
          disable_search: true
          flags: application
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  # Community Build has a single branch per project. The selected key and
  # project-scoped token bind this checkout to its independent branch history.
  sonarqube:
    name: SonarQube Quality Gate (fireguard-api-${{ github.ref_name }})
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [coverage]
    permissions:
      contents: read
    steps:
      - name: Checkout analyzed commit with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete coverage from this run
        uses: actions/download-artifact@v4
        with:
          name: api-coverage-complete
          path: var/coverage/full

      - name: Require nonempty complete Clover report
        run: |
          test -s var/coverage/full/clover.xml
          grep -q '<coverage ' var/coverage/full/clover.xml

      - name: Require SonarQube host configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo 'SONAR_HOST_URL is required'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'Branch SonarQube token is required'; exit 1; }

      - name: Run SonarQube scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}
        with:
          args: >-
            -Dsonar.projectKey=fireguard-api-${{ github.ref_name }}
            -Dsonar.projectName=FireGuard-API-${{ github.ref_name }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=false

      - name: Enforce SonarQube quality gate
        id: gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets[github.ref_name == 'main' && 'SONAR_TOKEN_MAIN' || 'SONAR_TOKEN_DEVELOP'] }}

      - name: Require a passed SonarQube quality gate
        env:
          GATE_STATUS: ${{ steps.gate.outputs.quality-gate-status }}
        run: test "$GATE_STATUS" = PASSED

      - name: Summarize SonarQube result
        if: always()
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          {
            echo '### SonarQube API'
            echo "- Projet : fireguard-api-${GITHUB_REF_NAME}"
            echo "- Branche : ${GITHUB_REF_NAME}"
            echo "- SHA : ${GITHUB_SHA}"
            echo "- Gate : ${{ steps.gate.outputs.quality-gate-status || steps.gate.outcome }}"
            echo "- Rapport : ${SONAR_HOST_URL%/}/dashboard?id=fireguard-api-${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The deployment verifier is security-sensitive: exercise its denial paths
  # independently of live GitHub/SonarQube services on each CI run.
  deployment-verifier-tests:
    name: Deployment Verifier Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.mjs

  # ==========================================================================
  # Symfony Container Lint
  # ==========================================================================
  lint:
    name: Symfony Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Lint Symfony container
        run: php bin/console lint:container --env=dev

      - name: Lint YAML files
        # --parse-tags: several module configs use !tagged_iterator.
        run: php bin/console lint:yaml config --parse-tags

  # ==========================================================================
  # Security Check
  # ==========================================================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}
          install-dependencies: 'false'

      - name: Check for security vulnerabilities
        # --locked audits composer.lock: this job installs no dependencies.
        run: composer audit --locked

  # ===========================================================================
  # Deployment contracts
  # ===========================================================================
  deployment:
    name: Deployment Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREGUARD_IMAGE: ghcr.io/devskylex/fireguard-api:sha-ci
      FIREGUARD_FIXTURES_IMAGE: ghcr.io/devskylex/fireguard-api:sha-ci-fixtures
      COMPOSE_PROJECT_NAME: fireguard-ci-back
      VOLUME_PREFIX: fireguard-ci-back
      API_HOST: api.fireguard.test
      MERCURE_HOST: mercure.fireguard.test
      MAILPIT_HOST: mailpit.fireguard.test
      TRAEFIK_API_ROUTER_NAME: fireguard-ci-api
      TRAEFIK_MERCURE_ROUTER_NAME: fireguard-ci-mercure
      TRAEFIK_MAILPIT_ROUTER_NAME: fireguard-ci-mailpit
      BASIC_AUTH_USERS: 'ci:$$2y$$05$$012345678901234567890uXuK4P4HeWmJyEPGAaJzKYwSuH9nKC'
      BASIC_AUTH_CREDENTIALS: ci:ci-only
      DEFAULT_URI: https://api.fireguard.test
      MERCURE_PUBLIC_URL: https://mercure.fireguard.test/.well-known/mercure
      MERCURE_CORS_ORIGINS: https://app.fireguard.test
      MERCURE_JWT_SECRET: ci-only
      POSTGRES_AUTH_DB: fireguard_auth_ci
      POSTGRES_AUTH_USER: fireguard_auth_ci
      POSTGRES_AUTH_PASSWORD: ci-only
      POSTGRES_MAIN_DB: fireguard_main_ci
      POSTGRES_MAIN_USER: fireguard_main_ci
      POSTGRES_MAIN_PASSWORD: ci-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Validate Ansible syntax
        run: ansible-playbook --syntax-check -i 'localhost,' ansible/deploy.yml

      - name: Validate production and development Compose files
        run: |
          touch .env
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.dev.yaml config --quiet

      - name: Verify Mercure client compatibility and denial paths
        run: python3 scripts/check-mercure-contract.py

  # ==========================================================================
  # Mutation Testing (manual opt-in only)
  # ==========================================================================
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutation == true
    needs: [tests-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PHP workspace
        uses: ./.github/actions/prepare-php-workspace
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, intl, bcmath, zip
          coverage-driver: pcov

      - name: Create JWT keys for tests
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.key 2048
          openssl rsa -in config/jwt/private.key -pubout -out config/jwt/public.key

      - name: Run Infection
        run: php -d memory_limit=1G vendor/bin/infection --show-mutations --only-covering-test-cases
        env:
          APP_ENV: test
          APP_DEBUG: 0

name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  COMPOSER_ALLOW_SUPERUSER: 1
  TEST_AUTH_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_auth_test?serverVersion=16
  TEST_MAIN_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/fireguard_main_test?serverVersion=16

jobs:
  # ==========================================================================
  # Code Style Check
  # ==========================================================================
  cs-check:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: php-cs-fixer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  # ==========================================================================
  # Static Analysis
  # ==========================================================================
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.dist.neon --memory-limit=512M

  # ==========================================================================
  # Architecture Rules (Deptrac)
  # ==========================================================================
  deptrac:
    name: Architecture Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Deptrac
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml

  # ==========================================================================
  # PHPUnit Test Suites
  # ==========================================================================
  tests-unit:
    name: Unit and Architecture Tests
    runs-on: ubuntu-latest
    env:
      AUTH_DATABASE_URL: ${{ env.TEST_AUTH_DATABASE_URL }}
      MAIN_DATABASE_URL: ${{ env.TEST_MAIN_DATABASE_URL }}
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage-driver: pcov
          postgres-service-id: ${{ job.services.postgres.id }}

      - name: Run unit and architecture tests with coverage
        run: |
          vendor/bin/phpunit \
            --testsuite="Architecture Unit Tests,General Unit Tests" \
            --coverage-clover=var/coverage/unit-and-architecture.xml \
            --coverage-text \
            --only-summary-for-coverage-text

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name != 'workflow_call'
        with:
          files: var/coverage/unit-and-architecture.xml
          flags: unit
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  tests-integration:
    name: Integration and Functional Tests
    runs-on: ubuntu-latest
    env:
      AUTH_DATABASE_URL: ${{ env.TEST_AUTH_DATABASE_URL }}
      MAIN_DATABASE_URL: ${{ env.TEST_MAIN_DATABASE_URL }}
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage-driver: pcov
          postgres-service-id: ${{ job.services.postgres.id }}

      - name: Run integration and functional tests with coverage
        run: |
          vendor/bin/phpunit \
            --testsuite="General Integration Tests,General Functional Tests" \
            --coverage-clover=var/coverage/integration-and-functional.xml \
            --coverage-text \
            --only-summary-for-coverage-text

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name != 'workflow_call'
        with:
          files: var/coverage/integration-and-functional.xml
          flags: integration
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  # ==========================================================================
  # End-to-End Flow Tests
  # ==========================================================================
  tests-end-to-end:
    name: End-to-End Flow Tests
    runs-on: ubuntu-latest
    env:
      AUTH_DATABASE_URL: ${{ env.TEST_AUTH_DATABASE_URL }}
      MAIN_DATABASE_URL: ${{ env.TEST_MAIN_DATABASE_URL }}
      APP_ENV: test
      APP_DEBUG: 0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireguard_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL test environment
        uses: ./.github/actions/prepare-postgres-test-environment
        with:
          php-version: ${{ env.PHP_VERSION }}
          postgres-service-id: ${{ job.services.postgres.id }}

      - name: Run end-to-end flow tests
        run: vendor/bin/phpunit --testsuite="E2E Tests"

  # ==========================================================================
  # Symfony Container Lint
  # ==========================================================================
  lint:
    name: Symfony Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint Symfony container
        run: php bin/console lint:container --env=dev

      - name: Lint YAML files
        run: php bin/console lint:yaml config

  # ==========================================================================
  # Security Check
  # ==========================================================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Check for security vulnerabilities
        run: composer audit

  # ==========================================================================
  # Mutation Testing (only on PRs to main)
  # ==========================================================================
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [tests-unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, intl, bcmath, zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create JWT keys for tests
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.key 2048
          openssl rsa -in config/jwt/private.key -pubout -out config/jwt/public.key

      - name: Run Infection
        run: php -d memory_limit=1G vendor/bin/infection --show-mutations --only-covering-test-cases
        env:
          APP_ENV: test
          APP_DEBUG: 0

name: Deploy VPS

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image name
        id: image_name
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select deployed image
        id: image
        run: |
          image_name="${{ steps.image_name.outputs.name }}"
          echo "ref=${image_name}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      VPS_HEALTHCHECK_VALIDATE_CERTS: ${{ vars.VPS_HEALTHCHECK_VALIDATE_CERTS || 'true' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      FIREGUARD_MANAGED_ENV: ${{ vars.FIREGUARD_MANAGED_ENV || 'false' }}
      COMPOSE_PROJECT_NAME: ${{ vars.DOCKER_PROJECT_NAME }}
      VOLUME_PREFIX: ${{ vars.VOLUME_PREFIX }}
      API_HOST: ${{ vars.API_HOST }}
      MERCURE_HOST: ${{ vars.MERCURE_HOST }}
      TRAEFIK_API_ROUTER_NAME: ${{ vars.TRAEFIK_API_ROUTER_NAME }}
      TRAEFIK_MERCURE_ROUTER_NAME: ${{ vars.TRAEFIK_MERCURE_ROUTER_NAME }}
      DEFAULT_URI: ${{ vars.DEFAULT_URI }}
      MERCURE_PUBLIC_URL: ${{ vars.MERCURE_PUBLIC_URL }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      APP_FRONTEND_URL: ${{ vars.APP_FRONTEND_URL }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN }}
      DATABASE_STORAGE_TIMEZONE: ${{ vars.DATABASE_STORAGE_TIMEZONE }}
      GOOGLE_OIDC_CLIENT_ID: ${{ vars.GOOGLE_OIDC_CLIENT_ID }}
      GOOGLE_OIDC_ENABLED: ${{ vars.GOOGLE_OIDC_ENABLED || 'false' }}
      MAILER_FROM: ${{ vars.MAILER_FROM }}
      MERCURE_CORS_ORIGINS: ${{ vars.MERCURE_CORS_ORIGINS }}
      MESSENGER_TRANSPORT_DSN: ${{ vars.MESSENGER_TRANSPORT_DSN }}
      MICROSOFT_OIDC_CLIENT_ID: ${{ vars.MICROSOFT_OIDC_CLIENT_ID }}
      MICROSOFT_OIDC_ENABLED: ${{ vars.MICROSOFT_OIDC_ENABLED || 'false' }}
      OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
      POSTGRES_AUTH_DB: ${{ vars.POSTGRES_AUTH_DB }}
      POSTGRES_AUTH_USER: ${{ vars.POSTGRES_AUTH_USER }}
      POSTGRES_MAIN_DB: ${{ vars.POSTGRES_MAIN_DB }}
      POSTGRES_MAIN_USER: ${{ vars.POSTGRES_MAIN_USER }}
      STORAGE_DSN: ${{ vars.STORAGE_DSN }}
      STRIPE_PRICE_MAX_MONTHLY: ${{ vars.STRIPE_PRICE_MAX_MONTHLY }}
      STRIPE_PRICE_MAX_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_MAX_MONTHLY_AMOUNT }}
      STRIPE_PRICE_MAX_YEARLY: ${{ vars.STRIPE_PRICE_MAX_YEARLY }}
      STRIPE_PRICE_MAX_YEARLY_AMOUNT: ${{ vars.STRIPE_PRICE_MAX_YEARLY_AMOUNT }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_PRICE_PRO_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_PRO_MONTHLY_AMOUNT }}
      STRIPE_PRICE_PRO_YEARLY: ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
      STRIPE_PRICE_PRO_YEARLY_AMOUNT: ${{ vars.STRIPE_PRICE_PRO_YEARLY_AMOUNT }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      GOOGLE_OIDC_CLIENT_SECRET: ${{ secrets.GOOGLE_OIDC_CLIENT_SECRET }}
      MAILER_DSN: ${{ secrets.MAILER_DSN || vars.MAILER_DSN }}
      MERCURE_JWT_SECRET: ${{ secrets.MERCURE_JWT_SECRET }}
      MICROSOFT_OIDC_CLIENT_SECRET: ${{ secrets.MICROSOFT_OIDC_CLIENT_SECRET }}
      OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
      POSTGRES_AUTH_PASSWORD: ${{ secrets.POSTGRES_AUTH_PASSWORD }}
      POSTGRES_MAIN_PASSWORD: ${{ secrets.POSTGRES_MAIN_PASSWORD }}
      SECURITY_LOG_PII_SALT: ${{ secrets.SECURITY_LOG_PII_SALT }}
      SMS_DSN: ${{ secrets.SMS_DSN || vars.SMS_DSN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      WEBHOOK_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate required deployment configuration
        run: |
          case "$GITHUB_REF_NAME" in
            main|develop) ;;
            *) echo "Unsupported deployment branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac

          for value in VPS_HOST VPS_USER VPS_SSH_KEY IMAGE_REF VPS_APP_DIR COMPOSE_PROJECT_NAME VOLUME_PREFIX API_HOST MERCURE_HOST TRAEFIK_API_ROUTER_NAME TRAEFIK_MERCURE_ROUTER_NAME DEFAULT_URI MERCURE_PUBLIC_URL; do
            test -n "${!value}" || { echo "$value is required."; exit 1; }
          done

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Ansible inventory
        run: |
          mkdir -p .deploy
          {
            echo "[fireguard_vps]"
            echo "fireguard ansible_host=${VPS_HOST} ansible_user=${VPS_USER} ansible_port=${VPS_PORT} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3"
          } > .deploy/inventory.ini

      - name: Run Ansible deployment
        run: ansible-playbook -i .deploy/inventory.ini ansible/deploy.yml

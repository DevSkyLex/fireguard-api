name: Deploy VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image name
        id: image_name
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select deployed image
        id: image
        run: |
          image_name="${{ steps.image_name.outputs.name }}"
          echo "ref=${image_name}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/fireguard-sso-api' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      VPS_HEALTHCHECK_VALIDATE_CERTS: ${{ vars.VPS_HEALTHCHECK_VALIDATE_CERTS || 'true' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}

      # ---- Production env file, rendered by ansible/deploy.yml -------------------
      #
      # Off unless FIREGUARD_MANAGED_ENV is true, and the playbook refuses to render
      # while any of these is empty. Scope them to the `production` ENVIRONMENT (this
      # job declares it above), not to the repository: environment scope is what keeps
      # a workflow on another branch from reading them.
      #
      # Adding a key: `.env.example` and this block, in the same pull request. A key
      # with a default in config/packages/env_defaults.yaml belongs in NEITHER.
      FIREGUARD_MANAGED_ENV: ${{ vars.FIREGUARD_MANAGED_ENV || 'false' }}

      # Configuration — readable, diffable, reviewable.
      ADMIN_EMAIL:                     ${{ vars.ADMIN_EMAIL }}
      APP_ENV:                         ${{ vars.APP_ENV }}
      APP_FRONTEND_URL:                ${{ vars.APP_FRONTEND_URL }}
      COOKIE_SECURE:                   ${{ vars.COOKIE_SECURE }}
      CORS_ALLOW_ORIGIN:               ${{ vars.CORS_ALLOW_ORIGIN }}
      DATABASE_STORAGE_TIMEZONE:       ${{ vars.DATABASE_STORAGE_TIMEZONE }}
      DEFAULT_URI:                     ${{ vars.DEFAULT_URI }}
      MAILER_FROM:                     ${{ vars.MAILER_FROM }}
      MERCURE_CORS_ORIGINS:            ${{ vars.MERCURE_CORS_ORIGINS }}
      MERCURE_PUBLIC_URL:              ${{ vars.MERCURE_PUBLIC_URL }}
      MERCURE_URL:                     ${{ vars.MERCURE_URL }}
      MESSENGER_TRANSPORT_DSN:         ${{ vars.MESSENGER_TRANSPORT_DSN }}
      MFA_ENABLED:                     ${{ vars.MFA_ENABLED }}
      OAUTH_ISSUER:                    ${{ vars.OAUTH_ISSUER }}
      OLLAMA_BASE_URL:                 ${{ vars.OLLAMA_BASE_URL }}
      POSTGRES_AUTH_DB:                ${{ vars.POSTGRES_AUTH_DB }}
      POSTGRES_AUTH_USER:              ${{ vars.POSTGRES_AUTH_USER }}
      POSTGRES_MAIN_DB:                ${{ vars.POSTGRES_MAIN_DB }}
      POSTGRES_MAIN_USER:              ${{ vars.POSTGRES_MAIN_USER }}
      STORAGE_DSN:                     ${{ vars.STORAGE_DSN }}
      STRIPE_PRICE_MAX_MONTHLY:        ${{ vars.STRIPE_PRICE_MAX_MONTHLY }}
      STRIPE_PRICE_MAX_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_MAX_MONTHLY_AMOUNT }}
      STRIPE_PRICE_MAX_YEARLY:         ${{ vars.STRIPE_PRICE_MAX_YEARLY }}
      STRIPE_PRICE_MAX_YEARLY_AMOUNT:  ${{ vars.STRIPE_PRICE_MAX_YEARLY_AMOUNT }}
      STRIPE_PRICE_PRO_MONTHLY:        ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_PRICE_PRO_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_PRO_MONTHLY_AMOUNT }}
      STRIPE_PRICE_PRO_YEARLY:         ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
      STRIPE_PRICE_PRO_YEARLY_AMOUNT:  ${{ vars.STRIPE_PRICE_PRO_YEARLY_AMOUNT }}

      # Secrets — write-only. A wrong value here is applied, not rejected:
      # the playbook feeds AUTH_DATABASE_URL to ALTER USER on the live database.
      APP_SECRET:                      ${{ secrets.APP_SECRET }}
      AUTH_DATABASE_URL:               ${{ secrets.AUTH_DATABASE_URL }}
      MAILER_DSN:                      ${{ secrets.MAILER_DSN }}
      MAIN_DATABASE_URL:               ${{ secrets.MAIN_DATABASE_URL }}
      MERCURE_JWT_SECRET:              ${{ secrets.MERCURE_JWT_SECRET }}
      OAUTH_ENCRYPTION_KEY:            ${{ secrets.OAUTH_ENCRYPTION_KEY }}
      POSTGRES_AUTH_PASSWORD:          ${{ secrets.POSTGRES_AUTH_PASSWORD }}
      POSTGRES_MAIN_PASSWORD:          ${{ secrets.POSTGRES_MAIN_PASSWORD }}
      REDIS_URL:                       ${{ secrets.REDIS_URL }}
      SECURITY_LOG_PII_SALT:           ${{ secrets.SECURITY_LOG_PII_SALT }}
      SMS_DSN:                         ${{ secrets.SMS_DSN }}
      STRIPE_SECRET_KEY:               ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET:           ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      WEBHOOK_ENCRYPTION_KEY:          ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$IMAGE_REF"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Ansible inventory
        run: |
          mkdir -p .deploy
          {
            echo "[fireguard_vps]"
            echo "fireguard ansible_host=${VPS_HOST} ansible_user=${VPS_USER} ansible_port=${VPS_PORT} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3"
          } > .deploy/inventory.ini

      - name: Run Ansible deployment
        run: |
          ansible-playbook -i .deploy/inventory.ini ansible/deploy.yml

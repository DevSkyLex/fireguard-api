name: Deploy VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image name
        id: image_name
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select deployed image
        id: image
        run: |
          image_name="${{ steps.image_name.outputs.name }}"
          echo "ref=${image_name}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/fireguard-sso-api' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$IMAGE_REF"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Ansible inventory
        run: |
          mkdir -p .deploy
          {
            echo "[fireguard_vps]"
            echo "fireguard ansible_host=${VPS_HOST} ansible_user=${VPS_USER} ansible_port=${VPS_PORT} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3"
          } > .deploy/inventory.ini

      - name: Run Ansible deployment
        run: |
          ansible-playbook -i .deploy/inventory.ini ansible/deploy.yml

name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'CI run ID supplied by the automatic deployment router (leave blank for manual deployment)'
        required: false
        type: string
      image_ref:
        description: 'Existing API image tag or digest to roll back to (leave empty to build this branch)'
        required: false
        type: string
      reset_development_fixtures:
        description: 'Purge both development databases and reload the fixture baseline'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: Verify source CI and image provenance
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      source-branch: ${{ steps.context.outputs.source-branch }}
      source-sha: ${{ steps.image.outputs.source-sha || steps.context.outputs.source-sha }}
      deploy-environment: ${{ steps.context.outputs.deploy-environment }}
      image-ref: ${{ steps.image.outputs.image-ref }}
      verified-run-id: ${{ steps.verify.outputs.verified-run-id }}
      should-deploy: ${{ steps.changes.outputs.should-deploy || 'true' }}
    steps:
      - name: Checkout trusted deployment verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for deployment verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve deployment event
        id: context
        run: node .github/scripts/deployment-context.mjs

      - name: Require SonarQube deployment readiness
        env:
          SONAR_DEPLOYMENTS_READY: ${{ vars[steps.context.outputs.source-branch == 'main' && 'SONAR_READY_MAIN' || 'SONAR_READY_DEVELOP'] }}
        run: |
          test "$SONAR_DEPLOYMENTS_READY" = 'true' || {
            echo 'SonarQube baseline is not approved for this branch (SONAR_READY_MAIN/DEVELOP must be true).'
            exit 1
          }

      - name: Validate rollback option
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          IMAGE_INPUT: ${{ inputs.image_ref }}
          RESET_DEVELOPMENT_FIXTURES: ${{ inputs.reset_development_fixtures && 'true' || 'false' }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: |
          if [ -n "$IMAGE_INPUT" ] && [ "$RESET_DEVELOPMENT_FIXTURES" = true ]; then
            echo 'Fixture reset requires a freshly built development image.'
            exit 1
          fi
          if [ "$RESET_DEVELOPMENT_FIXTURES" = true ] && [ "$SOURCE_BRANCH" != develop ]; then
            echo 'Fixture reset is restricted to develop.'
            exit 1
          fi

      - name: Set up Docker Buildx for image inspection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry for image inspection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve and verify existing image for rollback
        id: image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ inputs.image_ref }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: node .github/scripts/resolve-image.mjs

      - name: Verify exact CI and SonarQube gate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
          SOURCE_SHA: ${{ steps.image.outputs.source-sha || steps.context.outputs.source-sha }}
          EXPECTED_RUN_ID: ${{ github.event_name == 'workflow_run' && steps.context.outputs.run-id || inputs.source_run_id }}
          SONAR_PROJECT_PREFIX: fireguard-api
          SONAR_DEPLOYMENTS_READY: ${{ vars[steps.context.outputs.source-branch == 'main' && 'SONAR_READY_MAIN' || 'SONAR_READY_DEVELOP'] }}
        run: node .github/scripts/verify-ci.mjs

      - name: Download original push context
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-push-context
          path: ci-push-context
          run-id: ${{ steps.context.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Exclude documentation-only pushes
        id: changes
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          CI_CONTEXT_PATH: ci-push-context/ci-push-context.json
          SOURCE_SHA: ${{ steps.context.outputs.source-sha }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: node .github/scripts/changed-files.mjs

  # workflow_run executes from the default branch, which cannot enter a
  # development environment restricted to develop. Dispatch a fresh run at
  # the verified source branch so GitHub enforces its environment policy.
  route:
    name: Route validated push to its deployment branch
    if: ${{ github.event_name == 'workflow_run' && needs.guard.result == 'success' && needs.guard.outputs.should-deploy == 'true' }}
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch branch-bound deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.guard.outputs.source-branch }}
          VERIFIED_RUN_ID: ${{ needs.guard.outputs.verified-run-id }}
        run: |
          test -n "$VERIFIED_RUN_ID"
          gh workflow run deploy-vps.yml --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_BRANCH" -f "source_run_id=$VERIFIED_RUN_ID"

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: guard
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && needs.guard.outputs.should-deploy == 'true' &&
      needs.guard.outputs.image-ref == '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
      fixture-image-ref: ${{ steps.image.outputs.fixture-ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image name
        id: image_name
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=raw,value=sha-${{ needs.guard.outputs.source-sha }}
            type=raw,value=latest,enable=${{ needs.guard.outputs.source-branch == 'main' }}
            type=raw,value=develop,enable=${{ needs.guard.outputs.source-branch == 'develop' }}

      - name: Build and push Docker image
        id: prod_image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.source-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract fixture image metadata
        id: fixture_meta
        if: needs.guard.outputs.source-branch == 'develop' && github.event_name == 'workflow_dispatch' && inputs.reset_development_fixtures
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: type=raw,value=sha-${{ needs.guard.outputs.source-sha }}-fixtures

      - name: Build and push fixture image
        id: fixtures_image
        if: needs.guard.outputs.source-branch == 'develop' && github.event_name == 'workflow_dispatch' && inputs.reset_development_fixtures
        uses: docker/build-push-action@v5
        with:
          context: .
          target: fixtures
          push: true
          tags: ${{ steps.fixture_meta.outputs.tags }}
          labels: |
            ${{ steps.fixture_meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.source-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select deployed image
        id: image
        env:
          PROD_DIGEST: ${{ steps.prod_image.outputs.digest }}
          FIXTURES_DIGEST: ${{ steps.fixtures_image.outputs.digest }}
          RESET_DEVELOPMENT_FIXTURES: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_development_fixtures && 'true' || 'false' }}
        run: |
          image_name="${{ steps.image_name.outputs.name }}"
          test -n "$PROD_DIGEST"
          echo "ref=${image_name}@${PROD_DIGEST}" >> "$GITHUB_OUTPUT"
          if [ "$RESET_DEVELOPMENT_FIXTURES" = "true" ]; then
            test -n "$FIXTURES_DIGEST"
            echo "fixture-ref=${image_name}@${FIXTURES_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "fixture-ref=${image_name}@${PROD_DIGEST}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [guard, build]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
      needs.guard.result == 'success' && needs.guard.outputs.should-deploy == 'true' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && needs.guard.outputs.image-ref != '')) }}
    environment: ${{ needs.guard.outputs.deploy-environment }}
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_ENVIRONMENT: ${{ needs.guard.outputs.deploy-environment }}
      SOURCE_BRANCH: ${{ needs.guard.outputs.source-branch }}
      SOURCE_SHA: ${{ needs.guard.outputs.source-sha }}
      IMAGE_REF: ${{ needs.guard.outputs.image-ref || needs.build.outputs.image-ref }}
      FIXTURE_IMAGE_REF: ${{ needs.build.outputs.fixture-image-ref || needs.guard.outputs.image-ref }}
      RESET_DEVELOPMENT_FIXTURES: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_development_fixtures && 'true' || 'false' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HEALTHCHECK_URL: ${{ vars.VPS_HEALTHCHECK_URL }}
      VPS_HEALTHCHECK_VALIDATE_CERTS: ${{ vars.VPS_HEALTHCHECK_VALIDATE_CERTS || 'true' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      FIREGUARD_MANAGED_ENV: ${{ vars.FIREGUARD_MANAGED_ENV || 'false' }}
      COMPOSE_PROJECT_NAME: ${{ vars.DOCKER_PROJECT_NAME }}
      VOLUME_PREFIX: ${{ vars.VOLUME_PREFIX }}
      API_HOST: ${{ vars.API_HOST }}
      MERCURE_HOST: ${{ vars.MERCURE_HOST }}
      MAILPIT_HOST: ${{ vars.MAILPIT_HOST }}
      TRAEFIK_API_ROUTER_NAME: ${{ vars.TRAEFIK_API_ROUTER_NAME }}
      TRAEFIK_MERCURE_ROUTER_NAME: ${{ vars.TRAEFIK_MERCURE_ROUTER_NAME }}
      TRAEFIK_MAILPIT_ROUTER_NAME: ${{ vars.TRAEFIK_MAILPIT_ROUTER_NAME }}
      DEFAULT_URI: ${{ vars.DEFAULT_URI }}
      MERCURE_PUBLIC_URL: ${{ vars.MERCURE_PUBLIC_URL }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      APP_FRONTEND_URL: ${{ vars.APP_FRONTEND_URL }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN }}
      DATABASE_STORAGE_TIMEZONE: ${{ vars.DATABASE_STORAGE_TIMEZONE }}
      GOOGLE_OIDC_CLIENT_ID: ${{ secrets.GOOGLE_OIDC_CLIENT_ID || vars.GOOGLE_OIDC_CLIENT_ID }}
      GOOGLE_OIDC_ENABLED: ${{ vars.GOOGLE_OIDC_ENABLED || 'false' }}
      MAILER_FROM: ${{ vars.MAILER_FROM }}
      MERCURE_CORS_ORIGINS: ${{ vars.MERCURE_CORS_ORIGINS }}
      MESSENGER_TRANSPORT_DSN: ${{ vars.MESSENGER_TRANSPORT_DSN }}
      MICROSOFT_OIDC_CLIENT_ID: ${{ secrets.MICROSOFT_OIDC_CLIENT_ID || vars.MICROSOFT_OIDC_CLIENT_ID }}
      MICROSOFT_OIDC_ENABLED: ${{ vars.MICROSOFT_OIDC_ENABLED || 'false' }}
      OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
      POSTGRES_AUTH_DB: ${{ vars.POSTGRES_AUTH_DB }}
      POSTGRES_AUTH_USER: ${{ vars.POSTGRES_AUTH_USER }}
      POSTGRES_MAIN_DB: ${{ vars.POSTGRES_MAIN_DB }}
      POSTGRES_MAIN_USER: ${{ vars.POSTGRES_MAIN_USER }}
      STORAGE_DSN: ${{ vars.STORAGE_DSN }}
      STRIPE_PRICE_MAX_MONTHLY: ${{ vars.STRIPE_PRICE_MAX_MONTHLY }}
      STRIPE_PRICE_MAX_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_MAX_MONTHLY_AMOUNT }}
      STRIPE_PRICE_MAX_YEARLY: ${{ vars.STRIPE_PRICE_MAX_YEARLY }}
      STRIPE_PRICE_MAX_YEARLY_AMOUNT: ${{ vars.STRIPE_PRICE_MAX_YEARLY_AMOUNT }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_PRICE_PRO_MONTHLY_AMOUNT: ${{ vars.STRIPE_PRICE_PRO_MONTHLY_AMOUNT }}
      STRIPE_PRICE_PRO_YEARLY: ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
      STRIPE_PRICE_PRO_YEARLY_AMOUNT: ${{ vars.STRIPE_PRICE_PRO_YEARLY_AMOUNT }}
      BASIC_AUTH_CREDENTIALS: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
      BASIC_AUTH_USERS: ${{ secrets.BASIC_AUTH_USERS }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      GOOGLE_OIDC_CLIENT_SECRET: ${{ secrets.GOOGLE_OIDC_CLIENT_SECRET }}
      MAILER_DSN: ${{ secrets.MAILER_DSN || vars.MAILER_DSN }}
      MERCURE_JWT_SECRET: ${{ secrets.MERCURE_JWT_SECRET }}
      MICROSOFT_OIDC_CLIENT_SECRET: ${{ secrets.MICROSOFT_OIDC_CLIENT_SECRET }}
      OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
      TOTP_ENCRYPTION_KEYS: ${{ secrets.TOTP_ENCRYPTION_KEYS || '{}' }}
      TOTP_ENCRYPTION_WRITE_KEY: ${{ vars.TOTP_ENCRYPTION_WRITE_KEY }}
      POSTGRES_AUTH_PASSWORD: ${{ secrets.POSTGRES_AUTH_PASSWORD }}
      POSTGRES_MAIN_PASSWORD: ${{ secrets.POSTGRES_MAIN_PASSWORD }}
      SECURITY_LOG_PII_SALT: ${{ secrets.SECURITY_LOG_PII_SALT }}
      SMS_DSN: ${{ secrets.SMS_DSN || vars.SMS_DSN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      WEBHOOK_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source-sha }}

      - name: Validate required deployment configuration
        run: |
          case "$SOURCE_BRANCH" in
            main|develop) ;;
            *) echo "Unsupported deployment branch: $SOURCE_BRANCH"; exit 1 ;;
          esac

          case "$RESET_DEVELOPMENT_FIXTURES" in
            true|false) ;;
            *) echo "RESET_DEVELOPMENT_FIXTURES must be true or false."; exit 1 ;;
          esac

          if [ "$RESET_DEVELOPMENT_FIXTURES" = "true" ] && [ "$DEPLOY_ENVIRONMENT" != "development" ]; then
            echo "Fixture reset is restricted to the development environment."
            exit 1
          fi

          for value in VPS_HOST VPS_USER VPS_SSH_KEY IMAGE_REF VPS_APP_DIR COMPOSE_PROJECT_NAME VOLUME_PREFIX API_HOST MERCURE_HOST TRAEFIK_API_ROUTER_NAME TRAEFIK_MERCURE_ROUTER_NAME DEFAULT_URI MERCURE_PUBLIC_URL; do
            test -n "${!value}" || { echo "$value is required."; exit 1; }
          done

          if [ "$DEPLOY_ENVIRONMENT" = "development" ]; then
            for value in MAILPIT_HOST TRAEFIK_MAILPIT_ROUTER_NAME BASIC_AUTH_USERS BASIC_AUTH_CREDENTIALS; do
              test -n "${!value}" || { echo "$value is required for development."; exit 1; }
            done
          fi

          if [ "$RESET_DEVELOPMENT_FIXTURES" = "true" ]; then
            test -n "$FIXTURE_IMAGE_REF" || { echo "FIXTURE_IMAGE_REF is required to reset development fixtures."; exit 1; }
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Ansible inventory
        run: |
          mkdir -p .deploy
          {
            echo "[fireguard_vps]"
            echo "fireguard ansible_host=${VPS_HOST} ansible_user=${VPS_USER} ansible_port=${VPS_PORT} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519 ansible_python_interpreter=/usr/bin/python3"
          } > .deploy/inventory.ini

      - name: Run Ansible deployment
        run: ansible-playbook -i .deploy/inventory.ini ansible/deploy.yml

# CI enforces the complete executable-line threshold without relying on Codecov.
# Codecov receives the same merged report once all five suites have passed.

coverage:
  precision: 2
  round: down
  range: '90...100'

  status:
    # Keep the existing changed-line target alongside the complete source floor.
    patch:
      default:
        target: 90%
        threshold: 0%
        # All application sources, including API resources, are measured.
        if_ci_failed: error

    project:
      default:
        target: 90%
        threshold: 0%
        if_ci_failed: error

# A missing current report must never be replaced with an older suite result.
flag_management:
  default_rules:
    carryforward: false

comment:
  layout: 'reach, diff, flags, components, files'
  behavior: default
  require_changes: true

github_checks:
  annotations: true

deptrac:
  paths:
    - ./src
  exclude_files:
    - "#.*Tests.*#"
  layers:
    # Shared layers
    - name: SharedDomain
      collectors:
        - type: classLike
          value: '^Shared\\\\Domain\\\\.*'
    - name: SharedApplication
      collectors:
        - type: classLike
          value: '^Shared\\\\Application\\\\.*'
    - name: SharedInfrastructure
      collectors:
        - type: classLike
          value: '^Shared\\\\Infrastructure\\\\.*'
    # Module layers (Auth, User, Client, Tenant, Session)
    - name: Domain
      collectors:
        - type: classLike
          value: '^(Auth|User|Client|Tenant|Session)\\\\Domain\\\\.*'
    - name: Application
      collectors:
        - type: classLike
          value: '^(Auth|User|Client|Tenant|Session)\\\\Application\\\\.*'
    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^(Auth|User|Client|Tenant|Session)\\\\Infrastructure\\\\.*'
    - name: Presentation
      collectors:
        - type: classLike
          value: '^(Auth|User|Client|Tenant|Session)\\\\Presentation\\\\.*'
  ruleset:
    SharedDomain: []
    SharedApplication:
      - SharedDomain
    SharedInfrastructure:
      - SharedApplication
      - SharedDomain
    Domain:
      - SharedDomain
    Application:
      - Domain
      - SharedDomain
      - SharedApplication
    Infrastructure:
      - Application
      - Domain
      - SharedDomain
      - SharedApplication
    Presentation:
      - Application
      - SharedDomain
      - SharedApplication

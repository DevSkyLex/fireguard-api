x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG:-}
      FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
      SERVER_NAME: ":8000"
      SERVER_ROOT: public/
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      # Public-facing URLs. Unlike the internal REDIS_URL/MERCURE_URL above, these
      # are resolved ONLY on the HTTP request path (the router's default_uri and the
      # Mercure hub's public_url), never by the migrate/cache/rbac deploy steps — so
      # if they are absent from .env, every deploy step passes green while every
      # request 500s with EnvNotFoundException. Pin them here (they match the Traefik
      # Host() rules below) so the running container never depends on .env drift.
      MERCURE_PUBLIC_URL: https://mercure.fireguard.valentin-fortin.pro/.well-known/mercure
      DEFAULT_URI: https://api.fireguard.valentin-fortin.pro
    networks:
      - default
      - traefik_proxy
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # API Symfony
      - "traefik.http.routers.fireguard-api.rule=Host(`api.fireguard.valentin-fortin.pro`)"
      - "traefik.http.routers.fireguard-api.entrypoints=websecure"
      - "traefik.http.routers.fireguard-api.tls=true"
      - "traefik.http.routers.fireguard-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fireguard-api.priority=10"
      - "traefik.http.routers.fireguard-api.service=fireguard-api"
      - "traefik.http.services.fireguard-api.loadbalancer.server.port=8000"
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Consumer for the dedicated `assistant` Messenger transport.
  #
  # `GenerateAssistantReplyCommand` is routed async, and the module has no
  # synchronous fallback, no cancel endpoint and no server-side wall-clock
  # deadline — so with no consumer a question stays `pending` indefinitely and
  # is indistinguishable from a hung model.
  #
  # Kept out of the `app` container deliberately, for the same reason the
  # transport is separate from `async`: an unresponsive Ollama backend must
  # never starve request handling.
  assistant_worker:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      # The reply consumer publishes to Mercure and generates URLs in a non-HTTP
      # (worker) context, so it needs the same public-facing values as `app`.
      MERCURE_PUBLIC_URL: https://mercure.fireguard.valentin-fortin.pro/.well-known/mercure
      DEFAULT_URI: https://api.fireguard.valentin-fortin.pro
    command:
      ["php", "bin/console", "messenger:consume", "assistant", "--time-limit=3600", "--memory-limit=256M"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app_var_init:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    working_dir: /var/www/html
    entrypoint: ["sh", "-lc"]
    command: >
      set -eu;
      mkdir -p var/cache var/log;
      chown -R 1000:1000 var;
      chmod -R u+rwX,g-rwx,o-rwx var;
    volumes:
      - app_var:/var/www/html/var
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  jwt_init:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    working_dir: /var/www/html
    entrypoint: ["sh", "-lc"]
    command: >
      set -eu;
      mkdir -p config/jwt;
      if [ ! -s config/jwt/private.key ]; then
        openssl genrsa -out config/jwt/private.key 4096;
      fi;
      if [ ! -s config/jwt/public.key ]; then
        openssl rsa -in config/jwt/private.key -pubout -out config/jwt/public.key;
      fi;
      chown 1000:1000 config/jwt/private.key config/jwt/public.key;
      chmod 0400 config/jwt/private.key;
      chmod 0444 config/jwt/public.key;
    volumes:
      - jwt_keys:/var/www/html/config/jwt
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  auth_database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:?Set POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER:?Set POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD}
    volumes:
      - auth_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  main_database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB:?Set POSTGRES_MAIN_DB}
      POSTGRES_USER: ${POSTGRES_MAIN_USER:?Set POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD:?Set POSTGRES_MAIN_PASSWORD}
    volumes:
      - main_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  mercure:
    image: dunglas/mercure:latest
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:?Set MERCURE_CORS_ORIGINS}
    networks:
      - default
      - traefik_proxy
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Mercure
      - "traefik.http.routers.fireguard-mercure.rule=Host(`mercure.fireguard.valentin-fortin.pro`)"
      - "traefik.http.routers.fireguard-mercure.entrypoints=websecure"
      - "traefik.http.routers.fireguard-mercure.tls=true"
      - "traefik.http.routers.fireguard-mercure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fireguard-mercure.priority=20"
      - "traefik.http.routers.fireguard-mercure.service=fireguard-mercure"
      - "traefik.http.services.fireguard-mercure.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

volumes:
  app_var:
  jwt_keys:
  auth_database_data:
  main_database_data:
  redis_data:
  mercure_data:
  mercure_config:

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy

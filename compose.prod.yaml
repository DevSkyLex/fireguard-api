name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

services:
  app:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: 128
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG:-}
      FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
      SERVER_NAME: ":8000"
      SERVER_ROOT: public/
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      # Public-facing URLs. Unlike the internal REDIS_URL/MERCURE_URL above, these
      # are resolved ONLY on the HTTP request path (the router's default_uri and the
      # Mercure hub's public_url), never by the migrate/cache/rbac deploy steps — so
      # if they are absent from .env, every deploy step passes green while every
      # request 500s with EnvNotFoundException. Pin them here (they match the Traefik
      # Host() rules below) so the running container never depends on .env drift.
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
      GEOIP_ENABLED: ${GEOIP_ENABLED:-false}
      GEOIP_DATABASE_PATH: /var/lib/fireguard/geoip/dbip-city-lite.mmdb
      GEOIP_MAX_AGE_DAYS: ${GEOIP_MAX_AGE_DAYS:-45}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    networks:
      - default
      - traefik_proxy
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
      - geoip_data:/var/lib/fireguard/geoip:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # API Symfony
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.rule=Host(`${API_HOST:?Set API_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.tls=true"
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.priority=10"
      - "traefik.http.routers.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.service=${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}"
      - "traefik.http.services.${TRAEFIK_API_ROUTER_NAME:?Set TRAEFIK_API_ROUTER_NAME}.loadbalancer.server.port=8000"
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Consumer for the dedicated `assistant` Messenger transport.
  #
  # `GenerateAssistantReplyCommand` is routed async, and the module has no
  # synchronous fallback, no cancel endpoint and no server-side wall-clock
  # deadline — so with no consumer a question stays `pending` indefinitely and
  # is indistinguishable from a hung model.
  #
  # Kept out of the `app` container deliberately, for the same reason the
  # transport is separate from `async`: an unresponsive Ollama backend must
  # never starve request handling.
  assistant_worker:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      # The reply consumer publishes to Mercure and generates URLs in a non-HTTP
      # (worker) context, so it needs the same public-facing values as `app`.
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
    command:
      ["php", "-d", "memory_limit=1G", "bin/console", "messenger:consume", "assistant", "--time-limit=3600", "--memory-limit=256M"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    healthcheck:
      test: ["CMD", "php", "bin/worker-health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Main-owned transactions enqueue workflow work and durable domain events here.
  # Run messenger:setup-transports before starting consumers after deployment.
  async_worker:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
    command:
      ["php", "-d", "memory_limit=1G", "bin/console", "messenger:consume", "main_outbox", "async", "--time-limit=3600", "--memory-limit=256M"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    healthcheck:
      test: ["CMD", "php", "bin/worker-health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  webhook_worker:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
    command:
      ["php", "-d", "memory_limit=1G", "bin/console", "messenger:consume", "webhook", "--time-limit=3600", "--memory-limit=256M"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    healthcheck:
      test: ["CMD", "php", "bin/worker-health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  scheduler_worker:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
    command:
      ["php", "-d", "memory_limit=1G", "bin/console", "messenger:consume", "scheduler_maintenance", "scheduler_intervention", "scheduler_approval", "scheduler_inspection", "scheduler_organization", "--time-limit=3600", "--memory-limit=256M"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
    healthcheck:
      test: ["CMD", "php", "bin/worker-health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      auth_database:
        condition: service_healthy
      main_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # One-shot job only: the serving app cannot replace the GeoIP database.
  geoip_maintenance:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "1000:1000"
    working_dir: /var/www/html
    env_file: [.env]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?Set MERCURE_PUBLIC_URL}
      DEFAULT_URI: ${DEFAULT_URI:?Set DEFAULT_URI}
      GEOIP_ENABLED: ${GEOIP_ENABLED:-false}
      GEOIP_DATABASE_PATH: /var/lib/fireguard/geoip/dbip-city-lite.mmdb
      GEOIP_MAX_AGE_DAYS: ${GEOIP_MAX_AGE_DAYS:-45}
    entrypoint: ["php", "-d", "memory_limit=1G", "bin/console"]
    command: ["app:geoip:update", "--if-enabled"]
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt:ro
      - geoip_data:/var/lib/fireguard/geoip
    labels: ["traefik.enable=false"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  backup_files:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "1000:1000"
    entrypoint: ["tar"]
    command: ["-cf", "-", "-C", "/snapshot", "--exclude=./cache", "--exclude=./log", "--exclude=./coverage", "--exclude=./infection", "."]
    volumes:
      - app_var:/snapshot:ro
    labels: ["traefik.enable=false"]
    logging: *default-logging

  geoip_volume_init:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /var/lib/fireguard/geoip && chmod 0750 /var/lib/fireguard/geoip"]
    volumes:
      - geoip_data:/var/lib/fireguard/geoip
    labels: ["traefik.enable=false"]
    logging: *default-logging

  app_var_init:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    working_dir: /var/www/html
    entrypoint: ["sh", "-lc"]
    # A single list element, not a string. Compose word-splits a string
    # `command`, so `sh -lc` received "set" as its script and every other word
    # as a positional argument: this step ran `set`, printed the environment,
    # and exited 0 without creating anything. One element keeps the script whole.
    command:
      - |
        set -eu
        mkdir -p var/cache var/log
        chown -R 1000:1000 var
        chmod -R u+rwX,g-rwx,o-rwx var
        ls -ld var var/cache var/log
    volumes:
      - app_var:/var/www/html/var
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  jwt_init:
    image: ${FIREGUARD_IMAGE:?Set FIREGUARD_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    working_dir: /var/www/html
    entrypoint: ["sh", "-lc"]
    # A single list element, not a string. Compose word-splits a string
    # `command`, so `sh -lc` received "set" as its script and the rest as
    # positional arguments -- this step ran `set`, printed the environment and
    # exited 0, having generated nothing, on every deploy since it was written.
    command:
      - |
        set -eu
        mkdir -p config/jwt
        chmod 0755 config/jwt

        # A private key openssl cannot read is worse than none, because every
        # guard downstream would keep trusting it. Regenerate the pair instead.
        if [ ! -s config/jwt/private.key ] || ! openssl rsa -in config/jwt/private.key -noout -check >/dev/null 2>&1; then
          echo "jwt_init: no usable private key, generating one"
          rm -f config/jwt/private.key config/jwt/public.key
          openssl genrsa -out config/jwt/private.key 4096
        fi

        # The public key is derived, never authoritative. Compare it byte for byte
        # against what the private key produces and rewrite it on any difference:
        # missing, truncated, corrupt, or left over from an earlier private key.
        # The previous guard tested `-s` alone, so a public key that was present
        # but unusable was kept forever -- which is how production came to serve
        # `{"keys":[]}` while every route behind the firewall answered 500.
        if ! openssl rsa -in config/jwt/private.key -pubout 2>/dev/null | cmp -s - config/jwt/public.key; then
          echo "jwt_init: public key absent or out of step with the private key, deriving it"
          openssl rsa -in config/jwt/private.key -pubout -out config/jwt/public.key
        fi

        chown 1000:1000 config/jwt/private.key config/jwt/public.key
        chmod 0400 config/jwt/private.key
        chmod 0444 config/jwt/public.key

        # Fail here rather than let the application discover it one request at a
        # time: the authenticator reads this file in its constructor, so an
        # unusable key turns every protected route into a 500.
        openssl rsa -pubin -in config/jwt/public.key -noout
        ls -l config/jwt
    volumes:
      - jwt_keys:/var/www/html/config/jwt
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  auth_database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    mem_limit: ${AUTH_DATABASE_MEMORY_LIMIT:-512m}
    cpus: ${AUTH_DATABASE_CPU_LIMIT:-1.0}
    pids_limit: 128
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:?Set POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER:?Set POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD}
    volumes:
      - auth_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  main_database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    mem_limit: ${MAIN_DATABASE_MEMORY_LIMIT:-512m}
    cpus: ${MAIN_DATABASE_CPU_LIMIT:-1.0}
    pids_limit: 128
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB:?Set POSTGRES_MAIN_DB}
      POSTGRES_USER: ${POSTGRES_MAIN_USER:?Set POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD:?Set POSTGRES_MAIN_PASSWORD}
    volumes:
      - main_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: 128
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  mercure:
    # Pin the hub and opt into its compatibility mode for the current clients.
    image: dunglas/mercure:v1.0.2@sha256:e5d8f06a60f2feb5e91f7ba2046d9184f6339b3498b5d2f5adaeb5bcb080bfc7
    mem_limit: ${MERCURE_MEMORY_LIMIT:-256m}
    cpus: ${MERCURE_CPU_LIMIT:-0.5}
    pids_limit: 128
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      MERCURE_EXTRA_DIRECTIVES: |
        protocol_version_compatibility 8
        transport bolt {
          path /data/mercure.db
          size 10000
          cleanup_frequency 0.3
        }
        cors_origins ${MERCURE_CORS_ORIGINS:?Set MERCURE_CORS_ORIGINS}
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        log {
          format filter {
            fields {
              request>uri query {
                replace authorization REDACTED
              }
            }
          }
        }
        log_skip /healthz
        respond /healthz 200
    networks:
      - default
      - traefik_proxy
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Mercure
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.rule=Host(`${MERCURE_HOST:?Set MERCURE_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.tls=true"
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.priority=20"
      - "traefik.http.routers.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.service=${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}"
      - "traefik.http.services.${TRAEFIK_MERCURE_ROUTER_NAME:?Set TRAEFIK_MERCURE_ROUTER_NAME}.loadbalancer.server.port=80"
    # Use the image's transport-aware readiness check on the local admin API.
    logging: *default-logging

volumes:
  geoip_data:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_geoip_data
  app_var:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_app_var
  jwt_keys:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_jwt_keys
  auth_database_data:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_auth_database_data
  main_database_data:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_main_database_data
  redis_data:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_redis_data
  mercure_data:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_mercure_data
  mercure_config:
    name: ${VOLUME_PREFIX:?Set VOLUME_PREFIX}_mercure_config

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy
